<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1C6A57">
<title>FaMed Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: one column on a clinic clipboard. Sticky header, a patient wristband label, a big round microphone; boxes only for interactive panels. */
:root{
  --paper:#F1F4F2; --sheet:#FFFFFF; --ink:#15212A; --muted:#566370; --line:#D2DAD6;
  --op:#1C6A57; --op-ink:#FFFFFF; --op-soft:#DCECE5;
  --pen:#B2382A; --pen-soft:#F8E4E0; --amber:#8F5D0C; --amber-soft:#F5EAD3;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#0E1517; --sheet:#152025; --ink:#E3EBE8; --muted:#97A7A4; --line:#2A383B;
  --op:#5BC1A3; --op-ink:#08201A; --op-soft:#16332B;
  --pen:#F08C7A; --pen-soft:#3B201C; --amber:#E2B05C; --amber-soft:#30271A; color-scheme:dark}}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:var(--op)}
p{margin:0;max-width:65ch}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(23px,5.4vw,32px);line-height:1.18;letter-spacing:-.015em}
h2{font-family:var(--f-display);font-weight:500;font-size:17px;letter-spacing:-.005em}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lede{color:var(--muted);font-size:17px}
.lede-s{color:var(--muted);font-size:15px}
.kv{display:flex;flex-direction:column;gap:6px;margin:4px 0 0}.kv div{display:flex;flex-wrap:wrap;gap:2px 12px}.kv dt{color:var(--muted);min-width:9.5em}.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.abc table{min-width:0}
.voc{display:flex;flex-direction:column;gap:8px}.voc-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}.voc-t{font-weight:600;min-width:12em}.voc-row input{flex:1 1 14em;min-width:0}
.small{font-size:14px}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pre{white-space:pre-wrap;overflow-wrap:anywhere}
.ph{font-family:var(--f-mono);font-size:13px;background:var(--amber-soft);color:var(--amber);padding:1px 5px;border-radius:3px;white-space:nowrap}
.err{color:var(--pen);font-size:14px}
.ok-t{color:var(--op);font-size:14px}

html:not([data-ai="ready"]) .ai-on{display:none!important}
html:not([data-ai="off"]) .ai-off{display:none!important}

/* Header */
.top{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.brand{order:1;display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink)}
.brand b{font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:-.01em}
.brand b em{font-style:normal;color:var(--op)}
.brand span{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.langs{order:2;display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.langs a{font-family:var(--f-mono);font-size:11px;padding:3px 7px;color:var(--muted);text-decoration:none}
.langs a[aria-current]{background:var(--op-soft);color:var(--ink);font-weight:500}
@media (max-width:389px){.brand span{display:none}}
.ai-chip{order:2;margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.ai-chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--amber)}
html[data-ai="ready"] .ai-chip::before{background:var(--op)}
nav.tabs{order:3;width:100%;display:flex;gap:0}
nav.tabs a{flex:1 1 auto;text-align:center;padding:8px 4px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (min-width:400px){nav.tabs a{font-size:14px;padding:8px 4px}}
nav.tabs a[aria-current="page"]{background:var(--sheet);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
@media (min-width:660px){nav.tabs{order:2;width:auto;margin-left:12px}nav.tabs a{flex:none;padding:7px 14px;font-size:15px}.ai-chip{order:3}}

.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:24px 56px;display:flex;flex-direction:column;gap:28px}
section{display:flex;flex-direction:column;gap:12px;min-width:0}
.hero{gap:8px}
.foot{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 32px;color:var(--muted);font-size:13px}

.btn{font:inherit;font-size:15px;font-weight:500;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--op);border-color:var(--op);color:var(--op-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
:focus-visible{outline:2px solid var(--op);outline-offset:2px}
textarea,input[type="search"],input[type="password"],input[type="text"],select{font:inherit;font-size:16px;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);color:var(--ink);line-height:1.5}
textarea{resize:vertical}
select{width:auto;max-width:100%;min-height:40px;padding:6px 10px}
input[type="range"]{width:100%;accent-color:var(--op)}
.lbl{font-weight:600;font-size:15px}
.note{border-radius:var(--r);padding:12px 14px;font-size:14px;background:var(--amber-soft);border:1px solid var(--line);max-width:none}
.note.info{background:var(--op-soft)}

/* Home */
.parts{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:560px){.parts{grid-template-columns:1fr 1fr}}
.part{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--ink);min-width:0}
.part:hover{border-color:var(--op)}
.part .n{font-family:var(--f-mono);font-size:12px;color:var(--op)}
.part .de{font-weight:600;font-size:16px}
.part .ru{color:var(--muted);font-size:14px;flex:1}
.part .go{font-size:14px;color:var(--op);font-weight:500;margin-top:6px}
ul.prog{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet)}
ul.prog li{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 12px;padding:11px 14px;border-top:1px solid var(--line)}
ul.prog li:first-child{border-top:0}
ul.prog .mono{color:var(--muted)}

/* Patient label */
.etikett{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) 52px;gap:12px}
.et-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.et-main .nm{font-family:var(--f-mono);font-weight:500;font-size:15px;letter-spacing:.03em}
.et-main .meta{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.et-main .ls{margin-top:6px;font-size:15px}
.bc{background:repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 3px,var(--ink) 3px 5px,transparent 5px 6px,var(--ink) 6px 7px,transparent 7px 10px,var(--ink) 10px 12px,transparent 12px 13px);opacity:.75;border-radius:1px;min-height:56px}
.case-list{display:flex;flex-direction:column;gap:16px}
.case-card{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink)}
.case-card:hover .etikett{border-color:var(--op)}
.cc-steps{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.cc-steps .ok{color:var(--op)}
.cc-steps .ok::before{content:"✓ "}
.back{font-size:14px;text-decoration:none;align-self:flex-start}

.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.steps a{display:flex;flex-direction:column;gap:1px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--muted);min-width:0}
.steps .k{font-family:var(--f-mono);font-size:11px}
.steps .l{font-weight:600;font-size:14px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps .s{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps a[aria-current="page"]{background:var(--sheet);border-color:var(--op);box-shadow:inset 0 -2px 0 var(--op)}
.steps a.done .k::after{content:" ✓";color:var(--op)}
.tabbody{display:flex;flex-direction:column;gap:24px}

/* Chat */
.chat{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0}
.chat-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px 12px;padding:8px 14px;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.mode{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.mode button{font:inherit;font-family:var(--f-body);font-size:13px;padding:5px 12px;border:0;background:transparent;color:var(--muted);cursor:pointer;min-height:32px}
.mode button[aria-pressed="true"]{background:var(--op-soft);color:var(--ink);font-weight:500}
.log{display:flex;flex-direction:column;gap:10px;padding:14px;max-height:min(50vh,440px);min-height:150px;overflow-y:auto}
.msg{max-width:86%;display:flex;flex-direction:column;gap:2px;min-width:0}
.msg .who{font-family:var(--f-mono);font-size:11px;color:var(--muted);display:flex;gap:10px;align-items:center}
.msg .txt{padding:8px 12px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.me .txt{background:var(--op-soft);border-bottom-right-radius:4px}
.msg.them{align-self:flex-start}
.msg.them .txt{background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:4px}
.say{font:inherit;font-family:var(--f-mono);font-size:11px;color:var(--op);background:none;border:0;padding:2px 0;cursor:pointer}
.typing{color:var(--muted);font-style:italic}
.empty{margin:auto;color:var(--muted);font-size:14px;text-align:center;max-width:38ch;display:flex;flex-direction:column;align-items:center;gap:10px}
.voice-bar{display:flex;align-items:center;gap:14px;padding:12px 14px;border-top:1px solid var(--line)}
.mic{flex:none;width:64px;height:64px;border-radius:50%;border:0;background:var(--op);color:var(--op-ink);display:grid;place-items:center;cursor:pointer;position:relative}
.mic svg{width:26px;height:26px}
.mic.on{background:var(--pen)}
.mic.on::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--pen);animation:pulse 1.2s ease-out infinite}
@keyframes pulse{from{transform:scale(.9);opacity:1}to{transform:scale(1.25);opacity:0}}
@media (prefers-reduced-motion: reduce){.mic.on::after{animation:none;opacity:.6}}
.mic:disabled{opacity:.5;cursor:default}
.live{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.live .state{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.live .said{font-size:15px;overflow-wrap:anywhere}
.chat-form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);align-items:flex-end}
.chat-form textarea{flex:1;min-width:0;min-height:46px}
.chat-actions{padding:0 10px 10px}
.chat .err{padding:0 14px 8px}
.dict{display:flex;align-items:center;gap:12px}
.dict .mic{width:48px;height:48px}
.dict .mic svg{width:20px;height:20px}

/* Checklist */
.cl-wrap>summary{display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;padding:12px 14px;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);font-weight:600;list-style:none}
.cl-wrap>summary::-webkit-details-marker{display:none}
.cl-wrap>summary::after{content:"+";font-family:var(--f-mono);color:var(--muted);font-size:18px;line-height:1}
.cl-wrap[open]>summary{border-radius:var(--r) var(--r) 0 0}
.cl-wrap[open]>summary::after{content:"−"}
.cl-wrap>summary .mono{margin-left:auto;color:var(--muted);font-weight:400}
.cl{background:var(--sheet);border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r) var(--r)}
.cl-item{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.cl-item:first-child{border-top:0}
.box{width:18px;height:18px;border:1.5px solid var(--muted);border-radius:3px;margin-top:3px;display:grid;place-items:center;font-size:12px;line-height:1;color:var(--op-ink)}
.cl-item.ok .box{background:var(--op);border-color:var(--op)}
.cl-item.ok .box::after{content:"✓"}
.cl-item.miss .box{border-color:var(--pen);background:var(--pen-soft)}
.cl-body{display:flex;flex-direction:column;gap:2px;min-width:0}
.cl-t{font-weight:600;font-size:15px}
.cl-q{font-style:italic;color:var(--muted);font-size:14px}
.cl-a{background:var(--paper);border-radius:6px;padding:8px 10px;font-size:14px;margin-top:4px;max-width:none}
.linkbtn{font:inherit;font-size:13px;color:var(--op);background:none;border:0;padding:4px 0;cursor:pointer;text-align:left;align-self:flex-start;min-height:30px}

/* Feedback */
.fb{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:16px;min-width:0}
.fb.thinking{flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;color:var(--muted)}
.fb-sum{font-size:16px}
.fb-sec{display:flex;flex-direction:column;gap:8px}
.fb h3{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.meter{height:8px;background:var(--paper);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--op)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--paper)}
.chip.miss{border-color:var(--pen);color:var(--pen);background:var(--pen-soft)}
ul.corr{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
ul.corr li{display:flex;flex-direction:column;gap:3px;padding-bottom:10px;border-bottom:1px dashed var(--line);overflow-wrap:anywhere}
ul.corr li:last-child{border-bottom:0;padding-bottom:0}
ul.corr del{color:var(--pen);text-decoration-thickness:1.5px}
ul.corr ins{color:var(--op);text-decoration:none;font-weight:500}
ul.corr .why{font-size:14px;color:var(--muted)}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}

.muster{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.muster dl{margin:0;display:flex;flex-direction:column;gap:12px}
.muster dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--op)}
.muster dd{margin:2px 0 0;white-space:pre-line;overflow-wrap:anywhere}
.notes-ro>summary{cursor:pointer;color:var(--op);font-size:14px}
.notes-ro .pre{margin-top:8px;background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;max-width:none}
.phr{display:flex;flex-wrap:wrap;gap:6px}
.chip-btn{font:inherit;font-size:13px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer;text-align:left;min-height:36px}
.chip-btn:hover{border-color:var(--op)}

/* Vocab */
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--sheet);align-self:flex-start}
.seg button{font:inherit;font-size:14px;border:0;background:transparent;padding:6px 14px;border-radius:6px;color:var(--muted);cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--op-soft);color:var(--ink);font-weight:500}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:15px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--op);flex:none}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:22px 20px;min-height:210px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.term{font-family:var(--f-display);font-weight:500;font-size:clamp(22px,6vw,30px);line-height:1.2;overflow-wrap:anywhere}
.lay{font-size:19px;font-weight:500}
.ru{color:var(--muted)}
.hint{color:var(--muted);font-size:14px}
.opts{display:grid;gap:8px}
.opt{justify-content:flex-start;text-align:left;font-weight:400;width:100%}
.opt.right{border-color:var(--op);background:var(--op-soft)}
.opt.wrong{border-color:var(--pen);background:var(--pen-soft)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
th,td{padding:8px 12px;text-align:left;border-top:1px solid var(--line);vertical-align:top}
thead th{border-top:0;font-family:var(--f-mono);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.tick{width:32px;height:32px;border-radius:6px;border:1px solid var(--line);background:transparent;color:transparent;cursor:pointer;font-size:15px}
.tick.on{background:var(--op);border-color:var(--op);color:var(--op-ink)}

/* Exam + drill */
.exam-pill{order:2;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--pen-soft);color:var(--pen);text-decoration:none}
@media (min-width:660px){.exam-pill{order:3}}
.exhead{gap:8px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px);z-index:5;background:var(--paper);padding-block:6px}
@media (min-width:660px){.exhead{top:calc(env(safe-area-inset-top,0px) + 56px)}}
.ex-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.ex-clock{font-size:26px;font-weight:500;color:var(--ink)}
.ex-clock.low{color:var(--pen)}
.bar-row{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.steps-ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.drill-form input{flex:1;min-width:0}
html[lang="de"] .c3{display:none}
/* Materials */
.mat-list{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:560px){.mat-list{grid-template-columns:1fr 1fr}}
.mat-sec{gap:10px}
ul.ph-list{list-style:none;margin:0;padding:0;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r)}
.ph-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 14px;border-top:1px solid var(--line);align-items:baseline}
.ph-row:first-child{border-top:0}
.ph-de{font-weight:500;overflow-wrap:anywhere}
.ph-ru{grid-column:1/-1;color:var(--muted);font-size:14px}
.mat-tbl{min-width:0}
.mat-tbl th{width:1%;font-family:var(--f-mono);font-size:13px;font-weight:500;color:var(--op);text-transform:none;letter-spacing:0;border-top:1px solid var(--line)}
.mat-tbl tr:first-child th,.mat-tbl tr:first-child td{border-top:0}
/* Settings */

async function send(id,kind,text){if(freeMode())return sendFree(id,kind,text);const ch=chatOf(id,kind);if(ch.busy)return;
  if(!KEY){ch.err="Fügen Sie in den Einstellungen einen API-Schlüssel hinzu.";paintChat(id,kind);return}
  const c=byId(id);
  if(kind==="aufkl"||kind==="tel")ch.mode="ai";
  if(ch.fin&&kind==="tel")return;
  if(text){ch.turns.push({role:"user",content:text});if(!ch.start)ch.start=Date.now();ch.end=0;if(kind==="patient")trackQ(c,ch,text,false);if(kind==="aufkl")aufklTrack(c,ch,text)}
  ch.busy=true;ch.err="";paintChat(id,kind);
  const system=kind==="patient"?patientRules(c):kind==="aufkl"?aufklRules(c):kind==="tel"?telRules(c):(R.v==="exam"&&fxStep()?oberRulesFx(c):oberRules(c,(R.v==="exam"&&EX&&EX.caseId===id)?EX.vor:draft(id).vor));
  const msgs=normalize(ch.turns.slice(-40),kind==="ober"?(R.v==="exam"&&fxStep()?"(Die Assistenzärztin bzw. der Assistenzarzt kommt zu dir, um einen Fall vorzustellen.)":"(Die Fallvorstellung ist beendet. Bitte stellen Sie Ihre erste Frage.)"):kind==="tel"?"(Das Telefon klingelt, die Ärztin bzw. der Arzt in der Klinik nimmt ab. Beginne das Gespräch.)":"");
  const ctl=new AbortController();ch.ctl=ctl;let reply="";

  catch(e){ch.err=errText(e);if(LIVE.on)liveStop()}
  finally{ch.busy=false;ch.ctl=null;paintChat(id,kind)}
  if(reply&&kind==="tel"&&/wiederhören/i.test(reply)&&ch.turns.some(t=>t.role==="user")){ch.fin=true;LIVE.end=true;telFinish(id)}
  if(reply&&viewIs(id))speakSegs([reply],roleOf(kind,id)).then(liveNext)}

async function runJSON(kind,id,prompt,onOk){const slot=$("#fb-"+kind);

function mkFach([term,lay]){const base=term.replace(/\s*\(.*\)/,"");const ws=base.split(/\s+/);let w=ws[0];for(const x of ws)if(x.length>=w.length)w=x;
  let stem=w.toLowerCase().replace(/ß/g,"ss");if(stem.length>6)stem=stem.slice(0,-1);
  return {term:base,lay,re:new RegExp("\\s"+stem.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"))}}
const AFACH=AUFKL_FACH_RAW.map(mkFach);
function findFachA(n){for(const f of AFACH)if(f.re.test(n))return f;return findFach(n)}

/* spelling: codewords (traditional and DIN 5009), letter names, single letters; "K wie Kaufmann" counts once */
const SPELL_CODE={},SPELL_LET={};
ABC.forEach(([l,o,n])=>{const L=l.toLowerCase();SPELL_CODE[o.toLowerCase()]=L;if(n!=="—"&&!/^umlaut /i.test(n))SPELL_CODE[n.toLowerCase()]=L});
[["bertha","b"],["caesar","c"],["konrad","k"],["marta","m"],["siegfried","s"],["xaver","x"],["zeppelin","z"]].forEach(([w,l])=>{SPELL_CODE[w]=l});
"a:a b:be b:bé c:ce c:zeh c:tse d:de d:dee e:eh f:ef f:eff g:ge g:geh h:ha i:ih j:jot k:ka l:el l:ell m:em m:emm n:en n:enn o:oh p:pe p:peh q:qu q:ku q:kuh r:er r:err s:es s:ess t:te t:teh u:uh v:vau v:fau w:we w:weh x:ix x:iks y:ypsilon z:zett z:zet".split(" ").forEach(p=>{const [l,w]=p.split(":");SPELL_LET[w]=l});
"abcdefghijklmnopqrstuvwxyzäöü".split("").forEach(l=>{SPELL_LET[l]=l});
function spellLetters(text){const raw=str(text).split(/[^A-Za-zÄÖÜäöüß]+/).filter(Boolean);let out="";
  const toks=[];raw.forEach(w=>{if(w.length>1&&w===w.toUpperCase()&&/^[A-ZÄÖÜ]+$/.test(w))w.split("").forEach(x=>toks.push(x.toLowerCase()));else toks.push(w.toLowerCase())});
  const one=w=>SPELL_CODE[w]||SPELL_LET[w]||"";
  for(let i=0;i<toks.length;i++){const w=toks[i];
    if(w==="doppel"||w==="doppelt"){const L=one(toks[i+1]||"");if(L){out+=L+L;i++}continue}
    if(w==="umlaut"){const L=one(toks[i+1]||"");if(L){out+=({a:"ä",o:"ö",u:"ü"})[L]||L;i++}continue}
    if(toks[i+1]==="wie"&&SPELL_CODE[toks[i+2]]){out+=SPELL_CODE[toks[i+2]];i+=2;continue}
    out+=one(w)}
  return out.toUpperCase()}
function modelSpell(word){return word.split("").map(ch=>{const r=ABC.find(x=>x[0]===ch);return ch+" wie "+(r?r[1]:ch)}).join(", ")+"."}
function telLines(){const T=TEL_TXT;return [T.intro.w,T.intro.m,T.sur.w,T.sur.m,T.ok,T.dob,T.drug,T.dose,T.end,T.spell,T.retry,T.dobRetry,T.doseRetry,T.next]}

function aufklTrack(c,ch,text){const A=AUFKL[c.id];const n=norm(text);ch.pts=ch.pts||new Set();A.pts.forEach(p=>{if(p[2].test(n))ch.pts.add(p[0])});
  const f=findFachA(n);if(f){ch.fach=ch.fach||[];if(!ch.fach.some(x=>x.term===f.term))ch.fach.push(f)}return {n,f}}
function aufklReply(c,ch,text){const A=AUFKL[c.id];const {n,f}=aufklTrack(c,ch,text);ch.qi=ch.qi||0;ch.qres=ch.qres||[];
  const ask=()=>{if(ch.qi<A.qs.length){const q=A.qs[ch.qi][0];ch.pend={i:ch.qi,tries:0};ch.qi++;ch.exp=0;return [q]}return null};
  if(f)return [FACH_REPLY];
  if(/wie bitte|wiederholen|nicht verstanden/.test(n)&&ch.last)return ch.last;
  if(/auf wiedersehen|tschüss|alles gute|gute besserung/.test(n)){ch.fin=true;return ["Vielen Dank. Auf Wiedersehen."]}
  if(ch.pend){const i=ch.pend.i;if(A.qs[i][1].test(n)){ch.qres[i]=true;ch.pend=null;return [AUFKL_OK[ch.qres.filter(Boolean).length%AUFKL_OK.length]]}
    if(ch.pend.tries<1){ch.pend.tries++;return [AUFKL_UNCLEAR]}ch.qres[i]=false;ch.pend=null;return [AUFKL_MEH]}
  if(ch.turns.length<=2&&/guten (tag|morgen|abend)|hallo|grüss gott/.test(n)&&!(ch.pts&&ch.pts.size))return ["Guten Tag. Schön, dass Sie Zeit für mich haben."];
  const invite=/(haben sie|gibt es)( noch)?( irgendwelche| eine| weitere)? fragen|ist (das|alles) (so )?(klar|verständlich)|noch etwas unklar|alles verstanden/.test(n);
  const consent=/einverstanden|unterschreiben|einwilligung|zustimmen/.test(n);
  if(invite||consent){const q=ask();if(q)return q;if(consent||ch.noMore){ch.fin=true;return [A.end]}ch.noMore=true;return [AUFKL_NOMORE]}
  ch.exp=(ch.exp||0)+1;
  if(ch.exp>=2){const q=ask();if(q)return q}
  ch.ack=(ch.ack||0)+1;return [AUFKL_ACK[ch.ack%AUFKL_ACK.length]]}

function aufklSumHTML(c,ch){const A=AUFKL[c.id];const got=ch.pts||new Set();const ok=A.pts.filter(p=>got.has(p[0]));const miss=A.pts.filter(p=>!got.has(p[0]));const pct=Math.round(ok.length/A.pts.length*100);const free=ch.mode!=="ai";

    <div class="fb-sec"><h3>Fragen der Patientin / des Patienten</h3><ul class="plain">${A.qs.map((q,i)=>{const st=!free?"":ch.qres&&ch.qres[i]===true?"Antwort anerkannt":ch.qres&&ch.qres[i]===false?"Antwort unvollständig":ch.pend&&ch.pend.i===i?"Frage unbeantwortet":"nicht erreicht";

  if(ch.fach&&ch.fach.length)h+=`<div class="fb-sec"><h3>Begriffe, die der Patient nicht verstanden hat</h3><ul class="plain">${ch.fach.map(f=>`<li lang="de"><b>${esc(f.term)}</b> → ${esc(f.lay)}</li>`).join("")}</ul><p class="small muted">Verwenden Sie mit dem Patienten einfache Wörter.</p></div>`;

function sendTel(id,text){const ch=chatOf(id,"tel");const c=byId(id);const T=TEL[id];const g=c.sex==="w"?"w":"m";
  const say=segs=>{ch.turns.push({role:"assistant",content:segs.join(" "),segs});ch.last=segs;ch.err="";paintChat(id,"tel");speakSegs(segs,"nurse").then(liveNext)};
  if(!ch.step){ch.step=1;ch.tries=0;ch.res={};ch.mode="free";if(!ch.start)ch.start=Date.now();say([TEL_TXT.intro[g]]);return}
  if(!text)return;
  if(ch.fin){ch.err="Das Gespräch ist beendet. Tippen Sie auf „Neu beginnen“, um es zu wiederholen.";paintChat(id,"tel");return}
  ch.turns.push({role:"user",content:text});const n=norm(text);const L=spellLetters(text);
  if(/wie bitte|bitte wiederholen|können sie das wiederholen/.test(n)&&L.length<3&&ch.last){say(ch.last);return}
  const next=(nextLine)=>{ch.step++;ch.tries=0;say([TEL_TXT.ok,nextLine])};
  const fail=(retry,nextLine)=>{if(ch.tries<1){ch.tries++;say([retry]);return}ch.step++;ch.tries=0;say([TEL_TXT.next,nextLine])};
  if(ch.step===1){ch.step=2;ch.tries=0;say([TEL_TXT.sur[g]]);return}
  if(ch.step===2){ch.res.sur={ok:L.includes(T.sur),heard:L,tries:ch.tries+1};if(ch.res.sur.ok)return next(TEL_TXT.dob);return fail(L.length?TEL_TXT.retry:TEL_TXT.spell,TEL_TXT.dob)}
  if(ch.step===3){const ok=T.d.test(n)&&T.m.test(n)&&T.y.test(n);ch.res.dob={ok,heard:text,tries:ch.tries+1};if(ok)return next(TEL_TXT.drug);return fail(TEL_TXT.dobRetry,TEL_TXT.drug)}
  if(ch.step===4){ch.res.drug={ok:L.includes(T.drug),heard:L,tries:ch.tries+1};if(ch.res.drug.ok)return next(TEL_TXT.dose);return fail(L.length?TEL_TXT.retry:TEL_TXT.spell,TEL_TXT.dose)}
  if(ch.step===5){const ok=T.mg.test(n)&&T.fr.test(n);ch.res.dose={ok,heard:text,tries:ch.tries+1};
    if(!ok&&ch.tries<1){ch.tries++;say([TEL_TXT.doseRetry]);return}
    ch.step=6;ch.fin=true;ch.end=Date.now();LIVE.end=true;say(ok?[TEL_TXT.end]:[TEL_TXT.next,TEL_TXT.end]);telFinish(id)}}
function telEval(c,ch){if(ch.mode==="free"&&ch.res)return ch.res;const T=TEL[c.id];const us=ch.turns.filter(t=>t.role==="user").map(t=>t.content);
  const any=f=>us.some(f);return {sur:{ok:any(t=>spellLetters(t).includes(T.sur))},dob:{ok:any(t=>{const n=norm(t);return T.d.test(n)&&T.m.test(n)&&T.y.test(n)})},
    drug:{ok:any(t=>spellLetters(t).includes(T.drug))},dose:{ok:any(t=>{const n=norm(t);return T.mg.test(n)&&T.fr.test(n)})}}}

function layStems(lay){return str(lay).toLowerCase().replace(/ß/g,"ss").split(/[^a-zäöü]+/).filter(x=>x.length>=4&&!STOPW.has(x)).map(x=>x.slice(0,4))}

    if(f)msg=`Der Patient versteht das Wort „${f.term}“ nicht. Sagen Sie es einfacher: ${f.lay}.`;
    else if(hit){ok=true;msg="Thema erkannt: Der Patient würde diese Frage verstehen."}

  else{const used=t.f.re.test(n);const hit=layStems(t.f.lay).some(s=>n.includes(s));

    else if(hit){ok=true;msg="Klingt nach einer verständlichen Erklärung."}

function voiceClips(){const M={};const add=(r,t)=>{t=str(t).trim();if(t)(M[r]||(M[r]=new Set())).add(t)};
  const NEG=[...new Set(INTENTS.map(i=>i.neg).filter(Boolean))];
  for(const c of CASES){const r="p_"+c.id;
    c.items.forEach(i=>{add(r,i.a);(i.parts||[]).forEach(p=>add(r,p[1]))});
    NEG.forEach(t=>add(r,t));GEN_REPLIES.forEach(t=>add(r,t));
    const m=c.persona.match(/„([^“]+)“/);if(m)add(r,m[1]);
    oberQs(c).forEach(q=>add("ober",q.q))}
  add("ober",OBER_END);
  MATS.forEach(m=>m.secs.forEach(s=>(s.ph||[]).forEach(p=>add("narr",p[0]))));
  VOCAB.forEach(v=>{add("narr",v[0]);add("narr",v[1])});
  FACH.forEach(f=>add("narr",f.lay));
  CASES.forEach(c=>c.items.forEach(i=>add("narr",i.q)));
  add("narr",TTS_TEST);
  for(const c of CASES){const r="p_"+c.id;const A=AUFKL[c.id];
    [...AUFKL_ACK,...AUFKL_OK,AUFKL_UNCLEAR,AUFKL_MEH,AUFKL_NOMORE,A.end,...A.qs.map(q=>q[0])].forEach(t=>add(r,t));
    sents(A.muster).forEach(t=>add("narr",t));add("narr",modelSpell(TEL[c.id].sur));add("narr",modelSpell(TEL[c.id].drug))}
  telLines().forEach(t=>add("nurse",t));
  HOER.forEach(h=>h.lines.forEach(([w,t])=>add(w==="d"?"ober":h.pv,t)));
  const out={};for(const [r,s] of Object.entries(M))out[r]=[...s];return out}
function vgChars(list){return list.reduce((n,t)=>n+t.length,0)}
function vgOld(r,t){if(VG.redo||!VO.idx||!VO.idx.clips)return null;const k=VO.idx.clips[r+"|"+t];if(!k)return null;if(VG.packOk&&VG.packOk[k[0]]===false)return null;return k}

function vgDefaults(){const used=new Set();const score=(v,g,age)=>{const L=v.labels||{};let s=0;
    if((L.gender||"").toLowerCase()===g)s+=10;const acc=((L.accent||"")+" "+(L.language||"")+" "+(v.name||"")).toLowerCase();if(/german|deutsch|\bde\b/.test(acc))s+=5;
    if((L.age||"").toLowerCase().includes(age))s+=2;return s};
  const prevOf=r=>{const prev=VO.idx&&VO.idx.voices&&VO.idx.voices[r];return prev&&VG.voices.find(v=>v.name===prev)};
  for(const [r] of vgRoles()){const pv=prevOf(r);if(pv){VG.sel[r]=pv.voice_id;used.add(pv.voice_id)}}
  for(const [r,,g,age] of vgRoles()){if(prevOf(r))continue;
    if(VG.sel[r]&&VG.voices.some(v=>v.voice_id===VG.sel[r])&&!used.has(VG.sel[r])){used.add(VG.sel[r]);continue}
    const best=VG.voices.slice().sort((a,b)=>(score(b,g,age)-(used.has(b.voice_id)?20:0))-(score(a,g,age)-(used.has(a.voice_id)?20:0)))[0];
    if(best){VG.sel[r]=best.voice_id;used.add(best.voice_id)}}}

  case "v-toggle":{const t=b.dataset.t;setKnown(t,!known.has(t));const r=$("#v-rows");if(r)r.innerHTML=rowsHTML();const cnt=$("#v-count");if(cnt)cnt.textContent=`Gelernt: ${VOCAB.filter(v=>known.has(v[0])).length} von ${VOCAB.length}`;break}
  }});
function m_render_settings(text,cls){const m=$("#main");m.innerHTML=settingsHTML();paintVoices();const msg=$("#key-msg");if(msg){msg.className="small "+(cls||"");msg.textContent=text}}
main.addEventListener("submit",e=>{const df=e.target.closest(".drill-form");if(df){e.preventDefault();const i=df.querySelector("input");const v=i.value.trim();if(v){i.value="";drillCheck(v)}return}
  const f=e.target.closest(".chat-form");if(!f)return;e.preventDefault();unlockTTS();const ta=f.querySelector("textarea");const v=ta.value.trim();if(!v)return;const cid=curId();if(!cid)return;const ch=chatOf(cid,f.dataset.kind);if(ch.busy)return;ta.value="";send(cid,f.dataset.kind,v)});
main.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing&&e.target.matches(".chat-form textarea")){e.preventDefault();const f=e.target.form;if(f.requestSubmit)f.requestSubmit();else f.dispatchEvent(new Event("submit",{cancelable:true,bubbles:true}))}});
main.addEventListener("input",e=>{const t=e.target;
  if(t.dataset&&t.dataset.fx&&FX){FX[t.dataset.fx]=t.value;if(t.id==="fxdoc"){const w=$("#wc-fxdoc");if(w)w.textContent=words(t.value)+" Wörter"}return}
  if(t.dataset&&t.dataset.voc!=null&&EX&&EX.voc){EX.voc.ans[+t.dataset.voc]=t.value;return}
  if(t.dataset&&t.dataset.exam&&EX){EX[t.dataset.exam]=t.value;if(t.id==="exbrief"){const w=$("#wc-exbrief");if(w)w.textContent=words(t.value)+" Wörter"}return}
  if(t.dataset&&t.dataset.hdraft){draft(t.dataset.hdraft).brief=t.value;saveSoon();const w=$("#wc-hoer");if(w)w.textContent=words(t.value)+" Wörter";return}
  if(t.dataset&&t.dataset.draft&&R.v==="case"){draft(R.id)[t.dataset.draft]=t.value;saveSoon();if(t.id==="brief")wc();return}
  if(t.id==="v-q"){V.q=t.value;const r=$("#v-rows");if(r)r.innerHTML=rowsHTML();return}
  if(t.id==="s-rate"){SET.rate=+t.value;saveSet();const rv=$("#rate-v");if(rv)rv.textContent=(+t.value).toFixed(2)}});
main.addEventListener("change",e=>{const t=e.target;
  if(t.id==="v-cat"){V.cat=t.value;rebuild();paintVocab()}
  else if(t.id==="v-only"){V.only=t.checked;rebuild();paintVocab()}
  else if(t.id==="s-tts"){SET.tts=t.checked;saveSet()}
  else if(t.id==="s-auto"){SET.autosend=t.checked;saveSet()}
  else if(t.id==="s-live"){SET.live=t.checked;saveSet()}
  else if(t.id==="s-voice"){SET.voice=t.value;saveSet()}
  else if(t.id==="ex-min"){SET.examMin=+t.value;saveSet()}
  else if(t.id==="ex-voc"){SET.vocab=t.checked;saveSet();render()}});
window.addEventListener("pagehide",save);
document.addEventListener("visibilitychange",()=>{if(document.hidden){stopRec();paintRec()}});

setInterval(()=>{const cid=curId();if(!cid)return;document.querySelectorAll(".js-timer").forEach(el=>{const ch=chatOf(cid,el.dataset.kind);if(!ch.start){el.textContent="00:00";return}const s=Math.max(0,Math.floor(((ch.end||Date.now())-ch.start)/1000));el.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")})},1000);

render();
})();
</script>
</body>
</html>
