<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1C6A57">
<title>FaMed Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: one column on a clinic clipboard. Sticky header, a patient wristband label, a big round microphone; boxes only for interactive panels. */
:root{
  --paper:#F1F4F2; --sheet:#FFFFFF; --ink:#15212A; --muted:#566370; --line:#D2DAD6;
  --op:#1C6A57; --op-ink:#FFFFFF; --op-soft:#DCECE5;
  --pen:#B2382A; --pen-soft:#F8E4E0; --amber:#8F5D0C; --amber-soft:#F5EAD3;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#0E1517; --sheet:#152025; --ink:#E3EBE8; --muted:#97A7A4; --line:#2A383B;
  --op:#5BC1A3; --op-ink:#08201A; --op-soft:#16332B;
  --pen:#F08C7A; --pen-soft:#3B201C; --amber:#E2B05C; --amber-soft:#30271A; color-scheme:dark}}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:var(--op)}
p{margin:0;max-width:65ch}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(23px,5.4vw,32px);line-height:1.18;letter-spacing:-.015em}
h2{font-family:var(--f-display);font-weight:500;font-size:17px;letter-spacing:-.005em}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lede{color:var(--muted);font-size:17px}
.lede-s{color:var(--muted);font-size:15px}
.kv{display:flex;flex-direction:column;gap:6px;margin:4px 0 0}.kv div{display:flex;flex-wrap:wrap;gap:2px 12px}.kv dt{color:var(--muted);min-width:9.5em}.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.abc table{min-width:0}
.voc{display:flex;flex-direction:column;gap:8px}.voc-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}.voc-t{font-weight:600;min-width:12em}.voc-row input{flex:1 1 14em;min-width:0}
.small{font-size:14px}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pre{white-space:pre-wrap;overflow-wrap:anywhere}
.ph{font-family:var(--f-mono);font-size:13px;background:var(--amber-soft);color:var(--amber);padding:1px 5px;border-radius:3px;white-space:nowrap}
.err{color:var(--pen);font-size:14px}
.ok-t{color:var(--op);font-size:14px}

html:not([data-ai="ready"]) .ai-on{display:none!important}
html:not([data-ai="off"]) .ai-off{display:none!important}

/* Header */
.top{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.brand{order:1;display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink)}
.brand b{font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:-.01em}
.brand b em{font-style:normal;color:var(--op)}
.brand span{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.langs{order:2;display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.langs a{font-family:var(--f-mono);font-size:11px;padding:3px 7px;color:var(--muted);text-decoration:none}
.langs a[aria-current]{background:var(--op-soft);color:var(--ink);font-weight:500}
@media (max-width:389px){.brand span{display:none}}
.ai-chip{order:2;margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.ai-chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--amber)}
html[data-ai="ready"] .ai-chip::before{background:var(--op)}
nav.tabs{order:3;width:100%;display:flex;gap:0}
nav.tabs a{flex:1 1 auto;text-align:center;padding:8px 4px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (min-width:400px){nav.tabs a{font-size:14px;padding:8px 4px}}
nav.tabs a[aria-current="page"]{background:var(--sheet);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
@media (min-width:660px){nav.tabs{order:2;width:auto;margin-left:12px}nav.tabs a{flex:none;padding:7px 14px;font-size:15px}.ai-chip{order:3}}

.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:24px 56px;display:flex;flex-direction:column;gap:28px}
section{display:flex;flex-direction:column;gap:12px;min-width:0}
.hero{gap:8px}
.foot{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 32px;color:var(--muted);font-size:13px}

.btn{font:inherit;font-size:15px;font-weight:500;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--op);border-color:var(--op);color:var(--op-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
:focus-visible{outline:2px solid var(--op);outline-offset:2px}
textarea,input[type="search"],input[type="password"],input[type="text"],select{font:inherit;font-size:16px;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);color:var(--ink);line-height:1.5}
textarea{resize:vertical}
select{width:auto;max-width:100%;min-height:40px;padding:6px 10px}
input[type="range"]{width:100%;accent-color:var(--op)}
.lbl{font-weight:600;font-size:15px}
.note{border-radius:var(--r);padding:12px 14px;font-size:14px;background:var(--amber-soft);border:1px solid var(--line);max-width:none}
.note.info{background:var(--op-soft)}

/* Home */
.parts{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:560px){.parts{grid-template-columns:1fr 1fr}}
.part{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--ink);min-width:0}
.part:hover{border-color:var(--op)}
.part .n{font-family:var(--f-mono);font-size:12px;color:var(--op)}
.part .de{font-weight:600;font-size:16px}
.part .ru{color:var(--muted);font-size:14px;flex:1}
.part .go{font-size:14px;color:var(--op);font-weight:500;margin-top:6px}
ul.prog{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet)}
ul.prog li{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 12px;padding:11px 14px;border-top:1px solid var(--line)}
ul.prog li:first-child{border-top:0}
ul.prog .mono{color:var(--muted)}

/* Patient label */
.etikett{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) 52px;gap:12px}
.et-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.et-main .nm{font-family:var(--f-mono);font-weight:500;font-size:15px;letter-spacing:.03em}
.et-main .meta{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.et-main .ls{margin-top:6px;font-size:15px}
.bc{background:repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 3px,var(--ink) 3px 5px,transparent 5px 6px,var(--ink) 6px 7px,transparent 7px 10px,var(--ink) 10px 12px,transparent 12px 13px);opacity:.75;border-radius:1px;min-height:56px}
.case-list{display:flex;flex-direction:column;gap:16px}
.case-card{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink)}
.case-card:hover .etikett{border-color:var(--op)}
.cc-steps{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.cc-steps .ok{color:var(--op)}
.cc-steps .ok::before{content:"✓ "}
.back{font-size:14px;text-decoration:none;align-self:flex-start}

.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.steps a{display:flex;flex-direction:column;gap:1px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--muted);min-width:0}
.steps .k{font-family:var(--f-mono);font-size:11px}
.steps .l{font-weight:600;font-size:14px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps .s{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps a[aria-current="page"]{background:var(--sheet);border-color:var(--op);box-shadow:inset 0 -2px 0 var(--op)}
.steps a.done .k::after{content:" ✓";color:var(--op)}
.tabbody{display:flex;flex-direction:column;gap:24px}

/* Chat */
.chat{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0}
.chat-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px 12px;padding:8px 14px;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.mode{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.mode button{font:inherit;font-family:var(--f-body);font-size:13px;padding:5px 12px;border:0;background:transparent;color:var(--muted);cursor:pointer;min-height:32px}
.mode button[aria-pressed="true"]{background:var(--op-soft);color:var(--ink);font-weight:500}
.log{display:flex;flex-direction:column;gap:10px;padding:14px;max-height:min(50vh,440px);min-height:150px;overflow-y:auto}
.msg{max-width:86%;display:flex;flex-direction:column;gap:2px;min-width:0}
.msg .who{font-family:var(--f-mono);font-size:11px;color:var(--muted);display:flex;gap:10px;align-items:center}
.msg .txt{padding:8px 12px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.me .txt{background:var(--op-soft);border-bottom-right-radius:4px}
.msg.them{align-self:flex-start}
.msg.them .txt{background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:4px}
.say{font:inherit;font-family:var(--f-mono);font-size:11px;color:var(--op);background:none;border:0;padding:2px 0;cursor:pointer}
.typing{color:var(--muted);font-style:italic}
.empty{margin:auto;color:var(--muted);font-size:14px;text-align:center;max-width:38ch;display:flex;flex-direction:column;align-items:center;gap:10px}
.voice-bar{display:flex;align-items:center;gap:14px;padding:12px 14px;border-top:1px solid var(--line)}
.mic{flex:none;width:64px;height:64px;border-radius:50%;border:0;background:var(--op);color:var(--op-ink);display:grid;place-items:center;cursor:pointer;position:relative}
.mic svg{width:26px;height:26px}
.mic.on{background:var(--pen)}
.mic.on::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--pen);animation:pulse 1.2s ease-out infinite}
@keyframes pulse{from{transform:scale(.9);opacity:1}to{transform:scale(1.25);opacity:0}}
@media (prefers-reduced-motion: reduce){.mic.on::after{animation:none;opacity:.6}}
.mic:disabled{opacity:.5;cursor:default}
.live{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.live .state{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.live .said{font-size:15px;overflow-wrap:anywhere}
.chat-form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);align-items:flex-end}
.chat-form textarea{flex:1;min-width:0;min-height:46px}
.chat-actions{padding:0 10px 10px}
.chat .err{padding:0 14px 8px}
.dict{display:flex;align-items:center;gap:12px}
.dict .mic{width:48px;height:48px}
.dict .mic svg{width:20px;height:20px}

/* Checklist */
.cl-wrap>summary{display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;padding:12px 14px;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);font-weight:600;list-style:none}
.cl-wrap>summary::-webkit-details-marker{display:none}
.cl-wrap>summary::after{content:"+";font-family:var(--f-mono);color:var(--muted);font-size:18px;line-height:1}
.cl-wrap[open]>summary{border-radius:var(--r) var(--r) 0 0}
.cl-wrap[open]>summary::after{content:"−"}
.cl-wrap>summary .mono{margin-left:auto;color:var(--muted);font-weight:400}
.cl{background:var(--sheet);border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r) var(--r)}
.cl-item{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.cl-item:first-child{border-top:0}
.box{width:18px;height:18px;border:1.5px solid var(--muted);border-radius:3px;margin-top:3px;display:grid;place-items:center;font-size:12px;line-height:1;color:var(--op-ink)}
.cl-item.ok .box{background:var(--op);border-color:var(--op)}
.cl-item.ok .box::after{content:"✓"}
.cl-item.miss .box{border-color:var(--pen);background:var(--pen-soft)}
.cl-body{display:flex;flex-direction:column;gap:2px;min-width:0}
.cl-t{font-weight:600;font-size:15px}
.cl-q{font-style:italic;color:var(--muted);font-size:14px}
.cl-a{background:var(--paper);border-radius:6px;padding:8px 10px;font-size:14px;margin-top:4px;max-width:none}
.linkbtn{font:inherit;font-size:13px;color:var(--op);background:none;border:0;padding:4px 0;cursor:pointer;text-align:left;align-self:flex-start;min-height:30px}

/* Feedback */
.fb{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:16px;min-width:0}
.fb.thinking{flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;color:var(--muted)}
.fb-sum{font-size:16px}
.fb-sec{display:flex;flex-direction:column;gap:8px}
.fb h3{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.meter{height:8px;background:var(--paper);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--op)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--paper)}
.chip.miss{border-color:var(--pen);color:var(--pen);background:var(--pen-soft)}
ul.corr{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
ul.corr li{display:flex;flex-direction:column;gap:3px;padding-bottom:10px;border-bottom:1px dashed var(--line);overflow-wrap:anywhere}
ul.corr li:last-child{border-bottom:0;padding-bottom:0}
ul.corr del{color:var(--pen);text-decoration-thickness:1.5px}
ul.corr ins{color:var(--op);text-decoration:none;font-weight:500}
ul.corr .why{font-size:14px;color:var(--muted)}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}

.muster{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.muster dl{margin:0;display:flex;flex-direction:column;gap:12px}
.muster dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--op)}
.muster dd{margin:2px 0 0;white-space:pre-line;overflow-wrap:anywhere}
.notes-ro>summary{cursor:pointer;color:var(--op);font-size:14px}
.notes-ro .pre{margin-top:8px;background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;max-width:none}
.phr{display:flex;flex-wrap:wrap;gap:6px}
.chip-btn{font:inherit;font-size:13px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer;text-align:left;min-height:36px}
.chip-btn:hover{border-color:var(--op)}

/* Vocab */
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--sheet);align-self:flex-start}
.seg button{font:inherit;font-size:14px;border:0;background:transparent;padding:6px 14px;border-radius:6px;color:var(--muted);cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--op-soft);color:var(--ink);font-weight:500}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:15px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--op);flex:none}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:22px 20px;min-height:210px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.term{font-family:var(--f-display);font-weight:500;font-size:clamp(22px,6vw,30px);line-height:1.2;overflow-wrap:anywhere}
.lay{font-size:19px;font-weight:500}
.ru{color:var(--muted)}
.hint{color:var(--muted);font-size:14px}
.opts{display:grid;gap:8px}
.opt{justify-content:flex-start;text-align:left;font-weight:400;width:100%}
.opt.right{border-color:var(--op);background:var(--op-soft)}
.opt.wrong{border-color:var(--pen);background:var(--pen-soft)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
th,td{padding:8px 12px;text-align:left;border-top:1px solid var(--line);vertical-align:top}
thead th{border-top:0;font-family:var(--f-mono);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.tick{width:32px;height:32px;border-radius:6px;border:1px solid var(--line);background:transparent;color:transparent;cursor:pointer;font-size:15px}
.tick.on{background:var(--op);border-color:var(--op);color:var(--op-ink)}

/* Exam + drill */
.exam-pill{order:2;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--pen-soft);color:var(--pen);text-decoration:none}
@media (min-width:660px){.exam-pill{order:3}}
.exhead{gap:8px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px);z-index:5;background:var(--paper);padding-block:6px}
@media (min-width:660px){.exhead{top:calc(env(safe-area-inset-top,0px) + 56px)}}
.ex-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.ex-clock{font-size:26px;font-weight:500;color:var(--ink)}
.ex-clock.low{color:var(--pen)}
.bar-row{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.steps-ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.drill-form input{flex:1;min-width:0}
html[lang="de"] .c3{display:none}
/* Materials */
.mat-list{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:560px){.mat-list{grid-template-columns:1fr 1fr}}
.mat-sec{gap:10px}
ul.ph-list{list-style:none;margin:0;padding:0;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r)}
.ph-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 14px;border-top:1px solid var(--line);align-items:baseline}
.ph-row:first-child{border-top:0}
.ph-de{font-weight:500;overflow-wrap:anywhere}
.ph-ru{grid-column:1/-1;color:var(--muted);font-size:14px}
.mat-tbl{min-width:0}
.mat-tbl th{width:1%;font-family:var(--f-mono);font-size:13px;font-weight:500;color:var(--op);text-transform:none;letter-spacing:0;border-top:1px solid var(--line)}
.mat-tbl tr:first-child th,.mat-tbl tr:first-child td{border-top:0}
/* Settings */

async function callClaude({model,system,messages,max_tokens,signal}){
  if(!KEY)throw {code:"no_key"};
  const body={model,max_tokens:max_tokens||600,messages};if(system)body.system=system;
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal,headers:{"content-type":"application/json","x-api-key":KEY,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify(body)});
  let data=null;try{data=await res.json()}catch(e){}
  if(!res.ok)throw {code:"http",status:res.status,message:data&&data.error&&data.error.message||""};
  const text=arr(data&&data.content).filter(b=>b&&b.type==="text").map(b=>b.text).join("").trim();
  if(!text)throw {code:"empty"};
  return text}
/* If the fast model is ever retired (404), fall back to the review model so the patient keeps talking. */
async function chatCall(system,messages,max_tokens,signal){try{return await callClaude({model:MODEL_CHAT,system,messages,max_tokens,signal})}

function parseJSON(t){t=str(t).trim().replace(/^```(?:json)?\s*/i,"").replace(/```\s*$/,"");try{return JSON.parse(t)}catch(e){}
  const a=t.indexOf("{"),b=t.lastIndexOf("}");if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1))}catch(e){}}throw {code:"invalid_json"}}
function errText(e){if(!e)return "Error.";if(e.name==="AbortError"||e.code==="cancelled")return "";
  if(e.code==="no_key")return "Add an API key in Settings.";
  if(e.code==="http"){const m=str(e.message).toLowerCase();
    if(e.status===401)return "The key does not work. Check it in Settings.";
    if(e.status===400&&m.includes("credit"))return "Your Anthropic balance is too low. Top it up at console.anthropic.com.";
    if(e.status===403)return "This key has no access to this request.";
    if(e.status===404)return "The model is not available for this key.";
    if(e.status===429)return "Too many requests. Wait a minute.";
    if(e.status>=500)return "The Claude service is overloaded. Try again in a minute.";
    return "Request error ("+e.status+"). "+str(e.message)}
  if(e.code==="empty")return "Empty answer. Try again.";
  if(e.code==="invalid_json")return "Could not read the answer. Press the button again.";
  return "No connection to Claude. Check your internet."}
function normalize(turns,kick){const out=[];for(const t of turns){const c=str(t.content).trim();if(!c)continue;const l=out[out.length-1];if(l&&l.role===t.role)l.content+="\n"+c;else out.push({role:t.role,content:c})}
  if(!out.length||out[0].role!=="user")out.unshift({role:"user",content:kick||"(Das Gespräch beginnt.)"});
  if(out[out.length-1].role!=="user")out.push({role:"user",content:"(…)"});return out}

let ttsUnlocked=false;
function unlockTTS(){unlockAudio();if(!TTS||ttsUnlocked)return;try{const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u)}catch(e){}ttsUnlocked=true}
function deVoices(){if(!TTS)return [];try{return speechSynthesis.getVoices().filter(v=>/^de([-_]|$)/i.test(v.lang))}catch(e){return []}}
function pickVoice(){const vs=deVoices();return vs.find(v=>v.voiceURI===SET.voice)||vs.find(v=>/^de[-_]DE/i.test(v.lang))||vs[0]||null}
function speak(text,force,role){return new Promise(res=>{if(!TTS||(!SET.tts&&!force)||!text)return res();let done=false,tm=0;const fin=()=>{if(!done){done=true;clearTimeout(tm);res()}};
  tm=setTimeout(fin,Math.min(30000,2500+text.length*90));
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="de-DE";const v=pickVoice();if(v)u.voice=v;u.rate=+SET.rate||0.95;if(role==="ober")u.pitch=0.85;else if(role==="nurse")u.pitch=1.15;u.onend=fin;u.onerror=fin;speechSynthesis.speak(u)}catch(e){fin()}})}
/* ---------- recorded voice (ElevenLabs packs), falls back to the device voice ---------- */
const AUD=typeof Audio==="function"?new Audio():null;
const VO={idx:null,packs:{},tok:0};
let audUnlocked=false;
function silentWav(){const n=400,b=new ArrayBuffer(44+n),d=new DataView(b);const w=(o,s)=>{for(let i=0;i<s.length;i++)d.setUint8(o+i,s.charCodeAt(i))};
  w(0,"RIFF");d.setUint32(4,36+n,true);w(8,"WAVE");w(12,"fmt ");d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,1,true);d.setUint32(24,8000,true);d.setUint32(28,8000,true);d.setUint16(32,1,true);d.setUint16(34,8,true);w(36,"data");d.setUint32(40,n,true);for(let i=0;i<n;i++)d.setUint8(44+i,128);
  return URL.createObjectURL(new Blob([b],{type:"audio/wav"}))}
function unlockAudio(){if(!AUD||audUnlocked)return;audUnlocked=true;try{AUD.src=silentWav();const p=AUD.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}}
function vClip(role,t){return VO.idx&&VO.idx.clips[role+"|"+str(t).trim()]||null}
function vPack(p){if(!VO.packs[p])VO.packs[p]=fetch(VO.idx.packs[p]).then(r=>{if(!r.ok)throw new Error("pack");return r.arrayBuffer()}).catch(e=>{delete VO.packs[p];throw e});return VO.packs[p]}
function voicePrefetch(role){if(VO.idx&&VO.idx.packs[role])vPack(role).catch(()=>{})}
function stopVoice(){VO.tok++;if(VO.cut){const f=VO.cut;VO.cut=null;f()}if(AUD)try{AUD.pause()}catch(e){}if(TTS)try{speechSynthesis.cancel()}catch(e){}}
async function speakSegs(segs,role,force){segs=arr(segs).map(str).filter(s=>s.trim());if(!segs.length||(!SET.tts&&!force))return true;
  stopVoice();const tok=VO.tok;const clips=segs.map(s=>vClip(role,s));
  if(!AUD||clips.some(c=>!c)){await speak(segs.join(" "),force,role);return tok===VO.tok}
  try{for(const [p,st,len] of clips){const buf=await vPack(p);if(tok!==VO.tok)return false;
      const url=URL.createObjectURL(new Blob([buf.slice(st,st+len)],{type:"audio/mpeg"}));
      AUD.src=url;
      await new Promise((res,rej)=>{VO.cut=res;AUD.onended=res;AUD.onerror=rej;const pr=AUD.play();if(pr&&pr.catch)pr.catch(rej)});
      VO.cut=null;URL.revokeObjectURL(url);if(tok!==VO.tok)return false}
    return true}
  catch(e){VO.cut=null;if(tok!==VO.tok)return false;await speak(segs.join(" "),force,role);return tok===VO.tok}}
(async()=>{try{const r=await fetch("voice-index.json",{cache:"no-cache"});if(r.ok){const j=await r.json();if(j&&j.clips&&j.packs){VO.idx=j;if(j.model&&!VG.busy&&!Object.keys(VG.res).length)VG.model=j.model;if(R.v==="settings"||(R.v==="voices"&&!VG.busy))render()}}}catch(e){}})();
if(TTS){try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{if(R.v==="settings")paintVoices()}}catch(e){}}
function recErr(code){switch(code){
  case "not-allowed":case "service-not-allowed":return "No access to the microphone. Allow the microphone for this page in your browser settings.";
  case "no-speech":return "Nothing heard. Press the microphone and speak a little louder.";

const LIVE={on:false,target:"",miss:0,end:false};
function liveStop(msg){LIVE.on=false;LIVE.miss=0;LIVE.end=false;if(msg)REC.err=msg;paintRec()}
function liveBusy(){return (AUD&&!AUD.paused&&!AUD.ended&&String(AUD.src).startsWith("blob:"))||(TTS&&speechSynthesis.speaking)}
function liveNext(){if(!LIVE.on)return;if(LIVE.end){liveStop();return}
  setTimeout(()=>{if(!LIVE.on||REC.state==="listening")return;const cid=curId();if(!cid||!LIVE.target.startsWith("chat:")){liveStop();return}
    const ch=chatOf(cid,LIVE.target.slice(5));if(ch.busy||liveBusy())return;startRec(LIVE.target,true)},350)}
function startRec(target,auto){
  if(!SR)return;
  if(!auto&&LIVE.on&&LIVE.target===target){if(REC.r)try{REC.r.abort()}catch(e){}REC.r=null;REC.state="idle";REC.text="";stopVoice();liveStop();return}
  if(REC.state==="listening"){if(auto)return;if(REC.r)try{REC.r.stop()}catch(e){}return}
  if(!auto&&SET.live&&target.startsWith("chat:")){LIVE.on=true;LIVE.target=target;LIVE.miss=0;LIVE.end=false}
  stopVoice();
  unlockTTS();
  const r=new SR();r.lang="de-DE";r.interimResults=true;r.continuous=false;r.maxAlternatives=1;
  REC.r=r;REC.target=target;REC.text="";REC.err="";REC.state="listening";paintRec();
  r.onresult=e=>{if(REC.r!==r)return;REC.text=Array.from(e.results).map(x=>x[0].transcript).join(" ").replace(/\s+/g," ").trim();paintRec()};
  r.onerror=e=>{if(REC.r!==r)return;if(e.error==="no-speech"&&LIVE.on)return;REC.err=recErr(e.error);if(LIVE.on&&/not-allowed|audio-capture|network|language/.test(e.error))LIVE.on=false};
  r.onend=()=>{if(REC.r!==r)return;const t=REC.text.trim(),tg=REC.target;REC.state="idle";REC.r=null;
    if(t){REC.err="";if(LIVE.on){LIVE.miss=0;if(/auf wiedersehen|tschüss|tschüs|bis bald|alles gute/i.test(t))LIVE.end=true}deliver(tg,t)}
    else if(LIVE.on&&LIVE.target===tg){LIVE.miss++;if(LIVE.miss<2){paintRec();setTimeout(()=>{if(LIVE.on&&REC.state!=="listening")startRec(tg,true)},200);return}liveStop("Conversation paused. Press the microphone to continue.");return}
    else if(!REC.err)REC.err="Nothing recognized. Try again.";paintRec()};
  try{r.start()}catch(e){REC.state="idle";REC.r=null;if(LIVE.on){liveStop("Conversation paused. Press the microphone to continue.");return}REC.err="Could not turn on the microphone.";paintRec()}}
function stopRec(){LIVE.on=false;LIVE.miss=0;LIVE.end=false;const r=REC.r;REC.r=null;REC.state="idle";REC.text="";REC.err="";if(r)try{r.abort()}catch(e){}}
function deliver(tg,t){const [type,name]=tg.split(":");if(type==="drill"){drillCheck(t);return}
  if(type==="field"){const ta=$("#"+name);if(!ta)return;const sep=ta.value&&!/\s$/.test(ta.value)?" ":"";ta.value+=sep+t;ta.dispatchEvent(new Event("input",{bubbles:true}));return}
  const cid=curId();if(!cid)return;
  if(type==="chat"){if(SET.autosend||LIVE.on)send(cid,name,t);else{const ta=$("#in-"+name);if(ta){ta.value=(ta.value.trim()?ta.value.trim()+" ":"")+t;const f=ta.closest("form");if(f)f.hidden=false;ta.focus()}}}}

    else if(LIVE.on&&LIVE.target===el.dataset.live){st.textContent="Conversation on";sd.textContent="Your partner is answering…";sd.className="said muted"}
    else if(mine&&REC.err){st.textContent="";sd.textContent=REC.err;sd.className="said err"}

function mkFach([term,lay]){const base=term.replace(/\s*\(.*\)/,"");const ws=base.split(/\s+/);let w=ws[0];for(const x of ws)if(x.length>=w.length)w=x;
  let stem=w.toLowerCase().replace(/ß/g,"ss");if(stem.length>6)stem=stem.slice(0,-1);
  return {term:base,lay,re:new RegExp("\\s"+stem.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"))}}
const AFACH=AUFKL_FACH_RAW.map(mkFach);
function findFachA(n){for(const f of AFACH)if(f.re.test(n))return f;return findFach(n)}
const sents=t=>(str(t).match(/[^.!?]+[.!?]+/g)||[str(t)]).map(s=>s.trim()).filter(Boolean);

/* spelling: codewords (traditional and DIN 5009), letter names, single letters; "K wie Kaufmann" counts once */
const SPELL_CODE={},SPELL_LET={};
ABC.forEach(([l,o,n])=>{const L=l.toLowerCase();SPELL_CODE[o.toLowerCase()]=L;if(n!=="—"&&!/^umlaut /i.test(n))SPELL_CODE[n.toLowerCase()]=L});
[["bertha","b"],["caesar","c"],["konrad","k"],["marta","m"],["siegfried","s"],["xaver","x"],["zeppelin","z"]].forEach(([w,l])=>{SPELL_CODE[w]=l});
"a:a b:be b:bé c:ce c:zeh c:tse d:de d:dee e:eh f:ef f:eff g:ge g:geh h:ha i:ih j:jot k:ka l:el l:ell m:em m:emm n:en n:enn o:oh p:pe p:peh q:qu q:ku q:kuh r:er r:err s:es s:ess t:te t:teh u:uh v:vau v:fau w:we w:weh x:ix x:iks y:ypsilon z:zett z:zet".split(" ").forEach(p=>{const [l,w]=p.split(":");SPELL_LET[w]=l});
"abcdefghijklmnopqrstuvwxyzäöü".split("").forEach(l=>{SPELL_LET[l]=l});
function spellLetters(text){const raw=str(text).split(/[^A-Za-zÄÖÜäöüß]+/).filter(Boolean);let out="";
  const toks=[];raw.forEach(w=>{if(w.length>1&&w===w.toUpperCase()&&/^[A-ZÄÖÜ]+$/.test(w))w.split("").forEach(x=>toks.push(x.toLowerCase()));else toks.push(w.toLowerCase())});
  const one=w=>SPELL_CODE[w]||SPELL_LET[w]||"";
  for(let i=0;i<toks.length;i++){const w=toks[i];
    if(w==="doppel"||w==="doppelt"){const L=one(toks[i+1]||"");if(L){out+=L+L;i++}continue}
    if(w==="umlaut"){const L=one(toks[i+1]||"");if(L){out+=({a:"ä",o:"ö",u:"ü"})[L]||L;i++}continue}
    if(toks[i+1]==="wie"&&SPELL_CODE[toks[i+2]]){out+=SPELL_CODE[toks[i+2]];i+=2;continue}
    out+=one(w)}
  return out.toUpperCase()}
function modelSpell(word){return word.split("").map(ch=>{const r=ABC.find(x=>x[0]===ch);return ch+" wie "+(r?r[1]:ch)}).join(", ")+"."}

/* --- Patientenaufklärung --- */
function aufklTrack(c,ch,text){const A=AUFKL[c.id];const n=norm(text);ch.pts=ch.pts||new Set();A.pts.forEach(p=>{if(p[2].test(n))ch.pts.add(p[0])});
  const f=findFachA(n);if(f){ch.fach=ch.fach||[];if(!ch.fach.some(x=>x.term===f.term))ch.fach.push(f)}return {n,f}}
function aufklReply(c,ch,text){const A=AUFKL[c.id];const {n,f}=aufklTrack(c,ch,text);ch.qi=ch.qi||0;ch.qres=ch.qres||[];
  const ask=()=>{if(ch.qi<A.qs.length){const q=A.qs[ch.qi][0];ch.pend={i:ch.qi,tries:0};ch.qi++;ch.exp=0;return [q]}return null};
  if(f)return [FACH_REPLY];
  if(/wie bitte|wiederholen|nicht verstanden/.test(n)&&ch.last)return ch.last;
  if(/auf wiedersehen|tschüss|alles gute|gute besserung/.test(n)){ch.fin=true;return ["Vielen Dank. Auf Wiedersehen."]}
  if(ch.pend){const i=ch.pend.i;if(A.qs[i][1].test(n)){ch.qres[i]=true;ch.pend=null;return [AUFKL_OK[ch.qres.filter(Boolean).length%AUFKL_OK.length]]}
    if(ch.pend.tries<1){ch.pend.tries++;return [AUFKL_UNCLEAR]}ch.qres[i]=false;ch.pend=null;return [AUFKL_MEH]}
  if(ch.turns.length<=2&&/guten (tag|morgen|abend)|hallo|grüss gott/.test(n)&&!(ch.pts&&ch.pts.size))return ["Guten Tag. Schön, dass Sie Zeit für mich haben."];
  const invite=/(haben sie|gibt es)( noch)?( irgendwelche| eine| weitere)? fragen|ist (das|alles) (so )?(klar|verständlich)|noch etwas unklar|alles verstanden/.test(n);
  const consent=/einverstanden|unterschreiben|einwilligung|zustimmen/.test(n);
  if(invite||consent){const q=ask();if(q)return q;if(consent||ch.noMore){ch.fin=true;return [A.end]}ch.noMore=true;return [AUFKL_NOMORE]}

/* --- Telefonat --- */
function sendTel(id,text){const ch=chatOf(id,"tel");const c=byId(id);const T=TEL[id];const g=c.sex==="w"?"w":"m";
  const say=segs=>{ch.turns.push({role:"assistant",content:segs.join(" "),segs});ch.last=segs;ch.err="";paintChat(id,"tel");speakSegs(segs,"nurse").then(liveNext)};
  if(!ch.step){ch.step=1;ch.tries=0;ch.res={};ch.mode="free";if(!ch.start)ch.start=Date.now();say([TEL_TXT.intro[g]]);return}
  if(!text)return;
  if(ch.fin){ch.err="The conversation has ended. Press «Start over» to try again.";paintChat(id,"tel");return}
  ch.turns.push({role:"user",content:text});const n=norm(text);const L=spellLetters(text);
  if(/wie bitte|bitte wiederholen|können sie das wiederholen/.test(n)&&L.length<3&&ch.last){say(ch.last);return}
  const next=(nextLine)=>{ch.step++;ch.tries=0;say([TEL_TXT.ok,nextLine])};
  const fail=(retry,nextLine)=>{if(ch.tries<1){ch.tries++;say([retry]);return}ch.step++;ch.tries=0;say([TEL_TXT.next,nextLine])};
  if(ch.step===1){ch.step=2;ch.tries=0;say([TEL_TXT.sur[g]]);return}
  if(ch.step===2){ch.res.sur={ok:L.includes(T.sur),heard:L,tries:ch.tries+1};if(ch.res.sur.ok)return next(TEL_TXT.dob);return fail(L.length?TEL_TXT.retry:TEL_TXT.spell,TEL_TXT.dob)}
  if(ch.step===3){const ok=T.d.test(n)&&T.m.test(n)&&T.y.test(n);ch.res.dob={ok,heard:text,tries:ch.tries+1};if(ok)return next(TEL_TXT.drug);return fail(TEL_TXT.dobRetry,TEL_TXT.drug)}
  if(ch.step===4){ch.res.drug={ok:L.includes(T.drug),heard:L,tries:ch.tries+1};if(ch.res.drug.ok)return next(TEL_TXT.dose);return fail(L.length?TEL_TXT.retry:TEL_TXT.spell,TEL_TXT.dose)}
  if(ch.step===5){const ok=T.mg.test(n)&&T.fr.test(n);ch.res.dose={ok,heard:text,tries:ch.tries+1};
    if(!ok&&ch.tries<1){ch.tries++;say([TEL_TXT.doseRetry]);return}
    ch.step=6;ch.fin=true;ch.end=Date.now();LIVE.end=true;say(ok?[TEL_TXT.end]:[TEL_TXT.next,TEL_TXT.end]);telFinish(id)}}
function telEval(c,ch){if(ch.mode==="free"&&ch.res)return ch.res;const T=TEL[c.id];const us=ch.turns.filter(t=>t.role==="user").map(t=>t.content);
  const any=f=>us.some(f);return {sur:{ok:any(t=>spellLetters(t).includes(T.sur))},dob:{ok:any(t=>{const n=norm(t);return T.d.test(n)&&T.m.test(n)&&T.y.test(n)})},
    drug:{ok:any(t=>spellLetters(t).includes(T.drug))},dose:{ok:any(t=>{const n=norm(t);return T.mg.test(n)&&T.fr.test(n)})}}}
function telSumHTML(c,ch){const T=TEL[c.id];const r=telEval(c,ch);const rows=[["sur","Surname spelled",T.sur],["dob","Date of birth",T.dob],["drug","Drug spelled",T.drug],["dose","Dosage",T.dose]];
  const ok=rows.filter(x=>r[x[0]]&&r[x[0]].ok).length;

    <div class="fb-sec"><h3>How to spell it</h3><p lang="de">${esc(modelSpell(T.sur))}</p><p lang="de">${esc(modelSpell(T.drug))}</p>${sayAll("tel:"+c.id)}</div>
    <p class="small muted">Speech recognition sometimes confuses letters. Speak slowly, with a short pause after each word: «K wie Kaufmann».</p></div>`}
function telFinish(id){const ch=chatOf(id,"tel");if(!ch.end)ch.end=Date.now();ch.sum=true;const c=byId(id);const r=telEval(c,ch);

const HP={tok:0,on:false,i:-1,n:{},pos:{}};

function hpPaint(h){const pos=HP.pos[h.id]||0;const s=$("#h-state");if(s)s.textContent=HP.on?`Line ${HP.i+1} of ${h.lines.length}`:pos?`Paused · line ${pos+1} of ${h.lines.length}`:`Times played: ${HP.n[h.id]||0}`;
  const p=$('[data-action="h-play"]'),st=$('[data-action="h-stop"]'),rs=$('[data-action="h-restart"]');if(p){p.disabled=HP.on;p.textContent=pos&&!HP.on?"Continue":"Play the conversation"}if(st)st.hidden=!HP.on;if(rs)rs.hidden=!(pos||HP.on)}
async function hoerPlay(h){unlockTTS();stopRec();paintRec();const my=++HP.tok;HP.on=true;let start=HP.pos[h.id]||0;if(start>=h.lines.length)start=0;if(!start)HP.n[h.id]=(HP.n[h.id]||0)+1;HP.i=start;hpPaint(h);
  for(let i=start;i<h.lines.length;i++){if(HP.tok!==my)return;HP.i=i;HP.pos[h.id]=i;hpPaint(h);const [w,t]=h.lines[i];
    const ok=await speakSegs([t],w==="d"?"ober":h.pv,true);
    if(HP.tok!==my)return;if(ok===false){HP.on=false;hpPaint(h);return}
    HP.pos[h.id]=i+1;await new Promise(r=>setTimeout(r,350))}
  if(HP.tok===my){HP.on=false;HP.i=-1;HP.pos[h.id]=0;hpPaint(h)}}

/* ---------- 5-minute drill on weak spots ---------- */
let DR=null;
const STOPW=new Set(["eine","einer","einem","einen","oder","durch","über","sich","nicht","beim","sehr","eines","wenn","dass","statt","ohne"]);
function buildDrill(){const w=weak();const tasks=[];
  const hasIntent=id=>INTENTS.some(it=>it.ids.includes(id));
  const topicIds=(w?w.topics.map(t=>t[0]):[]).filter(id=>id!=="leit"&&hasIntent(id));
  for(const id of [...topicIds,"allerg","med","fam","noxen","voroper","vorerk"]){if(tasks.length>=4)break;if(!tasks.some(t=>t.id===id))tasks.push({type:"topic",id})}
  const terms=[];
  for(const [t] of (w?w.fach:[])){const f=FACH.find(x=>x.term===t);if(f&&terms.length<3&&!terms.includes(f))terms.push(f)}
  for(const f of shuffle(FACH.filter(x=>VOCAB.some(v=>v[0].startsWith(x.term)&&v[3]==="sym")))){if(terms.length>=3)break;if(!terms.includes(f))terms.push(f)}
  terms.forEach(f=>tasks.push({type:"term",f}));
  DR={tasks:shuffle(tasks),i:0,res:[]}}
function layStems(lay){return str(lay).toLowerCase().replace(/ß/g,"ss").split(/[^a-zäöü]+/).filter(x=>x.length>=4&&!STOPW.has(x)).map(x=>x.slice(0,4))}
function drillCheck(text){if(!DR)return;const t=DR.tasks[DR.i];if(!t||DR.res[DR.i])return;const n=norm(text);let ok=false,msg="";
  if(t.type==="topic"){const f=findFach(n);const hit=INTENTS.some(it=>it.ids.includes(t.id)&&it.re.test(n)&&!(it.not&&it.not.test(n)));
    if(f)msg=`The patient will not understand the word “${f.term}”. Say it more simply: ${f.lay}.`;
    else if(hit){ok=true;msg="Topic recognized: the patient would understand this question."}
    else msg="The trainer did not recognize the topic in this sentence."}
  else{const used=t.f.re.test(n);const hit=layStems(t.f.lay).some(s=>n.includes(s));
    if(used)msg=`You repeated the term “${t.f.term}” itself. The patient needs an explanation without it.`;
    else if(hit){ok=true;msg="Looks like an understandable explanation."}
    else msg="The explanation lacks key plain words."}
  DR.res[DR.i]={ok,msg,text};paintDrill()}
function drillShellHTML(){return `<section class="hero"><span class="eyebrow">Weak-spot practice</span><h1>5 minutes on your mistakes</h1><p class="lede">Tasks are built from your previous sessions: topics you forget and terms the patient did not understand. Answer in German by voice.</p></section><section id="drill-body"></section>`}
function paintDrill(){const b=$("#drill-body");if(!b)return;if(!DR)buildDrill();const t=DR.tasks[DR.i];

    ${r?`<div class="fb"><p class="${r.ok?"ok-t":"err"}">${r.ok?"Passed. ":"Not passed. "}${esc(r.msg)}</p><p class="small"><span class="muted">You said:</span> <span lang="de">${esc(r.text)}</span></p><p class="small"><span class="muted">${t.type==="topic"?"Example question":"In plain words"}:</span> <span lang="de">${esc(ex)}</span></p>${(TTS||AUD)?`<button type="button" class="say" data-action="drill-say">listen to the example</button>`:""}</div>`:""}

let FX=null;

function fxStep(){return FX&&!FX.done&&FX.i<FX.steps.length?FX.steps[FX.i]:null}
function fxKind(s){return s.k==="anam"?"patient":s.k==="aufkl"?"aufkl":s.k==="vor"?"ober":null}
function fxName(s){return FX_TITLE[s.k]+(s.k==="vor"?" "+s.n:"")}
function fxWho(s){return s.k==="doc"?hoerOf(s.hid).pname:byId(s.cid).anrede+" "+byId(s.cid).name}
function fxStart(){stopRec();stopVoice();const [B,A,C]=shuffle(CASES.map(c=>c.id));const h=HOER[Math.floor(Math.random()*HOER.length)];
  const ap=[{k:"anam",cid:A,read:0,min:11},{k:"aufkl",cid:B,read:90,min:11}],aa=[{k:"vor",cid:C,read:90,min:11,n:1},{k:"vor",cid:B,read:90,min:11,n:2}];
  const steps=[];(Math.random()<0.5?[ap,aa]:[aa,ap]).forEach((st,si)=>st.forEach(s=>{s.st=si;steps.push(s)}));steps.push({k:"doc",hid:h.id,read:0,min:22,st:2});
  steps.forEach(s=>{const k=fxKind(s);if(k){const ch=CH[s.cid+":"+k];if(ch&&ch.ctl)ch.ctl.abort();delete CH[s.cid+":"+k]}});delete FREE[A];delete COV[A];
  HP.pos[h.id]=0;HP.n[h.id]=0;
  EX=null;FX={steps,i:0,phase:steps[0].read?"read":"talk",t0:Date.now(),notes:"",doc:"",ai:null,done:false};render()}
function fxPhaseLen(){const s=fxStep();if(!s)return 1;return FX.phase==="break"?60:FX.phase==="read"?s.read:s.min*60}
function fxLeft(){if(!fxStep())return 0;return fxPhaseLen()-Math.floor((Date.now()-FX.t0)/1000)}
function fxNext(auto){const s=fxStep();if(!s)return;stopRec();stopVoice();HP.tok++;HP.on=false;
  if(FX.phase==="break")FX.phase=s.read?"read":"talk";
  else if(FX.phase==="read")FX.phase="talk";
  else{const k=fxKind(s);if(k){const ch=chatOf(s.cid,k);if(ch.ctl)ch.ctl.abort();if(!ch.end)ch.end=Date.now()}
    s.dur=Math.min(s.min*60,Math.round((Date.now()-FX.t0)/1000));if(auto)s.timeout=true;
    FX.i++;const n=FX.steps[FX.i];if(!n)fxFinish();else FX.phase=n.st!==s.st?"break":(n.read?"read":"talk")}
  FX.t0=Date.now();if(R.v==="exam")render()}
function fxFinish(){FX.done=true;
  for(const s of FX.steps){
    if(s.k==="anam"){const c=byId(s.cid);const rec=recFromChat(s.cid,chatOf(s.cid,"patient"),"exam");if(s.dur)rec.dur=s.dur;pushHist(rec);

  const m=h.match(/^([a-z]+)-(anamnese|arztbrief|vorstellung)$/);if(m&&byId(m[1]))return {v:"case",id:m[1],tab:m[2]};return {v:"home"}}
function render(){stopRec();HP.tok++;HP.on=false;stopVoice();
  R=route();if(R.v==="exam"&&R.fmt&&!EX&&!FX){SET.fmt=R.fmt;saveSet()}const sect=R.v==="case"||R.v==="famed"?"cases":R.v;
  document.querySelectorAll("[data-lang]").forEach(a=>{a.href=a.dataset.f+(HASH?"#"+HASH:"");if(a.dataset.lang===document.documentElement.lang)a.setAttribute("aria-current","true");else a.removeAttribute("aria-current")});
  document.querySelectorAll("[data-nav]").forEach(a=>{if(a.dataset.nav===sect)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  const m=$("#main");
  if(R.v==="home")m.innerHTML=homeHTML();
  else if(R.v==="vocab"){m.innerHTML=vocabHTML();paintVocab()}
  else if(R.v==="cases")m.innerHTML=casesHTML();
  else if(R.v==="settings"){m.innerHTML=settingsHTML();paintVoices()}
  else if(R.v==="exam"){m.innerHTML=examHTML();afterExam()}
  else if(R.v==="drill"){m.innerHTML=drillShellHTML();paintDrill()}
  else if(R.v==="mat")m.innerHTML=R.id?matHTML(R.id):matsListHTML();
  else if(R.v==="voices")m.innerHTML=voicesHTML();
  else if(R.v==="famed"){m.innerHTML=famedView();afterFamed()}
  else{m.innerHTML=caseHTML(R.id,R.tab);afterCase(R.id,R.tab)}
  window.scrollTo(0,0)}
let HASH=(location.hash||"").replace(/^#/,"");
function go(h){HASH=h;try{history.pushState(null,"","#"+h)}catch(e){}render()}
window.addEventListener("hashchange",()=>{HASH=(location.hash||"").replace(/^#/,"");render()});
document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest('a[href^="#"]');if(!a)return;e.preventDefault();go(a.getAttribute("href").slice(1))});

/* ---------- events ---------- */
const main=$("#main");
main.addEventListener("click",async e=>{const b=e.target.closest("[data-action]");if(!b)return;const a=b.dataset.action;const kind=b.dataset.kind;
  switch(a){
  case "mic":{startRec(b.dataset.mic);break}
  case "say":{unlockTTS();const cid=curId();const t=chatOf(cid,kind).turns[+b.dataset.i];if(t)speakSegs(t.segs||[t.content],roleOf(kind,cid),true);break}
  case "kb":{const f=$(`.chat-form[data-kind="${kind}"]`);if(f){f.hidden=!f.hidden;if(!f.hidden){const ta=f.querySelector("textarea");if(ta)ta.focus()}}break}
  case "reveal":{const p=b.nextElementSibling;if(!p)break;p.hidden=!p.hidden;b.setAttribute("aria-expanded",String(!p.hidden));b.textContent=p.hidden?"Patient’s answer":"Hide answer";break}
  case "stop":{const ch=chatOf(curId(),kind);if(ch.ctl)ch.ctl.abort();break}
  case "stop-fb":{if(FBRUN[kind])FBRUN[kind].ctl.abort();break}
  case "reset-chat":{stopRec();stopVoice();const rid=curId();const ch=chatOf(rid,kind);if(ch.ctl)ch.ctl.abort();delete CH[rid+":"+kind];
    {const fs=$("#free-"+(kind==="patient"?"anam":kind));if(fs)fs.innerHTML=""}
    if(kind==="patient"){delete FREE[rid];delete FB[rid+":anam"];delete COV[rid];const s=$("#fb-anam");if(s)s.innerHTML="";const cl=$("#cl");if(cl)cl.innerHTML=checklistHTML(byId(rid))}
    else if(kind!=="ober"){delete FB[rid+":"+kind];const s=$("#fb-"+kind);if(s)s.innerHTML=""}
    paintChat(rid,kind);paintRec();break}
  case "start-ober":case "start-tel":{unlockTTS();const k=a==="start-tel"?"tel":"ober";const cid=curId();const ch=chatOf(cid,k);if(!ch.start)ch.start=Date.now();if(SET.live&&SR){LIVE.on=true;LIVE.target="chat:"+k;LIVE.miss=0;LIVE.end=false}send(cid,k,null);break}
  case "finish-aufkl":{stopRec();stopVoice();const id=curId();const ch=chatOf(id,"aufkl");const slot=$("#free-aufkl");
    if(ch.turns.filter(t=>t.role==="user").length<2){if(slot)slot.innerHTML=`<p class="note">You need at least two turns for a result. Continue the explanation.</p>`;break}
    if(ch.busy)break;aufklFinish(id);if(ch.mode==="ai"&&KEY)runJSON("aufkl",id,aufklPrompt(byId(id),ch.turns),()=>{});break}
  case "ai-aufkl":{const id=curId();runJSON("aufkl",id,aufklPrompt(byId(id),chatOf(id,"aufkl").turns),()=>{});break}
  case "finish-tel":{stopRec();stopVoice();const id=curId();const ch=chatOf(id,"tel");if(!ch.turns.length||ch.busy)break;ch.fin=true;telFinish(id);break}
  case "say-src":{unlockTTS();speakSegs(srcSegs(b.dataset.src||""),"narr",true);break}
  case "h-play":{const h=curHoer();if(h)hoerPlay(h);break}
  case "h-stop":{HP.tok++;HP.on=false;stopVoice();const h=curHoer();if(h)hpPaint(h);break}
  case "h-restart":{const h=curHoer();if(!h)break;HP.tok++;HP.on=false;stopVoice();HP.pos[h.id]=0;hoerPlay(h);break}
  case "fx-next":{fxNext(false);break}
  case "ex-fmt":{SET.fmt=b.dataset.f==="fsp"?"fsp":"famed";saveSet();render();break}
  case "h-check":{const h=hoerOf(R.id);if(!h)break;const text=str(draft("h_"+h.id).brief).trim();const slot=$("#h-res");
    if(words(text)<15){if(slot)slot.innerHTML=`<p class="note">Write at least a few sentences, then check.</p>`;break}
    if(slot)slot.innerHTML=hoerResHTML(h,text);fmSet("hoer_"+h.id,Math.round(hoerRes(h,text).filter(x=>x[1]).length/h.facts.length*100));break}
  case "h-ai":{const h=hoerOf(R.id);if(!h)break;const text=str(draft("h_"+h.id).brief).trim();const slot=$("#fb-hoer");
    if(words(text)<30){if(slot)slot.innerHTML=`<p class="note">The text is still too short for a review. At least 30 words are needed.</p>`;break}
    runJSON("hoer","h_"+h.id,hoerPrompt(h,text),()=>{});break}
  case "finish-anam":{stopRec();const id=R.id;const ch=chatOf(id,"patient");const slot=$("#fb-anam");
    if(ch.turns.filter(t=>t.role==="user").length<3){if(slot)slot.innerHTML=`<p class="note">At least three of your lines are needed for a review. Continue the conversation.</p>`;break}
    if(ch.busy)break;if(!ch.end)ch.end=Date.now();
    FREE[id]=true;COV[id]=new Set(ch.cov?[...ch.cov]:[]);markDone(id,"anam");if(!ch.recorded){pushHist(recFromChat(id,ch,"train"));ch.recorded=true}
    {const fa=$("#free-anam");if(fa)fa.innerHTML=freeSumHTML(byId(id),ch);const cl=$("#cl");if(cl)cl.innerHTML=checklistHTML(byId(id));const w=$(".cl-wrap");if(w)w.open=true}
    if(!freeMode())runJSON("anam",id,anamPrompt(byId(id),ch.turns),d=>{COV[id]=new Set(arr(d.covered).map(String));
      if(viewIs(id)){const cl=$("#cl");if(cl)cl.innerHTML=checklistHTML(byId(id))}});break}
  case "mode":{const m=b.dataset.m;const cid=curId();if(m==="ai"&&!KEY){const ch=chatOf(cid,kind);ch.err="For AI mode, add an API key in Settings.";paintChat(cid,kind);break}
    if((m==="free")===freeMode())break;SET.mode=m;saveSet();stopRec();setAIStatus();
    Object.keys(CH).filter(k=>k.endsWith(":ober")||k.endsWith(":tel")).forEach(k=>{if(CH[k].ctl)CH[k].ctl.abort();delete CH[k]});["#free-ober","#free-tel"].forEach(q=>{const x=$(q);if(x)x.innerHTML=""});
    if(cid){["patient","aufkl"].forEach(k=>{chatOf(cid,k).err=""});["patient","ober","aufkl","tel"].forEach(k=>paintChat(cid,k));paintRec()}break}
  case "ober-next":{stopRec();oberNext(curId());break}
  case "ai-anam":{const id=R.id;const ch=chatOf(id,"patient");runJSON("anam",id,anamPrompt(byId(id),ch.turns),d=>{COV[id]=new Set(arr(d.covered).map(String));markDone(id,"anam");if(R.v==="case"&&R.id===id){const cl=$("#cl");if(cl)cl.innerHTML=checklistHTML(byId(id))}});break}
  case "ex-start":{unlockTTS();if(SET.fmt==="fsp")examStart();else fxStart();break}
  case "ex-next":{exNext(false);break}
  case "ex-abort":{if(window.confirm("Stop the exam? The result will not be saved.")){stopRec();EX=null;FX=null;go("home")}break}
  case "ex-new":{EX=null;FX=null;render();break}
  case "ex-ai":{examAI();break}
  case "ex-tpl":{const ta=$("#exbrief");if(!ta||!EX)break;const tpl=byId(EX.caseId).brief.map(([h])=>h+"\n").join("\n");ta.value=ta.value.trim()?ta.value.replace(/\s*$/,"")+"\n\n"+tpl:tpl;ta.dispatchEvent(new Event("input",{bubbles:true}));ta.focus();break}
  case "drill-next":{stopRec();if(DR){DR.i++;paintDrill()}break}
  case "drill-new":{DR=null;paintDrill();break}
  case "say-text":{unlockTTS();speakSegs([b.dataset.t||""],"narr",true);break}
  case "drill-say":{unlockTTS();const tk=DR&&DR.tasks[DR.i];if(tk)speakSegs([tk.type==="topic"?topicQ(tk.id):tk.f.lay],"narr",true);break}
  case "hist-clear":{if(window.confirm("Clear the weak-spot history on this device?")){S.hist=[];DR=null;save();m_render_settings("Mistake memory cleared.","ok-t")}break}
  case "tpl-brief":{const ta=$("#brief");if(!ta)break;const tpl=byId(R.id).brief.map(([h])=>h+"\n").join("\n");ta.value=ta.value.trim()?ta.value.replace(/\s*$/,"")+"\n\n"+tpl:tpl;ta.dispatchEvent(new Event("input",{bubbles:true}));ta.focus();break}
  case "check":{const id=R.id;const c=byId(id);const text=str(draft(id)[kind]).trim();const min=kind==="brief"?40:30;const slot=$("#fb-"+kind);
    if(words(text)<min){if(slot)slot.innerHTML=`<p class="note">The text is still too short for a review. At least ${min} words are needed.</p>`;break}
    runJSON(kind,id,kind==="brief"?briefPrompt(c,text):vorPrompt(c,text),()=>markDone(id,kind));break}
  case "muster":{const box=$("#muster-"+kind);if(!box)break;box.hidden=!box.hidden;b.setAttribute("aria-expanded",String(!box.hidden));b.textContent=box.hidden?"Show sample":"Hide sample";
    if(!box.hidden&&words(draft(R.id)[kind])>=30)markDone(R.id,kind);break}
  case "phrase":{const ta=$("#vor");if(!ta)break;const p=PHRASES[+b.dataset.i]||"";const s=ta.selectionStart,en=ta.selectionEnd;const pre=ta.value.slice(0,s);const ins=(pre&&!/\s$/.test(pre)?" ":"")+p;ta.setRangeText(ins,s,en,"end");ta.dispatchEvent(new Event("input",{bubbles:true}));ta.focus();break}
  case "key-save":{const inp=$("#key");const v=inp?inp.value.trim():"";const msg=$("#key-msg");if(!v){if(msg){msg.className="small err";msg.textContent="Paste the key into the field."}break}
    KEY=v;try{localStorage.setItem(KEY_LS,v)}catch(x){}SET.mode="ai";saveSet();setAIStatus();m_render_settings("Key saved. Press “Check key”.","ok-t");break}
  case "key-del":{KEY="";try{localStorage.removeItem(KEY_LS)}catch(x){}setAIStatus();m_render_settings("Key deleted from this device.","small");break}
  case "key-test":{const msg=$("#key-msg");if(msg){msg.className="small muted";msg.textContent="Checking…"}b.disabled=true;
    try{await chatCall("",[{role:"user",content:"Antworte nur mit: OK"}],5);if(msg){msg.className="small ok-t";msg.textContent="The key works."}}
    catch(x){if(msg){msg.className="small err";msg.textContent=errText(x)}}finally{b.disabled=false}break}
  case "tts-test":{unlockTTS();speakSegs([TTS_TEST],"narr",true);break}
  case "v-say":{unlockTTS();const v=V.deck[V.i];if(v)speakSegs(V.flipped?[v[0],v[1]]:[v[0]],"narr",true);break}
  case "v-mode":{V.mode=b.dataset.m;if(V.mode==="quiz")V.quiz=null;document.querySelectorAll('[data-action="v-mode"]').forEach(x=>x.setAttribute("aria-pressed",String(x===b)));paintVocab();break}
  case "v-flip":{V.flipped=true;paintVocab();break}
  case "v-skip":{V.i++;V.flipped=false;paintVocab();break}
  case "v-know":{const v=V.deck[V.i];if(v)setKnown(v[0],true);if(V.only)V.deck.splice(V.i,1);else V.i++;V.flipped=false;paintVocab();break}
  case "v-learn":{const v=V.deck[V.i];if(v)setKnown(v[0],false);V.i++;V.flipped=false;paintVocab();break}
  case "v-opt":{const q=V.quiz;if(!q||q.pick>=0)break;q.pick=+b.dataset.i;V.total++;if(q.opts[q.pick]===q.v)V.score++;paintVocab();break}
  case "v-nextq":{newQ();paintVocab();break}
  case "v-toggle":{const t=b.dataset.t;setKnown(t,!known.has(t));const r=$("#v-rows");if(r)r.innerHTML=rowsHTML();const cnt=$("#v-count");if(cnt)cnt.textContent=`Learned ${VOCAB.filter(v=>known.has(v[0])).length} of ${VOCAB.length}`;break}
  }});
function m_render_settings(text,cls){const m=$("#main");m.innerHTML=settingsHTML();paintVoices();const msg=$("#key-msg");if(msg){msg.className="small "+(cls||"");msg.textContent=text}}
main.addEventListener("submit",e=>{const df=e.target.closest(".drill-form");if(df){e.preventDefault();const i=df.querySelector("input");const v=i.value.trim();if(v){i.value="";drillCheck(v)}return}
  const f=e.target.closest(".chat-form");if(!f)return;e.preventDefault();unlockTTS();const ta=f.querySelector("textarea");const v=ta.value.trim();if(!v)return;const cid=curId();if(!cid)return;const ch=chatOf(cid,f.dataset.kind);if(ch.busy)return;ta.value="";send(cid,f.dataset.kind,v)});
main.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing&&e.target.matches(".chat-form textarea")){e.preventDefault();const f=e.target.form;if(f.requestSubmit)f.requestSubmit();else f.dispatchEvent(new Event("submit",{cancelable:true,bubbles:true}))}});
main.addEventListener("input",e=>{const t=e.target;
  if(t.dataset&&t.dataset.fx&&FX){FX[t.dataset.fx]=t.value;if(t.id==="fxdoc"){const w=$("#wc-fxdoc");if(w)w.textContent=words(t.value)+" words"}return}
  if(t.dataset&&t.dataset.voc!=null&&EX&&EX.voc){EX.voc.ans[+t.dataset.voc]=t.value;return}
  if(t.dataset&&t.dataset.exam&&EX){EX[t.dataset.exam]=t.value;if(t.id==="exbrief"){const w=$("#wc-exbrief");if(w)w.textContent=words(t.value)+" words"}return}
  if(t.dataset&&t.dataset.hdraft){draft(t.dataset.hdraft).brief=t.value;saveSoon();const w=$("#wc-hoer");if(w)w.textContent=words(t.value)+" words";return}
  if(t.dataset&&t.dataset.draft&&R.v==="case"){draft(R.id)[t.dataset.draft]=t.value;saveSoon();if(t.id==="brief")wc();return}
  if(t.id==="v-q"){V.q=t.value;const r=$("#v-rows");if(r)r.innerHTML=rowsHTML();return}
  if(t.id==="s-rate"){SET.rate=+t.value;saveSet();const rv=$("#rate-v");if(rv)rv.textContent=(+t.value).toFixed(2)}});
main.addEventListener("change",e=>{const t=e.target;
  if(t.id==="v-cat"){V.cat=t.value;rebuild();paintVocab()}
  else if(t.id==="v-only"){V.only=t.checked;rebuild();paintVocab()}
  else if(t.id==="s-tts"){SET.tts=t.checked;saveSet()}
  else if(t.id==="s-auto"){SET.autosend=t.checked;saveSet()}
  else if(t.id==="s-live"){SET.live=t.checked;saveSet()}
  else if(t.id==="s-voice"){SET.voice=t.value;saveSet()}
  else if(t.id==="ex-min"){SET.examMin=+t.value;saveSet()}
  else if(t.id==="ex-voc"){SET.vocab=t.checked;saveSet();render()}});
window.addEventListener("pagehide",save);
document.addEventListener("visibilitychange",()=>{if(document.hidden){stopRec();paintRec()}});

setInterval(()=>{const cid=curId();if(!cid)return;document.querySelectorAll(".js-timer").forEach(el=>{const ch=chatOf(cid,el.dataset.kind);if(!ch.start){el.textContent="00:00";return}const s=Math.max(0,Math.floor(((ch.end||Date.now())-ch.start)/1000));el.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")})},1000);

render();
})();
</script>
