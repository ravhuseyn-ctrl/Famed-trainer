const HEAD_ALIAS={"Persönliche Daten":/^(persönliche daten|personalien|patientendaten|daten)$/,"Aufnahmegrund":/^(aufnahmegrund|vorstellungsgrund|grund der (vorstellung|aufnahme)|leitsymptom|hauptbeschwerden?|anlass)$/,
  "Aktuelle Anamnese":/^(aktuelle anamnese|jetzige anamnese|anamnese|eigenanamnese|krankengeschichte)$/,"Vegetative Anamnese":/^(vegetative anamnese|vegetativum|vegetative)$/,
  "Vorerkrankungen":/^(vorerkrankungen?|vorgeschichte|chronische erkrankungen)$/,"Voroperationen":/^(voroperationen?|operationen|ops)$/,"Medikation":/^(medikation|medikamente|medikamentenanamnese|dauermedikation)$/,
  "Allergien":/^(allergien?|unverträglichkeiten)$/,"Noxen":/^(noxen|genussmittel|suchtmittel)$/,"Gynäkologische Anamnese":/^(gynäkologische anamnese|gyn\.?|gynäkologie|zyklus)$/,"Impfstatus":/^(impfstatus|impfungen|impfanamnese)$/,
  "Familienanamnese":/^(familienanamnese|familie)$/,"Sozialanamnese":/^(sozialanamnese|soziales|beruf)$/,"Verdachtsdiagnose":/^(verdachtsdiagnose|verdacht|diagnose|arbeitsdiagnose|vd)$/,
  "Differenzialdiagnosen":/^(differ[ez]n[tz]ialdiagnosen?|dd)$/,"Procedere":/^(procedere|prozedere|weiteres vorgehen|vorgehen|plan)$/};
function headOf(s,heads){const x=str(s).trim().toLowerCase();if(!x||x.length>40)return null;return heads.find(h=>h.toLowerCase()===x||(HEAD_ALIAS[h]&&HEAD_ALIAS[h].test(x)))||null}
function examFinish(){const id=EX.caseId,c=byId(id);const ch=chatOf(id,"patient"),ob=chatOf(id,"ober");
  const rec=recFromChat(id,ch,"exam");rec.dur=EX.dur[1]||rec.dur;
  const heads=c.brief.map(b=>b[0]);const filled=new Set();let cur=null;
  for(const l of EX.brief.split(/\n/)){const raw=l.trim().replace(/^[-–•*\d.)\s]+/,"");const ci=raw.indexOf(":");
    const whole=headOf(raw.replace(/:$/,""),heads);if(whole){cur=whole;continue}
    const inl=ci>0?headOf(raw.slice(0,ci),heads):null;if(inl){if(words(raw.slice(ci+1))>=1)filled.add(inl);cur=inl;continue}
    if(cur&&words(l)>=1)filled.add(cur)}
  const found=heads.filter(h=>filled.has(h));
  const keys=KEYS[id]||[];const oberText=ob.turns.filter(t=>t.role==="user").map(t=>t.content).join(" ");
  const docK=keys.filter(k=>k[1].test(EX.brief)),vorK=keys.filter(k=>k[1].test(EX.vor+" "+oberText));
  const oberAns=ob.qs?ob.ans.filter(a=>a.length).length:ob.turns.filter(t=>t.role==="user").length;const oberTot=ob.qs?ob.qs.length:Math.max(oberAns,6);
  EX.res={rec,heads:heads.length,found:found.length,missHeads:heads.filter(h=>!found.includes(h)),keys:keys.length,docK:docK.length,docMiss:keys.filter(k=>!docK.includes(k)).map(k=>k[0]),vorK:vorK.length,vorMiss:keys.filter(k=>!vorK.includes(k)).map(k=>k[0]),oberAns,oberTot};
  rec.docPct=keys.length?Math.round(docK.length/keys.length*100):null;pushHist(rec);
  if(EX.voc){const vr=EX.voc.items.map((t,i)=>[t,str(EX.voc.ans[i]),vocOk(t,EX.voc.ans[i])]);EX.res.voc={ok:vr.filter(x=>x[2]).length,total:vr.length,wrong:vr.filter(x=>!x[2])}}
  rec.fmt="fsp";rec.rubric="allgemein";rec.score=exTech(EX.res);
  {const pc=(a,b)=>b?Math.round(a/b*100):0,r=EX.res;rec.parts=[...(r.voc?[["voc",pc(r.voc.ok,r.voc.total)]]:[]),["anam",pc(rec.cov,rec.total)],["docS",pc(r.found,r.heads)],["docK",pc(r.docK,r.keys)],["vorK",pc(r.vorK,r.keys)],["ober",pc(r.oberAns,r.oberTot)]];
   rec.det={t:hTurns(ch),ob:hTurns(ob),notes:str(EX.notes).slice(0,4000),brief:str(EX.brief).slice(0,8000),vor:str(EX.vor).slice(0,6000),durs:EX.dur,docMiss:r.docMiss,missHeads:r.missHeads,vorMiss:r.vorMiss,voc:r.voc?r.voc.wrong.map(x=>[x[0],x[1]]):null}}
  EX.recId=rec.id;save()}

async function vgBuild(){const C=voiceClips();const idx={v:1,model:VG.model,created:new Date().toISOString(),voices:{},packs:{},clips:{}};const files=[];const live={};
  for(const [r] of vgRoles()){const name="voice-"+r.replace(/^p_/,"")+".mp3";let off=0;const parts=[];let fresh=false;
    for(const t of C[r]||[]){const k=r+"|"+t;let b=null;
      if(VG.res[k]){b=new Uint8Array(VG.res[k]);fresh=true}
      else{const o=vgOld(r,t);if(o){const buf=await vPack(o[0]);b=new Uint8Array(buf.slice(o[1],o[1]+o[2]))}}
      if(!b)continue;idx.clips[k]=[r,off,b.length];parts.push(b);off+=b.length}
    if(!parts.length)continue;
    const all=new Uint8Array(off);let o=0;for(const p of parts){all.set(p,o);o+=p.length}
    const v=VG.voices.find(x=>x.voice_id===VG.sel[r]);const prev=VO.idx&&VO.idx.voices&&VO.idx.voices[r];
    idx.packs[r]=name;idx.voices[r]=fresh?(v?v.name:VG.sel[r]):(prev||(v?v.name:""));files.push({name,data:all});live[r]=all.buffer}
  if(!files.length){VG.out=null;return}

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function makeZip(files){const enc=new TextEncoder();const parts=[],cd=[];let off=0;
  for(const f of files){const nm=enc.encode(f.name),crc=crc32(f.data),n=f.data.length;
    const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(12,0x21,true);lh.setUint32(14,crc,true);lh.setUint32(18,n,true);lh.setUint32(22,n,true);lh.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(lh.buffer),nm,f.data);
    const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(14,0x21,true);ch.setUint32(16,crc,true);ch.setUint32(20,n,true);ch.setUint32(24,n,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);

/* ---------- unfinished exam sessions: autosave in this browser, offer to resume after a reload ---------- */
const SESS_LS="medfsp.session";
function serV(v,d){if(d>10)return null;if(v instanceof Set)return {$set:[...v].map(x=>serV(x,d+1))};if(v instanceof RegExp)return null;if(Array.isArray(v))return v.map(x=>serV(x,d+1));if(v&&typeof v==="object"){const o={};for(const k of Object.keys(v))o[k]=serV(v[k],d+1);return o}return v}
function desV(v){if(Array.isArray(v))return v.map(desV);if(v&&typeof v==="object"){if(Array.isArray(v.$set))return new Set(v.$set.map(desV));const o={};for(const k of Object.keys(v))o[k]=desV(v[k]);return o}return v}
function serChat(ch){const o={};for(const k of Object.keys(ch)){if(k==="ctl"||k==="busy"||k==="qs")continue;o[k]=serV(ch[k],0)}o.hadQs=!!ch.qs;return o}
function sessActive(){return EX&&EX.stage<=3?"fsp":fxStep()?"famed":kxOn()?"kp":null}
function sessSave(){const t=sessActive();try{if(!t){localStorage.removeItem(SESS_LS);return}
  const chats={};const add=(cid,k)=>{const ch=CH[cid+":"+k];if(ch)chats[cid+":"+k]=serChat(ch)};let st,left;
  if(t==="fsp"){st=serV(Object.assign({},EX,{res:null,ai:null}),0);left=examLeft();add(EX.caseId,"patient");add(EX.caseId,"ober")}
  else if(t==="famed"){st=serV(FX,0);left=fxLeft();FX.steps.forEach(x=>{const k=fxKind(x);if(k)add(x.cid,k)})}
  else{st=serV(KX,0);left=kxLeft();["patient","kpu","kpp"].forEach(k=>add(KX.cid,k))}
  localStorage.setItem(SESS_LS,JSON.stringify({v:1,type:t,saved:Date.now(),left:Math.max(0,left),st,chats}))}catch(e){}}
let PEND=null;try{const p=JSON.parse(localStorage.getItem(SESS_LS)||"null");if(p&&p.v===1&&["fsp","famed","kp"].includes(p.type)&&p.st&&typeof p.st==="object")PEND=p}catch(e){}
function sessDrop(){PEND=null;try{localStorage.removeItem(SESS_LS)}catch(e){}}
function sessLabel(p){const st=p.st||{};if(p.type==="fsp"){const c=byId(st.caseId);return "Prüfung FSP"+(c?" · Fall "+c.nr:"")+" · Teil "+(st.stage||1)}
  if(p.type==="famed")return "Prüfung FaMed · Situation "+((+st.i||0)+1)+" von "+(arr(st.steps).length||5);const c=byId(st.cid);return "KP-Simulation"+(c?" · Fall "+c.nr:"")+" · Teil "+((+st.stage||0)+1)+" von 4"}
function resumeHTML(){if(!PEND||sessActive())return "";return `<div class="note resume"><p><b>Незавершённая сессия:</b> <span lang="de">${esc(sessLabel(PEND))}</span>. На текущем этапе осталось ${fmt(PEND.left)}.</p><div class="row"><button type="button" class="btn primary" data-action="sess-resume">Продолжить незавершённую сессию</button><button type="button" class="btn ghost" data-action="sess-drop">Начать заново</button></div></div>`}
function chatsRestore(chats,gap){Object.entries(chats||{}).forEach(([key,o])=>{try{const [cid,k]=key.split(":");const c=byId(cid);if(!c||!o||typeof o!=="object"||!CHAT_KINDS.includes(k))return;const ch=desV(o);delete ch.hadQs;ch.busy=false;ch.ctl=null;ch.turns=arr(ch.turns).filter(t=>t&&typeof t.content==="string");
  if(o.hadQs){const q=k==="kpp"?kppQs(c):k==="ober"?oberQs(c):null;if(q)ch.qs=q}if(gap&&ch.start&&!ch.end)ch.start+=gap;CH[key]=ch}catch(e){}})}
const CHAT_KINDS=["patient","ober","aufkl","tel","kpu","kpp"];
/* unfinished training conversations are kept for a day, so an accidental reload does not erase them */
const CHATS_LS="medfsp.chats";
function chatsSave(){if(sessActive())return;try{const o={};let n=0;for(const k of Object.keys(CH)){const ch=CH[k];if(!ch||ch.end||ch.sum||!arr(ch.turns).length||!CHAT_KINDS.includes(k.split(":")[1]))continue;o[k]=serChat(ch);n++}
  if(n)localStorage.setItem(CHATS_LS,JSON.stringify({v:1,saved:Date.now(),chats:o}));else localStorage.removeItem(CHATS_LS)}catch(e){}}
function chatsLoad(){try{const c=JSON.parse(localStorage.getItem(CHATS_LS)||"null");if(c&&c.v===1&&+c.saved>Date.now()-864e5)chatsRestore(c.chats,Math.max(0,Date.now()-c.saved))}catch(e){}}
function sessResume(){const p=PEND;if(!p)return;try{const st=desV(p.st);const left=Math.max(5,+p.left||0);
  chatsRestore(p.chats,0);

  case "finish-aufkl":{stopRec();stopVoice();const id=curId();const ch=chatOf(id,"aufkl");const slot=$("#free-aufkl");
    if(ch.turns.filter(t=>t.role==="user").length<2){if(slot)slot.innerHTML=`<p class="note">Для итога нужно хотя бы две ваших реплики. Продолжите объяснение.</p>`;break}
    if(ch.busy)break;aufklFinish(id);if(ch.mode==="ai"&&KEY)runJSON("aufkl",id,aufklPrompt(byId(id),ch.turns),()=>{});break}
  case "ai-aufkl":{const id=curId();runJSON("aufkl",id,aufklPrompt(byId(id),chatOf(id,"aufkl").turns),()=>{});break}
  case "finish-tel":{stopRec();stopVoice();const id=curId();const ch=chatOf(id,"tel");if(!ch.turns.length||ch.busy)break;ch.fin=true;telFinish(id);break}
  case "say-src":{unlockTTS();speakSegs(srcSegs(b.dataset.src||""),"narr",true);break}
  case "h-play":{const h=curHoer();if(h)hoerPlay(h);break}
  case "h-stop":{HP.tok++;HP.on=false;stopVoice();const h=curHoer();if(h)hpPaint(h);break}
  case "h-restart":{const h=curHoer();if(!h)break;HP.tok++;HP.on=false;stopVoice();HP.pos[h.id]=0;hoerPlay(h);break}
  case "fx-next":{fxNext(false);break}
  case "ex-fmt":{SET.fmt=b.dataset.f==="fsp"?"fsp":"famed";saveSet();render();break}
  case "h-check":{const h=hoerOf(R.id);if(!h)break;const text=str(draft("h_"+h.id).brief).trim();const slot=$("#h-res");
    if(words(text)<15){if(slot)slot.innerHTML=`<p class="note">Напишите хотя бы несколько предложений, потом проверьте.</p>`;break}
    if(slot)slot.innerHTML=hoerResHTML(h,text);fmSet("hoer_"+h.id,Math.round(hoerRes(h,text).filter(x=>x[1]).length/h.facts.length*100));break}
  case "h-ai":{const h=hoerOf(R.id);if(!h)break;const text=str(draft("h_"+h.id).brief).trim();const slot=$("#fb-hoer");
    if(words(text)<30){if(slot)slot.innerHTML=`<p class="note">Текст пока слишком короткий для разбора. Нужно хотя бы 30 слов.</p>`;break}
    runJSON("hoer","h_"+h.id,hoerPrompt(h,text),()=>{});break}
  case "finish-anam":{stopRec();const id=R.id;const ch=chatOf(id,"patient");const slot=$("#fb-anam");
    if(ch.turns.filter(t=>t.role==="user").length<3){if(slot)slot.innerHTML=`<p class="note">Для разбора нужно хотя бы три ваших реплики. Продолжите разговор.</p>`;break}
    if(ch.busy)break;if(!ch.end)ch.end=Date.now();
    FREE[id]=true;COV[id]=new Set(ch.cov?[...ch.cov]:[]);markDone(id,"anam");if(R.v==="kp"){fmSet("kp_a_"+id,Math.round(((ch.cov&&ch.cov.size)||0)/byId(id).items.length*100));kpTotPaint(id)}if(!ch.recorded){const rr=recFromChat(id,ch,"train");rr.det={t:hTurns(ch),notes:str(draft(id).notes).slice(0,4000)};if(R.v==="kp")rr.kp=1;pushHist(rr);ch.recorded=true}
    {const fa=$("#free-anam");if(fa)fa.innerHTML=freeSumHTML(byId(id),ch);const cl=$("#cl");if(cl)cl.innerHTML=checklistHTML(byId(id));const w=$(".cl-wrap");if(w)w.open=true}
    if(!freeMode())runJSON("anam",id,anamPrompt(byId(id),ch.turns),d=>{COV[id]=new Set(arr(d.covered).map(String));
      if(viewIs(id)){const cl=$("#cl");if(cl)cl.innerHTML=checklistHTML(byId(id))}});break}
  case "mode":{const m=b.dataset.m;const cid=curId();if(m==="ai"&&!KEY){const ch=chatOf(cid,kind);ch.err="Для ИИ-режима добавьте API-ключ в настройках.";paintChat(cid,kind);break}
    if((m==="free")===freeMode())break;SET.mode=m;saveSet();stopRec();setAIStatus();
    Object.keys(CH).filter(k=>k.endsWith(":ober")||k.endsWith(":tel")).forEach(k=>{if(CH[k].ctl)CH[k].ctl.abort();delete CH[k]});["#free-ober","#free-tel"].forEach(q=>{const x=$(q);if(x)x.innerHTML=""});
    if(cid){["patient","aufkl"].forEach(k=>{chatOf(cid,k).err=""});["patient","ober","aufkl","tel"].forEach(k=>paintChat(cid,k));paintRec()}break}
  case "ober-next":{stopRec();oberNext(curId());break}
  case "pg-f":{PG.f=b.dataset.f||"all";render();break}
  case "print":{document.querySelectorAll("#main details").forEach(x=>{x.open=true});window.print();break}
  case "kpp-next":{stopRec();kppNext(curId(),KP_TXT.skip);break}
  case "finish-kpu":{stopRec();stopVoice();const id=curId();const ch=chatOf(id,"kpu");const slot=$("#free-kpu");
    if(ch.turns.filter(t=>t.role==="user").length<2){if(slot)slot.innerHTML=`<p class="note">Для итога нужно хотя бы две ваших реплики. Продолжите осмотр.</p>`;break}
    kpuFinish(id);break}
  case "finish-kpp":{stopRec();stopVoice();const id=curId();const ch=chatOf(id,"kpp");if(!ch.qs)break;if(!ch.fin){ch.fin=true;ch.end=Date.now()}kppFinish(id);paintChat(id,"kpp");break}
  case "ai-kpp":{const id=curId();const ch=chatOf(id,"kpp");if(ch.qs)runJSON("kpp",id,kppPrompt(byId(id),ch),()=>{});break}
  case "kp-tpl":{const ta=$("#kpb");if(!ta)break;ta.value=ta.value.trim()?ta.value.replace(/\s*$/,"")+"\n\n"+KP_TPL:KP_TPL;ta.dispatchEvent(new Event("input",{bubbles:true}));ta.focus();break}
  case "kp-check":{const id=R.id;const text=str(draft("kp_"+id).brief).trim();const slot=$("#kpb-res");
    if(words(text)<40){if(slot)slot.innerHTML=`<p class="note">Текст пока слишком короткий для проверки. Нужно хотя бы 40 слов.</p>`;break}
    const r=kpbRes(id,text);KPB[id]=r;if(slot)slot.innerHTML=kpbResHTML(r);fmSet("kp_b_"+id,r.pct);kpbRecord(id,r,text);kpTotPaint(id);break}
  case "kp-ai":{const id=R.id;const text=str(draft("kp_"+id).brief).trim();const slot=$("#fb-kpb");
    if(words(text)<40){if(slot)slot.innerHTML=`<p class="note">Текст пока слишком короткий для разбора. Нужно хотя бы 40 слов.</p>`;break}
    runJSON("kpb",id,kpbPrompt(byId(id),text),()=>{});break}
  case "kp-muster":{const box=$("#muster-kpb");if(!box)break;box.hidden=!box.hidden;b.setAttribute("aria-expanded",String(!box.hidden));b.textContent=box.hidden?"Показать образец":"Скрыть образец";break}
  case "ai-anam":{const id=R.id;const ch=chatOf(id,"patient");runJSON("anam",id,anamPrompt(byId(id),ch.turns),d=>{COV[id]=new Set(arr(d.covered).map(String));markDone(id,"anam");if(R.v==="case"&&R.id===id){const cl=$("#cl");if(cl)cl.innerHTML=checklistHTML(byId(id))}});break}
  case "ex-start":{unlockTTS();if(kxOn()){if(!window.confirm("Идёт симуляция Kenntnisprüfung. Прервать её и начать этот экзамен?"))break;KX=null}if(SET.fmt==="fsp")examStart();else fxStart();break}
  case "kx-start":{unlockTTS();if(((EX&&EX.stage<=3)||fxStep())&&!window.confirm("Идёт другой пробный экзамен. Прервать его и начать симуляцию KP?"))break;kxStart();break}
  case "kx-next":{kxNext(false);break}
  case "kx-abort":{if(window.confirm("Прервать симуляцию? Результат не сохранится.")){stopRec();stopVoice();KX=null;sessDrop();go("kp")}break}
  case "kx-new":{KX=null;render();break}
  case "kx-ai":{kxAI();break}
  case "kd-check":{kdCheck();break}
  case "kd-next":{stopRec();if(KD){KD.i++;KD.draft="";paintKD()}break}
  case "kd-new":{stopRec();kdNew();paintKD();break}
  case "sess-resume":{unlockTTS();sessResume();break}
  case "sess-drop":{if(window.confirm("Удалить незавершённую сессию и начать заново?")){sessDrop();render()}break}
  case "exp":{exportData();break}
  case "wipe":{if(window.confirm("Удалить все попытки, черновики, выученные термины и баллы на этом устройстве? Сначала сделайте экспорт, если хотите сохранить копию.")){S.known=[];known.clear();S.drafts={};S.done={};S.hist=[];S.fm={};DR=null;KD=null;try{localStorage.removeItem(CHATS_LS);localStorage.removeItem(KD_LS)}catch(e){}if(!sessActive()){sessDrop();for(const k of Object.keys(CH))delete CH[k]}save();PG.msg="Данные на этом устройстве удалены.";render()}break}
  case "ex-next":{exNext(false);break}
  case "ex-abort":{if(window.confirm("Прервать экзамен? Результат не сохранится.")){stopRec();EX=null;FX=null;sessDrop();go("home")}break}
  case "ex-new":{EX=null;FX=null;render();break}
  case "ex-ai":{examAI();break}
  case "ex-tpl":{const ta=$("#exbrief");if(!ta||!EX)break;const tpl=byId(EX.caseId).brief.map(([h])=>h+"\n").join("\n");ta.value=ta.value.trim()?ta.value.replace(/\s*$/,"")+"\n\n"+tpl:tpl;ta.dispatchEvent(new Event("input",{bubbles:true}));ta.focus();break}
  case "drill-next":{stopRec();if(DR){DR.i++;paintDrill()}break}
  case "drill-new":{DR=null;paintDrill();break}
  case "say-text":{unlockTTS();speakSegs([b.dataset.t||""],"narr",true);break}
  case "drill-say":{unlockTTS();const tk=DR&&DR.tasks[DR.i];if(tk)speakSegs([tk.type==="topic"?topicQ(tk.id):tk.f.lay],"narr",true);break}
  case "hist-clear":{if(window.confirm("Очистить историю слабых мест на этом устройстве?")){S.hist=[];DR=null;save();m_render_settings("Память ошибок очищена.","ok-t")}break}
  case "tpl-brief":{const ta=$("#brief");if(!ta)break;const tpl=byId(R.id).brief.map(([h])=>h+"\n").join("\n");ta.value=ta.value.trim()?ta.value.replace(/\s*$/,"")+"\n\n"+tpl:tpl;ta.dispatchEvent(new Event("input",{bubbles:true}));ta.focus();break}
  case "check":{const id=R.id;const c=byId(id);const text=str(draft(id)[kind]).trim();const min=kind==="brief"?40:30;const slot=$("#fb-"+kind);
    if(words(text)<min){if(slot)slot.innerHTML=`<p class="note">Текст пока слишком короткий для разбора. Нужно хотя бы ${min} слов.</p>`;break}
    runJSON(kind,id,kind==="brief"?briefPrompt(c,text):vorPrompt(c,text),()=>markDone(id,kind));break}
  case "muster":{const box=$("#muster-"+kind);if(!box)break;box.hidden=!box.hidden;b.setAttribute("aria-expanded",String(!box.hidden));b.textContent=box.hidden?"Показать образец":"Скрыть образец";
    if(!box.hidden&&words(draft(R.id)[kind])>=30)markDone(R.id,kind);break}
  case "phrase":{const ta=$("#vor");if(!ta)break;const p=PHRASES[+b.dataset.i]||"";const s=ta.selectionStart,en=ta.selectionEnd;const pre=ta.value.slice(0,s);const ins=(pre&&!/\s$/.test(pre)?" ":"")+p;ta.setRangeText(ins,s,en,"end");ta.dispatchEvent(new Event("input",{bubbles:true}));ta.focus();break}
  case "key-save":{const inp=$("#key");const v=inp?inp.value.trim():"";const msg=$("#key-msg");if(!v){if(msg){msg.className="small err";msg.textContent="Вставьте ключ в поле."}break}
    KEY=v;try{localStorage.setItem(KEY_LS,v)}catch(x){}SET.mode="ai";saveSet();setAIStatus();m_render_settings("Ключ сохранён. Нажмите «Проверить ключ».","ok-t");break}
  case "key-del":{KEY="";try{localStorage.removeItem(KEY_LS)}catch(x){}setAIStatus();m_render_settings("Ключ удалён с этого устройства.","small");break}
  case "key-test":{const msg=$("#key-msg");if(msg){msg.className="small muted";msg.textContent="Проверяю…"}b.disabled=true;
    try{await chatCall("",[{role:"user",content:"Antworte nur mit: OK"}],5);if(msg){msg.className="small ok-t";msg.textContent="Ключ работает."}}
    catch(x){if(msg){msg.className="small err";msg.textContent=errText(x)}}finally{b.disabled=false}break}
  case "tts-test":{unlockTTS();speakSegs([TTS_TEST],"narr",true);break}
  case "v-say":{unlockTTS();const v=V.deck[V.i];if(v)speakSegs(V.flipped?[v[0],v[1]]:[v[0]],"narr",true);break}
  case "v-mode":{V.mode=b.dataset.m;if(V.mode==="quiz")V.quiz=null;document.querySelectorAll('[data-action="v-mode"]').forEach(x=>x.setAttribute("aria-pressed",String(x===b)));paintVocab();break}
  case "v-flip":{V.flipped=true;paintVocab();break}
  case "v-skip":{V.i++;V.flipped=false;paintVocab();break}
  case "v-know":{const v=V.deck[V.i];if(v)setKnown(v[0],true);if(V.only)V.deck.splice(V.i,1);else V.i++;V.flipped=false;paintVocab();break}
  case "v-learn":{const v=V.deck[V.i];if(v)setKnown(v[0],false);V.i++;V.flipped=false;paintVocab();break}
  case "v-opt":{const q=V.quiz;if(!q||q.pick>=0)break;q.pick=+b.dataset.i;V.total++;if(q.opts[q.pick]===q.v)V.score++;paintVocab();break}
  case "v-nextq":{newQ();paintVocab();break}
  case "v-toggle":{const t=b.dataset.t;setKnown(t,!known.has(t));const r=$("#v-rows");if(r)r.innerHTML=rowsHTML();const cnt=$("#v-count");if(cnt)cnt.textContent=`Выучено ${VOCAB.filter(v=>known.has(v[0])).length} из ${VOCAB.length}`;break}
  }});
function m_render_settings(text,cls){const m=$("#main");m.innerHTML=settingsHTML();paintVoices();const msg=$("#key-msg");if(msg){msg.className="small "+(cls||"");msg.textContent=text}}
main.addEventListener("submit",e=>{const df=e.target.closest(".drill-form");if(df){e.preventDefault();const i=df.querySelector("input");const v=i.value.trim();if(v){i.value="";drillCheck(v)}return}
  const f=e.target.closest(".chat-form");if(!f)return;e.preventDefault();unlockTTS();const ta=f.querySelector("textarea");const v=ta.value.trim();if(!v)return;const cid=curId();if(!cid)return;const ch=chatOf(cid,f.dataset.kind);if(ch.busy)return;ta.value="";send(cid,f.dataset.kind,v)});
main.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing&&e.target.matches(".chat-form textarea")){e.preventDefault();const f=e.target.form;if(f.requestSubmit)f.requestSubmit();else f.dispatchEvent(new Event("submit",{cancelable:true,bubbles:true}))}});
main.addEventListener("input",e=>{const t=e.target;
  if(t.id==="kd-in"&&KD){KD.draft=t.value;kdStore();return}
  if(t.dataset&&t.dataset.kx&&KX){KX[t.dataset.kx]=t.value;if(t.id==="kxber"){const w=$("#wc-kxber");if(w)w.textContent=words(t.value)+" слов"}return}
  if(t.dataset&&t.dataset.fx&&FX){FX[t.dataset.fx]=t.value;if(t.id==="fxdoc"){const w=$("#wc-fxdoc");if(w)w.textContent=words(t.value)+" слов"}return}
  if(t.dataset&&t.dataset.voc!=null&&EX&&EX.voc){EX.voc.ans[+t.dataset.voc]=t.value;return}
  if(t.dataset&&t.dataset.exam&&EX){EX[t.dataset.exam]=t.value;if(t.id==="exbrief"){const w=$("#wc-exbrief");if(w)w.textContent=words(t.value)+" слов"}return}
  if(t.dataset&&t.dataset.kpdraft){draft(t.dataset.kpdraft).brief=t.value;saveSoon();kpWc();return}
  if(t.dataset&&t.dataset.hdraft){draft(t.dataset.hdraft).brief=t.value;saveSoon();const w=$("#wc-hoer");if(w)w.textContent=words(t.value)+" слов";return}
  if(t.dataset&&t.dataset.draft&&R.v==="case"){draft(R.id)[t.dataset.draft]=t.value;saveSoon();if(t.id==="brief")wc();return}
  if(t.id==="v-q"){V.q=t.value;const r=$("#v-rows");if(r)r.innerHTML=rowsHTML();return}
  if(t.id==="s-rate"){SET.rate=+t.value;saveSet();const rv=$("#rate-v");if(rv)rv.textContent=(+t.value).toFixed(2)}});
main.addEventListener("change",e=>{const t=e.target;
  if(t.id==="v-cat"){V.cat=t.value;rebuild();paintVocab()}
  else if(t.id==="v-only"){V.only=t.checked;rebuild();paintVocab()}
  else if(t.id==="s-tts"){SET.tts=t.checked;saveSet()}
  else if(t.id==="s-auto"){SET.autosend=t.checked;saveSet()}
  else if(t.id==="s-live"){SET.live=t.checked;saveSet()}
  else if(t.id==="s-voice"){SET.voice=t.value;saveSet()}
  else if(t.id==="ex-min"){SET.examMin=+t.value;saveSet()}
  else if(t.id==="ex-voc"){SET.vocab=t.checked;saveSet();render()}
  else if(t.id==="imp-file"){const f=t.files&&t.files[0];t.value="";if(!f)return;const msg=$("#imp-msg");
    if(f.size>5e6){if(msg){msg.className="small err";msg.textContent="Файл слишком большой для файла прогресса."}return}
    f.text().then(txt=>{const x=importData(txt);if(x.err){if(msg){msg.className="small err";msg.textContent=x.err}return}
      if(!window.confirm(`В файле ${x.hist.length} попыток и ${x.known.length} выученных терминов. Объединить с данными на этом устройстве? Текущие данные сохранятся.`))return;
      const n=mergeData(x);PG.msg=`Готово: добавлено новых попыток — ${n}.`;render()}).catch(()=>{if(msg){msg.className="small err";msg.textContent="Не удалось прочитать файл."}})}});
window.addEventListener("pagehide",save);
document.addEventListener("visibilitychange",()=>{if(document.hidden){stopRec();paintRec()}});

setInterval(()=>{const cid=curId();if(!cid)return;document.querySelectorAll(".js-timer").forEach(el=>{const ch=chatOf(cid,el.dataset.kind);if(!ch.start){el.textContent="00:00";return}const s=Math.max(0,Math.floor(((ch.end||Date.now())-ch.start)/1000));el.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")})},1000);

chatsLoad();
render();
})();
</script>
</body>
</html>
