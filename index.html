<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1C6A57">
<title>MedFSP · FSP, FaMed, Kenntnisprüfung</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MedFSP">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: one column on a clinic clipboard. Sticky header, a patient wristband label, a big round microphone; boxes only for interactive panels. */
:root{
  --paper:#F1F4F2; --sheet:#FFFFFF; --ink:#15212A; --muted:#566370; --line:#D2DAD6;
  --op:#1C6A57; --op-ink:#FFFFFF; --op-soft:#DCECE5;
  --pen:#B2382A; --pen-soft:#F8E4E0; --amber:#8F5D0C; --amber-soft:#F5EAD3;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#0E1517; --sheet:#152025; --ink:#E3EBE8; --muted:#97A7A4; --line:#2A383B;
  --op:#5BC1A3; --op-ink:#08201A; --op-soft:#16332B;
  --pen:#F08C7A; --pen-soft:#3B201C; --amber:#E2B05C; --amber-soft:#30271A; color-scheme:dark}}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:var(--op)}
p{margin:0;max-width:65ch}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(23px,5.4vw,32px);line-height:1.18;letter-spacing:-.015em}
h2{font-family:var(--f-display);font-weight:500;font-size:17px;letter-spacing:-.005em}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lede{color:var(--muted);font-size:17px}
.lede-s{color:var(--muted);font-size:15px}
.kv{display:flex;flex-direction:column;gap:6px;margin:4px 0 0}.kv div{display:flex;flex-wrap:wrap;gap:2px 12px}.kv dt{color:var(--muted);min-width:9.5em}.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.abc table{min-width:0}
.voc{display:flex;flex-direction:column;gap:8px}.voc-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}.voc-t{font-weight:600;min-width:12em}.voc-row input{flex:1 1 14em;min-width:0}
.small{font-size:14px}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pre{white-space:pre-wrap;overflow-wrap:anywhere}
.ph{font-family:var(--f-mono);font-size:13px;background:var(--amber-soft);color:var(--amber);padding:1px 5px;border-radius:3px;white-space:nowrap}
.err{color:var(--pen);font-size:14px}
.ok-t{color:var(--op);font-size:14px}

html:not([data-ai="ready"]) .ai-on{display:none!important}
html:not([data-ai="off"]) .ai-off{display:none!important}

/* Header */
.top{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.brand{order:1;display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink)}
.brand b{font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:-.01em}
.brand b em{font-style:normal;color:var(--op)}
.brand span{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.langs{order:2;display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.langs a{font-family:var(--f-mono);font-size:11px;padding:3px 7px;color:var(--muted);text-decoration:none}
.langs a[aria-current]{background:var(--op-soft);color:var(--ink);font-weight:500}
@media (max-width:389px){.brand span{display:none}}
.ai-chip{order:2;margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.ai-chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--amber)}
html[data-ai="ready"] .ai-chip::before{background:var(--op)}
nav.tabs{order:3;width:100%;display:flex;gap:0}
nav.tabs a{flex:1 1 auto;text-align:center;padding:8px 4px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (min-width:400px){nav.tabs a{font-size:14px;padding:8px 4px}}
nav.tabs a[aria-current="page"]{background:var(--sheet);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
@media (min-width:660px){nav.tabs{order:2;width:auto;margin-left:12px}nav.tabs a{flex:none;padding:7px 14px;font-size:15px}.ai-chip{order:3}}

.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:24px 56px;display:flex;flex-direction:column;gap:28px}
section{display:flex;flex-direction:column;gap:12px;min-width:0}
.hero{gap:8px}
.foot{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 32px;color:var(--muted);font-size:13px}

.btn{font:inherit;font-size:15px;font-weight:500;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--op);border-color:var(--op);color:var(--op-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
:focus-visible{outline:2px solid var(--op);outline-offset:2px}
textarea,input[type="search"],input[type="password"],input[type="text"],select{font:inherit;font-size:16px;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);color:var(--ink);line-height:1.5}
textarea{resize:vertical}
select{width:auto;max-width:100%;min-height:40px;padding:6px 10px}
input[type="range"]{width:100%;accent-color:var(--op)}
.lbl{font-weight:600;font-size:15px}
.note{border-radius:var(--r);padding:12px 14px;font-size:14px;background:var(--amber-soft);border:1px solid var(--line);max-width:none}
.note.info{background:var(--op-soft)}

/* Home */
.parts{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:560px){.parts{grid-template-columns:1fr 1fr}}
.part{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--ink);min-width:0}
.part:hover{border-color:var(--op)}
.part .n{font-family:var(--f-mono);font-size:12px;color:var(--op)}
.part .de{font-weight:600;font-size:16px}
.part .ru{color:var(--muted);font-size:14px;flex:1}
.part .go{font-size:14px;color:var(--op);font-weight:500;margin-top:6px}
ul.prog{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet)}
ul.prog li{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 12px;padding:11px 14px;border-top:1px solid var(--line)}
ul.prog li:first-child{border-top:0}
ul.prog .mono{color:var(--muted)}

/* Patient label */
.etikett{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) 52px;gap:12px}
.et-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.et-main .nm{font-family:var(--f-mono);font-weight:500;font-size:15px;letter-spacing:.03em}
.et-main .meta{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.et-main .ls{margin-top:6px;font-size:15px}
.bc{background:repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 3px,var(--ink) 3px 5px,transparent 5px 6px,var(--ink) 6px 7px,transparent 7px 10px,var(--ink) 10px 12px,transparent 12px 13px);opacity:.75;border-radius:1px;min-height:56px}
.case-list{display:flex;flex-direction:column;gap:16px}
.case-card{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink)}
.case-card:hover .etikett{border-color:var(--op)}
.cc-steps{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.cc-steps .ok{color:var(--op)}
.cc-steps .ok::before{content:"✓ "}
.back{font-size:14px;text-decoration:none;align-self:flex-start}

.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.steps a{display:flex;flex-direction:column;gap:1px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--muted);min-width:0}
.steps .k{font-family:var(--f-mono);font-size:11px}
.steps .l{font-weight:600;font-size:14px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps .s{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps a[aria-current="page"]{background:var(--sheet);border-color:var(--op);box-shadow:inset 0 -2px 0 var(--op)}
.steps a.done .k::after{content:" ✓";color:var(--op)}
.tabbody{display:flex;flex-direction:column;gap:24px}

/* Chat */
.chat{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0}
.chat-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px 12px;padding:8px 14px;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.mode{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.mode button{font:inherit;font-family:var(--f-body);font-size:13px;padding:5px 12px;border:0;background:transparent;color:var(--muted);cursor:pointer;min-height:32px}
.mode button[aria-pressed="true"]{background:var(--op-soft);color:var(--ink);font-weight:500}
.log{display:flex;flex-direction:column;gap:10px;padding:14px;max-height:min(50vh,440px);min-height:150px;overflow-y:auto}
.msg{max-width:86%;display:flex;flex-direction:column;gap:2px;min-width:0}
.msg .who{font-family:var(--f-mono);font-size:11px;color:var(--muted);display:flex;gap:10px;align-items:center}
.msg .txt{padding:8px 12px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.me .txt{background:var(--op-soft);border-bottom-right-radius:4px}
.msg.them{align-self:flex-start}
.msg.them .txt{background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:4px}
.say{font:inherit;font-family:var(--f-mono);font-size:11px;color:var(--op);background:none;border:0;padding:2px 0;cursor:pointer}
.typing{color:var(--muted);font-style:italic}
.empty{margin:auto;color:var(--muted);font-size:14px;text-align:center;max-width:38ch;display:flex;flex-direction:column;align-items:center;gap:10px}
.voice-bar{display:flex;align-items:center;gap:14px;padding:12px 14px;border-top:1px solid var(--line)}
.mic{flex:none;width:64px;height:64px;border-radius:50%;border:0;background:var(--op);color:var(--op-ink);display:grid;place-items:center;cursor:pointer;position:relative}
.mic svg{width:26px;height:26px}
.mic.on{background:var(--pen)}
.mic.on::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--pen);animation:pulse 1.2s ease-out infinite}
@keyframes pulse{from{transform:scale(.9);opacity:1}to{transform:scale(1.25);opacity:0}}
@media (prefers-reduced-motion: reduce){.mic.on::after{animation:none;opacity:.6}}
.mic:disabled{opacity:.5;cursor:default}
.live{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.live .state{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.live .said{font-size:15px;overflow-wrap:anywhere}
.chat-form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);align-items:flex-end}
.chat-form textarea{flex:1;min-width:0;min-height:46px}
.chat-actions{padding:0 10px 10px}
.chat .err{padding:0 14px 8px}
.dict{display:flex;align-items:center;gap:12px}
.dict .mic{width:48px;height:48px}
.dict .mic svg{width:20px;height:20px}

/* Checklist */
.cl-wrap>summary{display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;padding:12px 14px;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);font-weight:600;list-style:none}
.cl-wrap>summary::-webkit-details-marker{display:none}
.cl-wrap>summary::after{content:"+";font-family:var(--f-mono);color:var(--muted);font-size:18px;line-height:1}
.cl-wrap[open]>summary{border-radius:var(--r) var(--r) 0 0}
.cl-wrap[open]>summary::after{content:"−"}
.cl-wrap>summary .mono{margin-left:auto;color:var(--muted);font-weight:400}
.cl{background:var(--sheet);border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r) var(--r)}
.cl-item{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.cl-item:first-child{border-top:0}
.box{width:18px;height:18px;border:1.5px solid var(--muted);border-radius:3px;margin-top:3px;display:grid;place-items:center;font-size:12px;line-height:1;color:var(--op-ink)}
.cl-item.ok .box{background:var(--op);border-color:var(--op)}
.cl-item.ok .box::after{content:"✓"}
.cl-item.miss .box{border-color:var(--pen);background:var(--pen-soft)}
.cl-body{display:flex;flex-direction:column;gap:2px;min-width:0}
.cl-t{font-weight:600;font-size:15px}
.cl-q{font-style:italic;color:var(--muted);font-size:14px}
.cl-a{background:var(--paper);border-radius:6px;padding:8px 10px;font-size:14px;margin-top:4px;max-width:none}
.linkbtn{font:inherit;font-size:13px;color:var(--op);background:none;border:0;padding:4px 0;cursor:pointer;text-align:left;align-self:flex-start;min-height:30px}

/* Feedback */
.fb{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:16px;min-width:0}
.fb.thinking{flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;color:var(--muted)}
.fb-sum{font-size:16px}
.fb-sec{display:flex;flex-direction:column;gap:8px}
.fb h3{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.meter{height:8px;background:var(--paper);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--op)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--paper)}
.chip.miss{border-color:var(--pen);color:var(--pen);background:var(--pen-soft)}
ul.corr{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
ul.corr li{display:flex;flex-direction:column;gap:3px;padding-bottom:10px;border-bottom:1px dashed var(--line);overflow-wrap:anywhere}
ul.corr li:last-child{border-bottom:0;padding-bottom:0}
ul.corr del{color:var(--pen);text-decoration-thickness:1.5px}
ul.corr ins{color:var(--op);text-decoration:none;font-weight:500}
ul.corr .why{font-size:14px;color:var(--muted)}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}

.muster{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.muster dl{margin:0;display:flex;flex-direction:column;gap:12px}
.muster dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--op)}
.muster dd{margin:2px 0 0;white-space:pre-line;overflow-wrap:anywhere}
.notes-ro>summary{cursor:pointer;color:var(--op);font-size:14px}
.notes-ro .pre{margin-top:8px;background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;max-width:none}
.phr{display:flex;flex-wrap:wrap;gap:6px}
.chip-btn{font:inherit;font-size:13px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer;text-align:left;min-height:36px}
.chip-btn:hover{border-color:var(--op)}

/* Vocab */
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--sheet);align-self:flex-start}
.seg button{font:inherit;font-size:14px;border:0;background:transparent;padding:6px 14px;border-radius:6px;color:var(--muted);cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--op-soft);color:var(--ink);font-weight:500}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:15px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--op);flex:none}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:22px 20px;min-height:210px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.term{font-family:var(--f-display);font-weight:500;font-size:clamp(22px,6vw,30px);line-height:1.2;overflow-wrap:anywhere}
.lay{font-size:19px;font-weight:500}
.ru{color:var(--muted)}
.hint{color:var(--muted);font-size:14px}
.opts{display:grid;gap:8px}
.opt{justify-content:flex-start;text-align:left;font-weight:400;width:100%}
.opt.right{border-color:var(--op);background:var(--op-soft)}
.opt.wrong{border-color:var(--pen);background:var(--pen-soft)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
th,td{padding:8px 12px;text-align:left;border-top:1px solid var(--line);vertical-align:top}
thead th{border-top:0;font-family:var(--f-mono);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.tick{width:32px;height:32px;border-radius:6px;border:1px solid var(--line);background:transparent;color:transparent;cursor:pointer;font-size:15px}
.tick.on{background:var(--op);border-color:var(--op);color:var(--op-ink)}

/* Exam + drill */
.exam-pill{order:2;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--pen-soft);color:var(--pen);text-decoration:none}
@media (min-width:660px){.exam-pill{order:3}}
.exhead{gap:8px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px);z-index:5;background:var(--paper);padding-block:6px}
@media (min-width:660px){.exhead{top:calc(env(safe-area-inset-top,0px) + 56px)}}
.ex-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.ex-clock{font-size:26px;font-weight:500;color:var(--ink)}
.ex-clock.low{color:var(--pen)}
.bar-row{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.steps-ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.drill-form input{flex:1;min-width:0}
html[lang="de"] .c3{display:none}
/* Materials */
.mat-list{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:560px){.mat-list{grid-template-columns:1fr 1fr}}
.mat-sec{gap:10px}
ul.ph-list{list-style:none;margin:0;padding:0;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r)}
.ph-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 14px;border-top:1px solid var(--line);align-items:baseline}
.ph-row:first-child{border-top:0}
.ph-de{font-weight:500;overflow-wrap:anywhere}

    no:[
      [/\sct\s|computertomo/,"Ein CT brauchen wir im Moment nicht als erste Untersuchung. Welche Bildgebung machen Sie zuerst?"],
      [/bronchoskop/,"Eine Bronchoskopie ist jetzt nicht indiziert. Welche Diagnostik kommt zuerst?"],
      [/sono|ultraschall/,"Eine Sonographie des Thorax kann einen Pleuraerguss zeigen, ist aber hier nicht die Basisdiagnostik. Welche Bildgebung machen Sie zuerst?"]],
    rep:[["Diagnose: ambulant erworbene Pneumonie",/pneumonie|lungenentzündung/],["Infiltrat im rechten Unterlappen",/unterlappen|infiltrat|verschattung/],["Rasselgeräusche, Bronchialatmen, Dämpfung",/rasselgeräusch|bronchialatm|dämpfung|gedämpft/],["Hypoxämie: SpO₂ 89 %, pO₂ 56 mmHg",/\s89|\s56|hypox|sättigung|respiratorisch/],["CRB-65",/\scrb/],["Diabetes mellitus Typ 2",/diabetes/],["Antibiose",/antibio/],["Sauerstoffgabe",/sauerstoff|\so2/],["Metformin pausieren, Blutzucker kontrollieren",/metformin|insulin|blutzucker/]],
    bericht:"Anamnese: Herr Dieter Wagner, 67 Jahre, stellte sich mit seit vier Tagen bestehendem, seit zwei Tagen produktivem Husten mit gelblich-grünem Auswurf vor. Begleitend bestehen Fieber bis 39,2 °C mit Schüttelfrost, Nachtschweiß, Belastungsdyspnoe und atemabhängige Schmerzen im rechten Thorax. Vorerkrankungen: Diabetes mellitus Typ 2, arterielle Hypertonie, Hypercholesterinämie. Medikation: Metformin, Amlodipin, Simvastatin. Nikotinabusus mit ca. 40 pack years. Keine Influenza-Impfung in dieser Saison.\n\nBefunde: RR 135/80 mmHg, HF 108/min, AF 26/min, SpO₂ 89 % unter Raumluft, Temperatur 39,0 °C, wach und orientiert. Rechts basal klingende Rasselgeräusche, Bronchialatmen und gedämpfter Klopfschall. Labor: Leukozytose 17,2/nl, CRP 186 mg/l, PCT 1,8 ng/ml, Blutzucker 248 mg/dl. BGA unter Raumluft: pO₂ 56 mmHg, pCO₂ 32 mmHg. Röntgen-Thorax: Infiltrat im rechten Unterlappen, kein Erguss.\n\nDiagnose: Ambulant erworbene Pneumonie im rechten Unterlappen mit Hypoxämie. CRB-65: 1 Punkt (Alter).\n\nPrognose: Unter adäquater Therapie meist gut. Alter, Diabetes und Hypoxämie erhöhen das Risiko, deshalb ist eine stationäre Behandlung nötig.\n\nBehandlungsplan: Stationäre Aufnahme, Sauerstoffgabe mit einer Zielsättigung von 92 bis 96 %, kalkulierte Antibiose mit Ampicillin/Sulbactam i. v., gegebenenfalls für drei Tage plus Azithromycin (kein Clarithromycin wegen Simvastatin), Therapiedauer in der Regel fünf Tage bei klinischer Stabilität seit mindestens zwei Tagen. Antipyrese, Flüssigkeit, Thromboseprophylaxe. Metformin pausieren, Blutzucker engmaschig kontrollieren, bei Bedarf Insulin. Wegen des regelmäßigen Alkoholkonsums Monitoring auf ein Alkoholentzugssyndrom, Thiamingabe erwägen. Klinische Kontrolle nach 48 bis 72 Stunden. Röntgen-Thorax-Kontrolle frühestens zwei Wochen nach Therapieende zum Ausschluss eines Bronchialkarzinoms. Beratung zum Rauchstopp, Impfungen nach der Genesung.\n\nEpikrise: Der 67-jährige Patient wurde mit einer ambulant erworbenen Pneumonie im rechten Unterlappen und Hypoxämie stationär aufgenommen. Wir haben eine Sauerstofftherapie und eine kalkulierte Antibiose begonnen.",
    qs:[
      {t:"Diagnose",q:"Was ist Ihre Diagnose, und wie begründen Sie sie?",k:[["ambulant erworbene Pneumonie",/pneumonie|lungenentzündung/],["Fieber, produktiver Husten",/fieber|husten|auswurf|sputum/],["Rasselgeräusche, Bronchialatmen, Dämpfung",/rasselgeräusch|bronchialatm|dämpfung|gedämpft/],["Infiltrat im Röntgen",/röntgen|infiltrat|verschattung/],["Entzündungswerte erhöht",/leukozyt|\scrp|procalcitonin|\spct|entzündungswert/]],
        a:"Ich gehe von einer ambulant erworbenen Pneumonie im rechten Unterlappen aus. Dafür sprechen Fieber, produktiver Husten und Dyspnoe, rechts basal klingende Rasselgeräusche mit Bronchialatmen und Dämpfung, das Infiltrat im Röntgenbild sowie die erhöhten Entzündungswerte."},      {t:"Differenzialdiagnosen",q:"Welche Differenzialdiagnosen ziehen Sie in Betracht?",k:[["akute Bronchitis",/bronchitis/],["Exazerbation einer COPD",/copd|exazerbation/],["Lungenembolie",/embolie/],["Bronchialkarzinom mit poststenotischer Pneumonie",/karzinom|tumor|krebs|poststenot/],["virale Infektion, z. B. Influenza oder COVID-19",/influenza|grippe|covid|corona|viral/]],
        a:"Differenzialdiagnostisch kommen eine akute Bronchitis, eine Exazerbation einer bisher nicht bekannten COPD, eine Lungenembolie und eine virale Infektion wie Influenza oder COVID-19 infrage. Bei 40 pack years muss ich außerdem an ein Bronchialkarzinom mit poststenotischer Pneumonie denken."},

      {t:"Diagnose",id:"schwere",q:"Wie schätzen Sie den Schweregrad ein, und wo behandeln Sie den Patienten?",k:[["CRB-65",/\scrb|\scurb/],["1 Punkt für das Alter",/ein punkt|1 punkt|einen punkt|alter|\s65/],["Hypoxämie: SpO₂ 89 %, pO₂ 56 mmHg",/hypox|sättigung|\s89|\s56|sauerstoff/],["stationäre Aufnahme",/stationär|aufnehm|aufnahme|krankenhaus/]],
        a:"Nach CRB-65 hat der Patient einen Punkt für das Alter. Entscheidend ist aber die Hypoxämie mit einer Sättigung von 89 Prozent und einem pO₂ von 56 mmHg. Dazu kommen der Diabetes und der reduzierte Allgemeinzustand. Ambulant behandeln kann man in der Regel nur Patienten mit einem CRB-65 von null, ausreichender Oxygenierung und ohne instabile Begleiterkrankungen. Deshalb nehme ich ihn stationär auf."},
      {t:"Diagnose",q:"Wofür stehen die Buchstaben im CRB-65-Score?",k:[["Confusion: Verwirrtheit",/confusion|verwirr|bewusst/],["Atemfrequenz ab 30 pro Minute",/atemfrequenz|respirat|\s30|dreißig|dreissig/],["Blutdruck: systolisch unter 90 oder diastolisch höchstens 60",/blutdruck|blood|\s90|\s60/],["Alter ab 65 Jahren",/alter|\s65|fünfundsechzig/]],
        a:"C steht für Confusion, also neu aufgetretene Verwirrtheit. R steht für eine Atemfrequenz von 30 pro Minute oder mehr. B steht für einen systolischen Blutdruck unter 90 mmHg oder einen diastolischen Blutdruck von 60 mmHg oder weniger. 65 steht für ein Alter ab 65 Jahren. Jedes Kriterium zählt einen Punkt."},
      {t:"Therapie",q:"Welche Antibiotikatherapie beginnen Sie?",k:[["Aminopenicillin mit Betalaktamase-Inhibitor oder Cephalosporin",/ampicillin|sulbactam|amoxicillin|clavulan|unacid|augmentan|cephalosporin|ceftriaxon|cefuroxim|cefotaxim/],["intravenös",/intravenös|\si v\s|\siv\s|infusion/],["gegebenenfalls plus Makrolid: Azithromycin wegen Simvastatin",/makrolid|clarithromycin|azithromycin/],["Dauer in der Regel fünf Tage",/fünf|\s5|tage/]],
        a:"Ich beginne kalkuliert mit Ampicillin/Sulbactam intravenös, alternativ mit einem Cephalosporin wie Ceftriaxon. Bei mittelschwerer Pneumonie kann ich ein Makrolid dazugeben. Ich wähle Azithromycin, weil Clarithromycin mit Simvastatin kontraindiziert ist. Ohne Nachweis atypischer Erreger beende ich das Makrolid nach drei Tagen. Die Therapie dauert in der Regel fünf Tage, wenn der Patient seit mindestens zwei Tagen klinisch stabil ist. Bei klinischer Besserung stelle ich früh auf eine orale Therapie um."},
      {t:"Pharmakologie",id:"metformin",q:"Was machen Sie mit dem Metformin?",k:[["pausieren",/pausier|absetz|abgesetzt|stopp|nicht weiter|aussetz/],["Risiko einer Laktatazidose",/laktat|azidose/],["Blutzucker kontrollieren, bei Bedarf Insulin",/blutzucker|insulin/]],
        a:"Ich pausiere Metformin, weil bei schwerer Infektion, Hypoxämie und eventueller Kontrastmittelgabe das Risiko einer Laktatazidose steigt. Den Blutzucker kontrolliere ich engmaschig und behandle bei Bedarf mit Insulin."},
      {t:"Komplikationen",q:"Welche Komplikationen einer Pneumonie kennen Sie?",k:[["Pleuraerguss, Pleuraempyem",/pleura|erguss|empyem/],["Sepsis, septischer Schock",/sepsis|septisch|schock/],["Lungenabszess",/abszess/],["respiratorische Insuffizienz, ARDS",/respiratorisch|\sards|insuffizienz|beatmung/],["kardiale Dekompensation, Delir",/kardial|dekompens|delir|herzinsuffizienz/]],
        a:"Typische Komplikationen sind ein parapneumonischer Pleuraerguss oder ein Pleuraempyem, eine Sepsis bis zum septischen Schock, ein Lungenabszess und eine respiratorische Insuffizienz bis zum ARDS. Bei älteren Patienten kommen eine kardiale Dekompensation und ein Delir dazu."},
      {t:"Recht",q:"Der Patient möchte trotz der Hypoxämie nach Hause gehen. Wie gehen Sie vor?",k:[["über die Risiken aufklären",/aufklär|risik|gefahr|erklär/],["Entscheidung respektieren, wenn er einwilligungsfähig ist",/selbstbestimm|einwilligungsfähig|entscheid|wille|respektier/],["Entlassung gegen ärztlichen Rat dokumentieren und unterschreiben lassen",/dokument|unterschr|gegen ärztlichen rat|revers/],["trotzdem versorgen: Hausarzt, Antibiose, Rückkehr jederzeit",/hausarzt|rezept|antibio|wiederkommen|zurückkommen|jederzeit/]],
        a:"Ich kläre ihn ausführlich über die Risiken auf, bis hin zur Lebensgefahr. Wenn er einwilligungsfähig ist, muss ich seine Entscheidung respektieren. Ich dokumentiere die Aufklärung und lasse ihn die Entlassung gegen ärztlichen Rat unterschreiben. Verweigert er die Unterschrift, dokumentiere ich das mit einer Zeugin oder einem Zeugen. Trotzdem gebe ich ihm eine orale Antibiose und einen Arztbrief mit, empfehle eine baldige Kontrolle beim Hausarzt und sage ihm, dass er jederzeit zurückkommen kann."},
      {t:"Prävention",q:"Welche Impfungen empfehlen Sie nach der Genesung?",k:[["Pneumokokken",/pneumokokk/],["Influenza, jährlich",/influenza|grippe/],["COVID-19-Auffrischung",/covid|corona|sars/],["Beratung zum Rauchstopp",/rauch/]],
        a:"Nach den Empfehlungen der STIKO rate ich zur Pneumokokken-Impfung, die ab 60 Jahren als Standardimpfung gilt, zur jährlichen Influenza-Impfung und zur COVID-19-Auffrischimpfung. Außerdem berate ich ihn zum Rauchstopp."}]

  bein:{
    safe:[["Schwangerschaftstest vor der Antikoagulation",{t:"hcg"}],["Herz und Lunge untersucht: an Lungenembolie gedacht",{e:"herz"}],["Lungenembolie als Gefahr benannt, Notruf 112 erklärt",{q:"warn",k:[0,4]}]],
    dx:"Tiefe Beinvenenthrombose der V. poplitea und der Vv. fibulares links",
    vor:{t:"Fallvorstellung",q:"Bitte stellen Sie uns Ihre Patientin kurz vor.",k:[["Name und Alter",/schmid|\s34|jahre alt|jährig/],["Leitsymptom: Schwellung des linken Unterschenkels",/schwellung|geschwollen|unterschenkel|wade/],["Risikofaktoren: Pille, Rauchen, Flug",/pille|kontrazept|östrogen|rauch|\sflug|geflogen/],["Befunde: Umfangsdifferenz, Kompressionssonographie",/umfang|ödem|überwärm|kompression|sono|ultraschall/],["Diagnose",/thrombose|\stvt/],["Therapie: Antikoagulation",/antikoag|rivaroxaban|apixaban|heparin|blutverdünn|doak|noak/]],
      a:"Frau Anna Schmid ist 34 Jahre alt und kam mit einer seit drei Tagen zunehmenden, schmerzhaften Schwellung des linken Unterschenkels. Vor einer Woche hatte sie einen elfstündigen Flug. Sie nimmt seit zehn Jahren die Pille, das Präparat ist nicht bekannt, am ehesten ein östrogenhaltiges Kombinationspräparat. Außerdem raucht sie, und ihre Mutter hatte ebenfalls eine Thrombose. Hinweise auf eine Lungenembolie gibt es nicht. Der linke Unterschenkel ist geschwollen, überwärmt und livide, mit einer Umfangsdifferenz von vier Zentimetern. Die Kompressionssonographie zeigt eine Thrombose der Vena poplitea und der Venae fibulares links. Wir haben eine Antikoagulation mit Rivaroxaban begonnen, die Behandlung ist ambulant möglich."},

      ["insp","Inspektion der Beine",/inspektion|inspizier|anschau|ansehen|verfärb|rötung|\shaut|schwellung/,"Linker Unterschenkel geschwollen, livide verfärbt, Haut gespannt und glänzend. Keine Wunden, keine scharf begrenzte Rötung, keine sichtbaren Kollateralvenen.",true],
      ["umf","Umfangsmessung",/umfang|messe[a-z]*( [^ ]+){0,2} (wade|bein|unterschenkel)|maßband|massband|zentimeter/,"Wadenumfang 10 cm unterhalb der Tuberositas tibiae: links 41 cm, rechts 37 cm, also 4 cm Differenz.",true],
      ["palp","Palpation",/palp|\stast|abtast|druckschmerz|überwärm|ödem|eindrück|delle/,"Linke Wade überwärmt, Druckschmerz entlang der tiefen Venen. Eindrückbares Ödem bis zum Knie.",true],
      ["zeichen","Klinische Thrombosezeichen",/homans|meyer|payr|dorsalflex|fusssohle|thrombosezeichen/,"Homans-, Meyer- und Payr-Zeichen positiv. Diese Zeichen sind allerdings unspezifisch.",false],
      ["puls","Fußpulse, Durchblutung, Sensibilität, Motorik",/fusspuls|pulse |pulsstatus|durchblut|sensib|motorik|\sdms|dorsalis pedis|tibialis/,"Fußpulse beidseits gut tastbar, Sensibilität und Motorik intakt.",true],
      ["knie","Kniekehle",/kniekehle|baker|\sknie/,"Kniekehle links ohne tastbare Schwellung oder Zyste.",false],
      ["herz","Herz und Lunge",kpAus("herz|lunge"),"Herztöne rein und rhythmisch. Vesikuläres Atemgeräusch beidseits, keine Rasselgeräusche. Klinisch kein Hinweis auf eine Lungenembolie.",true],
      ["abd","Abdomen",kpObj("palp|tast|auskult|abhör|perku|klopf|untersuch","bauch|abdomen"),"Abdomen weich, kein Druckschmerz, keine tastbaren Resistenzen.",false]],
    tests:[
      ["kus","Kompressionssonographie",/kompression[a-z]*sono|sono|ultraschall|duplex/,"Kompressionssonographie: Vena poplitea und Venae fibulares links aufgeweitet, nicht komprimierbar, mit echoarmem Material im Lumen. Vena femoralis frei. Rechts unauffällig.",true],
      ["dd","D-Dimere",/d ?dimer/,"D-Dimere 2,8 mg/l FEU, der Normwert liegt unter 0,5.",false],
      ["lab","Labor",new RegExp(KP_LAB+"|gerinnung|thrombozyt|kreatinin|niere|\\sinr|quick|\\sptt"),"Blutbild unauffällig, Thrombozyten 245 pro Nanoliter. Quick 98 Prozent, INR 1,0, aPTT 29 Sekunden. Kreatinin 0,7 mg/dl, CRP 12 mg/l.",true],

    no:[
      [/phlebograph/,"Die Phlebographie wird heute nur noch selten eingesetzt. Welche Untersuchung ist Methode der ersten Wahl?"],
      [/\sct\s|computertomo|angio/,"Ein CT brauchen wir nur bei Verdacht auf eine Lungenembolie. Gibt es dafür Hinweise?"],
      [/röntgen/,"Ein Röntgenbild hilft bei Verdacht auf eine Thrombose nicht weiter. Welche Untersuchung ist Methode der ersten Wahl?"]],
    rep:[["Diagnose: tiefe Beinvenenthrombose links",/thrombose|\stvt/],["Lokalisation: V. poplitea, Vv. fibulares",/poplitea|fibular/],["Kompressionssonographie",/kompressionssono|sonograph/],["Umfangsdifferenz 4 cm",/umfang|differenz/],["Wells-Score",/wells/],["Risikofaktoren: Pille, Rauchen, Langstreckenflug",/pille|kontrazept|östrogen|\sflug|rauch/],["Kein Hinweis auf Lungenembolie",/lungenembolie|dyspnoe/],["Antikoagulation",/antikoag|rivaroxaban|apixaban|heparin|blutverdünn|doak|noak/],["Kompression und frühe Mobilisation",/kompressionsstr|kompressionsther|kompressionsverb|mobilis/]],
    bericht:"Anamnese: Frau Anna Schmid, 34 Jahre, stellte sich mit einer seit drei Tagen zunehmenden, schmerzhaften Schwellung des linken Unterschenkels vor. Vor einer Woche hatte sie einen elfstündigen Langstreckenflug. Dyspnoe, Thoraxschmerzen, Hämoptysen und Fieber wurden verneint. Medikation: orales Kontrazeptivum seit zehn Jahren, Ibuprofen bei Bedarf. Nikotinabusus mit ca. 10 Zigaretten pro Tag. Familienanamnese: Beinvenenthrombose der Mutter mit 45 Jahren.\n\nBefunde: RR 125/80 mmHg, HF 88/min, SpO₂ 98 %, Temperatur 37,4 °C. Linker Unterschenkel geschwollen, überwärmt und livide, Umfangsdifferenz 4 cm, eindrückbares Ödem, Druckschmerz entlang der tiefen Venen. Fußpulse tastbar. Herz und Lunge unauffällig. Wells-Score 3 Punkte: Thrombose wahrscheinlich. Kompressionssonographie: Thrombose der V. poplitea und der Vv. fibulares links. Labor einschließlich Gerinnung und Nierenwerten unauffällig, Schwangerschaftstest negativ.\n\nDiagnose: Tiefe Beinvenenthrombose der V. poplitea und der Vv. fibulares links. Risikofaktoren: orales Kontrazeptivum, Nikotinabusus, Langstreckenflug, positive Familienanamnese.\n\nPrognose: Unter Antikoagulation gut. Mögliche Komplikationen sind eine Lungenembolie, ein Rezidiv und langfristig ein postthrombotisches Syndrom.\n\nBehandlungsplan: Therapeutische Antikoagulation, zum Beispiel Rivaroxaban 15 mg zweimal täglich für drei Wochen, danach 20 mg einmal täglich, jeweils zu einer Mahlzeit, für mindestens drei Monate. Wegen der Schwellung frühzeitige Kompressionstherapie, zunächst mit einem Kompressionsverband, nach Abschwellung mit einem Wadenkompressionsstrumpf der Klasse 2. Frühe Mobilisation. Unter Antikoagulation kein Ibuprofen oder andere NSAR; bei Migräne Paracetamol oder ein Triptan. Präparat der Pille klären, ein östrogenhaltiges Kontrazeptivum absetzen, Verhütung mit der Gynäkologin besprechen. Beratung zum Rauchstopp. Aufklärung über das Blutungsrisiko und die Warnzeichen einer Lungenembolie.\n\nEpikrise: Die 34-jährige Patientin stellte sich mit einer tiefen Beinvenenthrombose links vor. Wir haben eine orale Antikoagulation mit Rivaroxaban begonnen. Ohne Hinweis auf eine Lungenembolie ist eine ambulante Behandlung möglich.",
    qs:[
      {t:"Diagnose",q:"Was ist Ihre Diagnose, und wie haben Sie sie gesichert?",k:[["tiefe Beinvenenthrombose",/thrombose|\stvt/],["Kompressionssonographie",/kompression|sono|ultraschall/],["V. poplitea und Vv. fibulares links",/poplitea|fibular|knie/]],
        a:"Es handelt sich um eine tiefe Beinvenenthrombose links mit Beteiligung der Vena poplitea und der Venae fibulares. Gesichert ist sie durch die Kompressionssonographie: Die Venen sind nicht komprimierbar und aufgeweitet, im Lumen liegt echoarmes Thrombusmaterial."},      {t:"Differenzialdiagnosen",q:"Welche Differenzialdiagnosen haben Sie erwogen?",k:[["rupturierte Baker-Zyste",/baker/],["Muskelfaserriss oder Hämatom",/muskel|faserriss|hämatom|zerrung/],["Erysipel",/erysipel|wundrose/],["oberflächliche Thrombophlebitis",/thrombophlebitis|oberflächlich/],["Lymphödem",/lymph/]],
        a:"Erwogen habe ich eine rupturierte Baker-Zyste, einen Muskelfaserriss oder ein Hämatom, ein Erysipel, eine oberflächliche Thrombophlebitis und ein Lymphödem. Gegen ein Erysipel sprechen das fehlende Fieber und die nicht scharf begrenzte Rötung, gegen eine Baker-Zyste die unauffällige Kniekehle."},

      {t:"Diagnostik",q:"Berechnen Sie bitte den Wells-Score für die Patientin.",k:[["Umfangsdifferenz mindestens 3 cm",/umfang|\s3 cm|\s4 cm|drei zentimeter|vier zentimeter|schwellung/],["eindrückbares Ödem",/ödem/],["Druckschmerz entlang der tiefen Venen",/druckschmerz|verhärt|schmerz/],["3 Punkte: Thrombose wahrscheinlich",/3 punkte|drei punkte|wahrscheinlich|\shoch/]],
        a:"Die Patientin bekommt je einen Punkt für die Umfangsdifferenz des Unterschenkels von mindestens drei Zentimetern, für das eindrückbare Ödem und für den Druckschmerz entlang der tiefen Venen. Das sind drei Punkte, eine Thrombose ist also wahrscheinlich. Der Langstreckenflug ist im Wells-Score kein eigenes Kriterium."},
      {t:"Diagnostik",q:"Wann sind D-Dimere sinnvoll, und wann nicht?",k:[["bei niedriger Wahrscheinlichkeit zum Ausschluss",/niedrig|gering|ausschl|ausschluss/],["negativer Wert schließt weitgehend aus",/negativ|vorhersage/],["bei hoher Wahrscheinlichkeit direkt Sonographie",/\shoch|direkt|sofort|sono|ultraschall/],["unspezifisch: Entzündung, Tumor, Operation, Schwangerschaft",/unspezifisch|entzündung|schwanger|tumor|operation|\salter/]],
        a:"D-Dimere sind sinnvoll, wenn die klinische Wahrscheinlichkeit niedrig ist: Ein negativer Wert schließt eine Thrombose dann weitgehend aus. Bei hoher Wahrscheinlichkeit wie hier gehe ich direkt zur Kompressionssonographie. D-Dimere sind unspezifisch und auch bei Entzündungen, Tumoren, nach Operationen, in der Schwangerschaft und im Alter erhöht."},

/* ---------- chats ---------- */
const CH={},FB={},COV={},FBRUN={},FREE={};
function chatOf(id,kind){const k=id+":"+kind;return CH[k]||(CH[k]={turns:[],busy:false,ctl:null,start:0,end:0,err:""})}
function themLabel(c,kind){return kind==="kpu"||kind==="kpp"?"Prüfer":kind==="patient"||kind==="aufkl"?(c.sex==="w"?"Patientin":"Patient"):kind==="tel"?"Praxis Dr. Berger":"Oberarzt"}
function paintChat(id,kind){if(!viewIs(id))return;const log=$("#log-"+kind);if(!log)return;const ch=chatOf(id,kind);const c=byId(id);const isP=kind==="patient";
  let h="";
  if(!ch.turns.length&&!ch.busy){h=kind==="kpu"?`<p class="empty">Скажите, что вы делаете, например «Ich messe die Vitalparameter» или «Ich auskultiere die Lunge». Экзаменатор назовёт находку.</p>`:kind==="kpp"?`<div class="empty"><p>Комиссия задаст вопросы по вашему пациенту и по теме: диагноз, лечение, осложнения, неотложные и правовые вопросы.</p><button type="button" class="btn primary" data-action="start-kpp">Начать разговор</button></div>`:kind==="aufkl"?`<p class="empty">Нажмите микрофон и начните объяснение по-немецки. Говорите простыми словами: пациент переспросит незнакомые термины и задаст свои вопросы.</p>`:kind==="tel"?`<div class="empty"><p>Звонит сотрудница практики семейного врача. Ответьте на звонок, представьтесь и продиктуйте данные с карточки.</p><button type="button" class="btn primary" data-action="start-tel">Ответить на звонок</button></div>`:isP?`<p class="empty">Нажмите микрофон и начните по-немецки: поздоровайтесь, представьтесь и спросите, что привело пациента.${freeMode()?" В режиме «Без ИИ» пациент узнаёт типичные вопросы анамнеза.":""}</p>`:`<div class="empty"><p>Oberarzt задаст вопросы по вашему докладу: термины, диагнозы, дальнейшие шаги.</p><button type="button" class="btn primary" data-action="start-ober">Начать разговор</button></div>`}
  ch.turns.forEach((t,i)=>{const me=t.role==="user";h+=`<div class="msg ${me?"me":"them"}"><span class="who">${me?"Вы":themLabel(c,kind)}${!me&&(TTS||AUD)?`<button type="button" class="say" data-action="say" data-kind="${kind}" data-i="${i}">повторить вслух</button>`:""}</span><div class="txt" lang="de">${esc(t.content)}</div></div>`});
  if(ch.busy)h+=`<div class="msg them"><span class="who">${themLabel(c,kind)}</span><div class="txt"><span class="typing">думает…</span></div></div>`;
  log.innerHTML=h;log.scrollTop=log.scrollHeight;
  const err=$("#err-"+kind);if(err){err.textContent=ch.err;err.hidden=!ch.err}
  const started=isP||kind==="aufkl"||kind==="kpu"||ch.turns.length||ch.busy;
  const vb=$("#vb-"+kind);if(vb)vb.hidden=!started;
  const mic=vb&&vb.querySelector(".mic");if(mic)mic.disabled=ch.busy||!SR;
  const form=$(`.chat-form[data-kind="${kind}"]`);if(form){if(!started)form.hidden=true;else if(!SR)form.hidden=false;const b=form.querySelector("button");if(b)b.disabled=ch.busy}
  const kb=$(`[data-action="kb"][data-kind="${kind}"]`);if(kb)kb.hidden=!started||!SR;
  const stop=$(`[data-action="stop"][data-kind="${kind}"]`);if(stop)stop.hidden=!ch.busy;
  const nx=$(`[data-action="ober-next"]`);if(nx&&kind==="ober")nx.hidden=!(freeMode()&&ch.qs&&!ch.fin);
  document.querySelectorAll('[data-action="mode"]').forEach(x=>x.setAttribute("aria-pressed",String((x.dataset.m==="free")===freeMode())));
  document.querySelectorAll(".free-note").forEach(x=>{x.hidden=!freeMode()});
  if(kind==="aufkl")paintPts(id);
  if(kind==="kpu"){const b=$("#kpu-bef");if(b)b.innerHTML=kpBefHTML(id)}
  if(kind==="kpp"){const nk=$('[data-action="kpp-next"]');if(nk)nk.hidden=!(ch.qs&&!ch.fin)}}
async function send(id,kind,text){if(kind==="kpu")return sendKpu(id,text);if(kind==="kpp")return sendKpp(id,text);if(freeMode())return sendFree(id,kind,text);const ch=chatOf(id,kind);if(ch.busy)return;
  if(!KEY){ch.err="Добавьте API-ключ в настройках.";paintChat(id,kind);return}
  const c=byId(id);
  if(kind==="aufkl"||kind==="tel")ch.mode="ai";
  if(ch.fin&&kind==="tel")return;
  if(text){ch.turns.push({role:"user",content:text});if(!ch.start)ch.start=Date.now();ch.end=0;if(kind==="patient")trackQ(c,ch,text,false);if(kind==="aufkl")aufklTrack(c,ch,text)}
  ch.busy=true;ch.err="";paintChat(id,kind);
  const system=kind==="patient"?patientRules(c):kind==="aufkl"?aufklRules(c):kind==="tel"?telRules(c):(R.v==="exam"&&fxStep()?oberRulesFx(c):oberRules(c,(R.v==="exam"&&EX&&EX.caseId===id)?EX.vor:draft(id).vor));
  const msgs=normalize(ch.turns.slice(-40),kind==="ober"?(R.v==="exam"&&fxStep()?"(Die Assistenzärztin bzw. der Assistenzarzt kommt zu dir, um einen Fall vorzustellen.)":"(Die Fallvorstellung ist beendet. Bitte stellen Sie Ihre erste Frage.)"):kind==="tel"?"(Das Telefon klingelt, die Ärztin bzw. der Arzt in der Klinik nimmt ab. Beginne das Gespräch.)":"");
  const ctl=new AbortController();ch.ctl=ctl;let reply="";
  try{reply=await chatCall(system,msgs,400,ctl.signal);ch.turns.push({role:"assistant",content:reply})}
  catch(e){ch.err=errText(e);if(LIVE.on)liveStop()}
  finally{ch.busy=false;ch.ctl=null;paintChat(id,kind)}
  if(reply&&kind==="tel"&&/wiederhören/i.test(reply)&&ch.turns.some(t=>t.role==="user")){ch.fin=true;LIVE.end=true;telFinish(id)}
  if(reply&&viewIs(id))speakSegs([reply],roleOf(kind,id)).then(liveNext)}

function thinkingHTML(kind){return `<div class="fb thinking"><span>Claude проверяет… Обычно это занимает до минуты.</span><button type="button" class="btn ghost" data-action="stop-fb" data-kind="${kind}">Остановить</button></div>`}
async function runJSON(kind,id,prompt,onOk){const slot=$("#fb-"+kind);

    const d=parseJSON(t);if(!d||typeof d!=="object"||Array.isArray(d))throw {code:"invalid_json"};FB[id+":"+kind]=d;onOk(d);histAI(kind,id,d);

    h+=`<div class="fb-sec"><h3>Темы анамнеза</h3><div class="meter" role="img" aria-label="Охвачено ${cov.length} из ${c.items.length} тем"><i style="width:${pct}%"></i></div><p class="small">Спрошено ${cov.length} из ${c.items.length} тем${miss.length?". Пропущено:":"."}</p>${miss.length?`<div class="chips">${miss.map(i=>`<span class="chip miss" lang="de">${esc(i.t)}</span>`).join("")}</div>`:""}</div>`}
  h+=`<div class="fb-sec"><h3>Исправления</h3>`+(corr.length?`<ul class="corr">${corr.map(x=>`<li><span lang="de"><del>${esc(str(x.original))}</del></span><span lang="de"><ins>${esc(str(x.korrektur))}</ins></span>${x.erklaerung?`<span class="why">${esc(str(x.erklaerung))}</span>`:""}</li>`).join("")}</ul>`:`<p class="small">Явных языковых ошибок не найдено.</p>`)+`</div>`;
  const kpK=kind==="kpb"||kind==="kpp";const secs=kpK?[["falsch","Медицинские ошибки"],["fehlend","Чего не хватает"],["staerken","Что получилось"],["tipps","Советы"]]:[["fehlend","Чего не хватает"],["falsch","Неточности по фактам"],["staerken","Что получилось"],["tipps","Советы"]];

/* ---------- FaMed modules: patient education, phone call with spelling, listening ---------- */
function mkFach([term,lay]){const base=term.replace(/\s*\(.*\)/,"");const ws=base.split(/\s+/);let w=ws[0];for(const x of ws)if(x.length>=w.length)w=x;
  let stem=w.toLowerCase().replace(/ß/g,"ss");if(stem.length>6)stem=stem.slice(0,-1);
  return {term:base,lay,re:new RegExp("\\s"+stem.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"))}}
const AFACH=AUFKL_FACH_RAW.map(mkFach);
function findFachA(n){for(const f of AFACH)if(f.re.test(n))return f;return findFach(n)}
const sents=t=>(str(t).match(/[^.!?]+[.!?]+/g)||[str(t)]).map(s=>s.trim()).filter(Boolean);
function roleOf(kind,id){return kind==="ober"||kind==="kpu"||kind==="kpp"?"ober":kind==="tel"?"nurse":"p_"+id}
function fmScore(k){const v=S.fm[k];return typeof v==="number"?v:null}
function fmSet(k,v){S.fm[k]=Math.max(fmScore(k)||0,v);save()}
const FM_BACK=`<a class="back" href="#famed">← Дополнительные модули</a>`;
function sayAll(src){return (TTS||AUD)?`<button type="button" class="say" data-action="say-src" data-src="${src}">слушать образец</button>`:""}
function srcSegs(src){const [k,id,i]=src.split(":");if(k==="kpa"&&KP[id]){const q=kppQs(byId(id))[+i];return q?sents(q.a):[]}if(k==="aufkl"&&AUFKL[id])return sents(AUFKL[id].muster);if(k==="tel"&&TEL[id])return [modelSpell(TEL[id].sur),modelSpell(TEL[id].drug)];return []}

/* spelling: codewords (traditional and DIN 5009), letter names, single letters; "K wie Kaufmann" counts once */
const SPELL_CODE={},SPELL_LET={};
ABC.forEach(([l,o,n])=>{const L=l.toLowerCase();SPELL_CODE[o.toLowerCase()]=L;if(n!=="—"&&!/^umlaut /i.test(n))SPELL_CODE[n.toLowerCase()]=L});
[["bertha","b"],["caesar","c"],["konrad","k"],["marta","m"],["siegfried","s"],["xaver","x"],["zeppelin","z"]].forEach(([w,l])=>{SPELL_CODE[w]=l});
"a:a b:be b:bé c:ce c:zeh c:tse d:de d:dee e:eh f:ef f:eff g:ge g:geh h:ha i:ih j:jot k:ka l:el l:ell m:em m:emm n:en n:enn o:oh p:pe p:peh q:qu q:ku q:kuh r:er r:err s:es s:ess t:te t:teh u:uh v:vau v:fau w:we w:weh x:ix x:iks y:ypsilon z:zett z:zet".split(" ").forEach(p=>{const [l,w]=p.split(":");SPELL_LET[w]=l});
"abcdefghijklmnopqrstuvwxyzäöü".split("").forEach(l=>{SPELL_LET[l]=l});
function spellLetters(text){const raw=str(text).split(/[^A-Za-zÄÖÜäöüß]+/).filter(Boolean);let out="";
  const toks=[];raw.forEach(w=>{if(w.length>1&&w===w.toUpperCase()&&/^[A-ZÄÖÜ]+$/.test(w))w.split("").forEach(x=>toks.push(x.toLowerCase()));else toks.push(w.toLowerCase())});
  const one=w=>SPELL_CODE[w]||SPELL_LET[w]||"";
  for(let i=0;i<toks.length;i++){const w=toks[i];
    if(w==="doppel"||w==="doppelt"){const L=one(toks[i+1]||"");if(L){out+=L+L;i++}continue}
    if(w==="umlaut"){const L=one(toks[i+1]||"");if(L){out+=({a:"ä",o:"ö",u:"ü"})[L]||L;i++}continue}
    if(toks[i+1]==="wie"&&SPELL_CODE[toks[i+2]]){out+=SPELL_CODE[toks[i+2]];i+=2;continue}
    out+=one(w)}
  return out.toUpperCase()}
const surOk=(T,L)=>L.includes(T.sur)||(T.alt||[]).some(a=>L.includes(a));
function modelSpell(word){return word.split("").map(ch=>{const r=ABC.find(x=>x[0]===ch);return ch+" wie "+(r?r[1]:ch)}).join(", ")+"."}
function telLines(){const T=TEL_TXT;return [T.intro.w,T.intro.m,T.sur.w,T.sur.m,T.ok,T.dob,T.drug,T.dose,T.end,T.spell,T.retry,T.dobRetry,T.doseRetry,T.next]}

/* --- Patientenaufklärung --- */
function famedNextHTML(mod,id){let h;if(mod==="hoer"){const i=HOER.findIndex(x=>x.id===id);h="#famed-hoer-"+HOER[(i+1)%HOER.length].id}else{const i=CASES.findIndex(c=>c.id===id);h="#famed-"+mod+"-"+CASES[(i+1)%CASES.length].id}
  return `<div class="row"><a class="btn primary" href="${h}">Следующее задание →</a><a class="btn ghost" href="#famed">Все модули</a></div>`}
function aufklTrack(c,ch,text){const A=AUFKL[c.id];const n=norm(text);ch.pts=ch.pts||new Set();A.pts.forEach(p=>{if(p[2].test(n))ch.pts.add(p[0])});
  let f=findFachA(n);if(f&&(c.knows||[]).includes(f.term))f=null;if(f){ch.fach=ch.fach||[];if(!ch.fach.some(x=>x.term===f.term))ch.fach.push(f)}return {n,f}}
function aufklReply(c,ch,text){const A=AUFKL[c.id];const {n,f}=aufklTrack(c,ch,text);ch.qi=ch.qi||0;ch.qres=ch.qres||[];
  const ask=()=>{if(ch.qi<A.qs.length){const q=A.qs[ch.qi][0];ch.pend={i:ch.qi,tries:0};ch.qi++;ch.exp=0;return [q]}return null};
  if(f)return [FACH_REPLY];
  if(/wie bitte|wiederholen|nicht verstanden/.test(n)&&ch.last)return ch.last;
  if(/auf wiedersehen|tschüss|alles gute|gute besserung/.test(n)){ch.fin=true;return ["Vielen Dank. Auf Wiedersehen."]}
  if(ch.pend){const i=ch.pend.i;if(A.qs[i][1].test(n)){ch.qres[i]=true;ch.pend=null;return [AUFKL_OK[ch.qres.filter(Boolean).length%AUFKL_OK.length]]}
    if(ch.pend.tries<1){ch.pend.tries++;return [AUFKL_UNCLEAR]}ch.qres[i]=false;ch.pend=null;return [AUFKL_MEH]}
  if(ch.turns.length<=2&&/guten (tag|morgen|abend)|hallo|grüss gott/.test(n)&&!(ch.pts&&ch.pts.size))return ["Guten Tag. Schön, dass Sie Zeit für mich haben."];
  const invite=/(haben sie|gibt es)( noch)?( irgendwelche| eine| weitere)? fragen|ist (das|alles) (so )?(klar|verständlich)|noch etwas unklar|alles verstanden/.test(n);
  const consent=/einverstanden|unterschreiben|einwilligung|zustimmen/.test(n);
  if(invite||consent){const q=ask();if(q)return q;if(consent||ch.noMore){ch.fin=true;return [A.end]}ch.noMore=true;return [AUFKL_NOMORE]}
  ch.exp=(ch.exp||0)+1;
  if(ch.exp>=2){const q=ask();if(q)return q}
  ch.ack=(ch.ack||0)+1;return [AUFKL_ACK[ch.ack%AUFKL_ACK.length]]}
function sendAufkl(id,text){const ch=chatOf(id,"aufkl");const c=byId(id);if(!text)return;
  if(ch.fin){ch.err="Разговор завершён. Нажмите «Начать заново», чтобы повторить.";paintChat(id,"aufkl");return}
  ch.turns.push({role:"user",content:text});if(!ch.start)ch.start=Date.now();ch.end=0;ch.mode="free";
  const segs=aufklReply(c,ch,text);ch.turns.push({role:"assistant",content:segs.join(" "),segs});ch.last=segs;ch.err="";paintChat(id,"aufkl");
  if(ch.fin){LIVE.end=true;aufklFinish(id)}
  speakSegs(segs,"p_"+id).then(liveNext)}
function aufklPtsHTML(c){const A=AUFKL[c.id];const got=chatOf(c.id,"aufkl").pts||new Set();
  return A.pts.map(p=>{const ok=got.has(p[0]);return `<div class="cl-item${ok?" ok":""}"><span class="box" aria-hidden="true"></span><div class="cl-body"><span class="cl-t" lang="de">${esc(p[1])}${ok?`<span class="sr"> (объяснено)</span>`:""}</span></div></div>`}).join("")}
function paintPts(id){const el=$("#aufkl-pts");if(!el)return;el.innerHTML=aufklPtsHTML(byId(id));const n=$("#pts-n");if(n){const ch=chatOf(id,"aufkl");n.textContent=((ch.pts&&ch.pts.size)||0)+" / "+AUFKL[id].pts.length}}
function aufklSumHTML(c,ch){const A=AUFKL[c.id];const got=ch.pts||new Set();const ok=A.pts.filter(p=>got.has(p[0]));const miss=A.pts.filter(p=>!got.has(p[0]));const pct=Math.round(ok.length/A.pts.length*100);const free=ch.mode!=="ai";
  let h=`<div class="fb"><span class="eyebrow">Итог · разъяснение</span><p class="fb-sum">Объяснено ${ok.length} из ${A.pts.length} пунктов, время ${mmss(ch)}.</p>
    <div class="fb-sec"><h3>Пункты разъяснения</h3><div class="meter" role="img" aria-label="Объяснено ${ok.length} из ${A.pts.length}"><i style="width:${pct}%"></i></div>${miss.length?`<p class="small">Не прозвучало:</p><ul class="plain">${miss.map(p=>`<li lang="de">${esc(p[1])}</li>`).join("")}</ul>`:`<p class="small">Все пункты прозвучали.</p>`}</div>
    <div class="fb-sec"><h3>Вопросы пациента</h3><ul class="plain">${A.qs.map((q,i)=>{const st=!free?"":ch.qres&&ch.qres[i]===true?"ответ засчитан":ch.qres&&ch.qres[i]===false?"ответ неполный":ch.pend&&ch.pend.i===i?"вопрос без ответа":"не дошли";
      return `<li><span lang="de"><b>${esc(q[0])}</b></span>${st?` <span class="muted">— ${st}</span>`:""}<br><span class="small muted">Пример ответа:</span> <span class="small" lang="de">${esc(q[2])}</span></li>`}).join("")}</ul></div>`;
  if(ch.fach&&ch.fach.length)h+=`<div class="fb-sec"><h3>Термины, которые пациент не понял</h3><ul class="plain">${ch.fach.map(f=>`<li lang="de"><b>${esc(f.term)}</b> → ${esc(f.lay)}</li>`).join("")}</ul><p class="small muted">С пациентом используйте простые слова.</p></div>`;
  h+=`<div class="fb-sec"><h3>Образец объяснения</h3><p class="pre small" lang="de">${esc(A.muster)}</p>${sayAll("aufkl:"+c.id)}</div>`;
  if(free)h+=`<p class="small muted">Без ИИ проверяется, прозвучали ли ключевые пункты, но не грамматика.</p>`;
  if(KEY&&free)h+=`<div class="row"><button type="button" class="btn primary" data-action="ai-aufkl">Разбор грамматики с ИИ</button></div>`;
  return h+(R.v==="famed"?famedNextHTML("aufkl",c.id):"")+"</div>"}
function aufklFinish(id){const ch=chatOf(id,"aufkl");if(!ch.end)ch.end=Date.now();ch.sum=true;const c=byId(id);const A=AUFKL[id];
  if(R.v==="famed")fmSet("aufkl_"+id,Math.round(((ch.pts&&ch.pts.size)||0)/A.pts.length*100));const s=$("#free-aufkl");if(s&&viewIs(id))s.innerHTML=aufklSumHTML(c,ch)}
function aufklRules(c){const A=AUFKL[c.id];return [
 "Rollenspiel zur Vorbereitung auf die Fachsprachprüfung Medizin (Teil: Aufklärungsgespräch).",
 c.persona.split(".")[0]+".",
 `Die Ärztin oder der Arzt (der Nutzer) klärt dich jetzt auf über: ${A.de}. Die Nachrichten stammen aus einer Spracherkennung und können Erkennungsfehler enthalten. Deine Antworten werden laut vorgelesen: nur gesprochene Sprache, keine Aufzählungen, keine Sternchen.`,
 "Regeln:",
 "- Antworte als Patient/in in der Ich-Form, kurz (1 bis 2 Sätze), in einfacher Alltagssprache.",
 "- Wenn die Ärztin oder der Arzt einen Fachbegriff benutzt, den ein Laie nicht kennt, frage nach, was das bedeutet.",
 "- Stelle im Lauf des Gesprächs diese Fragen, immer nur eine pro Nachricht und erst, wenn es passt: "+A.qs.map(q=>"„"+q[0]+"“").join(" "),
 "- Wenn eine Antwort unklar oder unvollständig ist, frage einmal nach.",

function sendTel(id,text){const ch=chatOf(id,"tel");const c=byId(id);const T=TEL[id];const g=c.sex==="w"?"w":"m";
  const say=segs=>{ch.turns.push({role:"assistant",content:segs.join(" "),segs});ch.last=segs;ch.err="";paintChat(id,"tel");speakSegs(segs,"nurse").then(liveNext)};
  if(!ch.step){ch.step=1;ch.tries=0;ch.res={};ch.mode="free";if(!ch.start)ch.start=Date.now();say([TEL_TXT.intro[g]]);return}
  if(!text)return;
  if(ch.fin){ch.err="Разговор завершён. Нажмите «Начать заново», чтобы повторить.";paintChat(id,"tel");return}
  ch.turns.push({role:"user",content:text});const n=norm(text);const L=spellLetters(text);
  if(/wie bitte|bitte wiederholen|können sie das wiederholen/.test(n)&&L.length<3&&ch.last){say(ch.last);return}
  const next=(nextLine)=>{ch.step++;ch.tries=0;say([TEL_TXT.ok,nextLine])};
  const fail=(retry,nextLine)=>{if(ch.tries<1){ch.tries++;say([retry]);return}ch.step++;ch.tries=0;say([TEL_TXT.next,nextLine])};
  if(ch.step===1){ch.step=2;ch.tries=0;say([TEL_TXT.sur[g]]);return}
  if(ch.step===2){ch.res.sur={ok:surOk(T,L),heard:L,tries:ch.tries+1};if(ch.res.sur.ok)return next(TEL_TXT.dob);return fail(L.length?TEL_TXT.retry:TEL_TXT.spell,TEL_TXT.dob)}
  if(ch.step===3){const ok=T.d.test(n)&&T.m.test(n)&&T.y.test(n);ch.res.dob={ok,heard:text,tries:ch.tries+1};if(ok)return next(TEL_TXT.drug);return fail(TEL_TXT.dobRetry,TEL_TXT.drug)}
  if(ch.step===4){ch.res.drug={ok:L.includes(T.drug),heard:L,tries:ch.tries+1};if(ch.res.drug.ok)return next(TEL_TXT.dose);return fail(L.length?TEL_TXT.retry:TEL_TXT.spell,TEL_TXT.dose)}
  if(ch.step===5){const ok=T.mg.test(n)&&T.fr.test(n);ch.res.dose={ok,heard:text,tries:ch.tries+1};
    if(!ok&&ch.tries<1){ch.tries++;say([TEL_TXT.doseRetry]);return}
    ch.step=6;ch.fin=true;ch.end=Date.now();LIVE.end=true;say(ok?[TEL_TXT.end]:[TEL_TXT.next,TEL_TXT.end]);telFinish(id)}}
function telEval(c,ch){if(ch.mode==="free"&&ch.res)return ch.res;const T=TEL[c.id];const us=ch.turns.filter(t=>t.role==="user").map(t=>t.content);
  const any=f=>us.some(f);return {sur:{ok:any(t=>surOk(T,spellLetters(t)))},dob:{ok:any(t=>{const n=norm(t);return T.d.test(n)&&T.m.test(n)&&T.y.test(n)})},

/* ---------- KP evaluation: 10 areas and a training verdict (not an official result) ---------- */
const KP_V={ok:"Anforderungen erfüllt",teil:"Anforderungen teilweise erfüllt",nicht:"Nicht ausreichend"};
const KP_SCORE_NOTE="Keine offizielle Prüfungsnote. Dient nur zur Verlaufskontrolle.";
const KP_RULE="Правило тренажёра: «Anforderungen erfüllt» — анамнез, осмотр, диагностика, отчёт и разговор с комиссией от 60% и безопасность пациента от 60%. «Nicht ausreichend» — хотя бы одна из этих частей ниже 40% или критическая ошибка. В остальных случаях — «teilweise erfüllt». Это оценка тренажёра, а не решение комиссии.";
const pc100=x=>Math.max(0,Math.min(100,Math.round(+x||0)));
function kpEval(id,src){const K=KP[id];const qs=kppQs(byId(id));const H=arr(src.hits).length?src.hits:qs.map(()=>new Set());const hs=i=>H[i]instanceof Set?H[i]:new Set();
  const qPct=pred=>{let g=0,n=0;qs.forEach((q,i)=>{if(pred(q)){g+=hs(i).size;n+=q.k.length}});return n?Math.round(g/n*100):null};
  const done=src.done instanceof Set?src.done:new Set(),ord=src.ord instanceof Set?src.ord:new Set();const ke=K.exam.filter(e=>e[4]),kt=K.tests.filter(t=>t[4]);
  const pu=Math.round(ke.filter(e=>done.has(e[0])).length/ke.length*100),pt=Math.round(kt.filter(t=>ord.has(t[0])).length/kt.length*100);
  const pq=qPct(q=>q.t==="Diagnostik");const pd=pq==null?pt:Math.round((pt+pq)/2);
  const okS=sp=>sp.e?done.has(sp.e):sp.t?ord.has(sp.t):(()=>{const i=qs.findIndex(q=>q.id===sp.q);return i>=0&&sp.k.every(k=>hs(i).has(k))})();
  const sf=arr(K.safe);const ps=sf.length?Math.round(sf.filter(x=>okS(x[1])).length/sf.length*100):null;
  const tot=qs.reduce((a,q)=>a+q.k.length,0);const g=Math.round(qs.reduce((a,q,i)=>a+hs(i).size,0)/tot*100);
  const dims=[["Anamnese",src.anam==null?null:src.anam],["Körperliche Untersuchung",pu],["Diagnostik",pd],["Differentialdiagnostik",qPct(q=>q.t==="Differenzialdiagnosen")],["Therapie",qPct(q=>q.t==="Therapie")],["Pharmakologie",qPct(q=>q.t==="Pharmakologie")],["Notfallmanagement",qPct(q=>q.t==="Notfall")],["Patientensicherheit",ps],["Bericht",src.bericht==null?null:src.bericht],["Prüfungsgespräch",g]];
  return kpVerdict(dims,!!src.crit,sf.filter(x=>!okS(x[1])).map(x=>x[0]))}
function kpVerdict(dims,crit,safeMiss){const v=n=>{const d=dims.find(x=>x[0]===n);return d?d[1]:null};
  const core=["Anamnese","Körperliche Untersuchung","Diagnostik","Bericht","Prüfungsgespräch"].map(v);const ps=v("Patientensicherheit");
  const known=core.filter(x=>x!=null);const score=known.length?Math.round(known.reduce((x,y)=>x+y,0)/known.length):0;
  const verdict=crit||core.some(x=>x==null||x<40)?"nicht":core.every(x=>x>=60)&&(ps==null||ps>=60)?"ok":"teil";
  return {dims,score,verdict,crit:!!crit,safeMiss:arr(safeMiss)}}
function kpVerdictHTML(ev){const vd=KP_V[ev.verdict]?ev.verdict:"teil";
  return `<div class="verdict ${vd}"><span class="eyebrow">Trainingseinschätzung</span><b lang="de">${KP_V[vd]}</b>${ev.crit?`<span class="crit" lang="de"><b>Kritischer Fehler</b></span>`:""}<span class="small" lang="de">Interner Trainingsscore: ${pc100(ev.score)}/100</span><span class="small muted" lang="de">${KP_SCORE_NOTE}</span></div>`}
function kpDimsHTML(dims){return arr(dims).map(([l,p])=>`<div class="fb-sec"><div class="bar-row"><span lang="de">${esc(l)}</span><span class="mono">${p==null?"nicht geprüft":pc100(p)+"%"}</span></div><div class="meter" aria-hidden="true"><i style="width:${p==null?0:pc100(p)}%"></i></div></div>`).join("")}

  const rec={ts:Date.now(),kind:"kpx",case:id,score:ev.score,verdict:ev.verdict,crit:false,dims:ev.dims,safeMiss:ev.safeMiss,topics,eMiss:res.eMiss,tMiss:res.tMiss,miss:res.bMiss,
    missed:c.items.filter(i=>!cov.has(i.id)).map(i=>i.id),dur:Object.values(KX.dur).reduce((a,b)=>a+(+b||0),0),
    det:{t:hTurns(pa),notes:str(KX.notes).slice(0,4000),u:hTurns(pu),bericht:str(KX.bericht).slice(0,8000),qa:qs.map((q,i)=>[q.q,arr(pp.ans&&pp.ans[i]).join(" "),hits[i]instanceof Set?hits[i].size:0,q.k.length]),durs:KX.dur}};

function kdBuild(){const w=weakKP();const weakT=new Set((w?w.topics:[]).map(x=>x[0]));
  const mU=new Set(),mD=new Set(),mB=new Set();
  arr(S.hist).filter(h=>/^kp/.test(h.kind||"")&&KP[h.case]).slice(-12).forEach(h=>{if(arr(h.eMiss).length)mU.add(h.case);if(arr(h.tMiss).length)mD.add(h.case);if((h.kind==="kpb"||h.kind==="kpx")&&arr(h.miss).length)mB.add(h.case)});
  const pool=[];CASES.filter(c=>KP[c.id]).forEach(c=>{kppQs(c).forEach((q,i)=>{if(q.t!=="Fallvorstellung")pool.push({type:"q",cid:c.id,i,t:q.t,w:weakT.has(q.t)?3:0})});
    pool.push({type:"u",cid:c.id,t:"Untersuchung",w:mU.has(c.id)||weakT.has("Untersuchung")?3:0});pool.push({type:"d",cid:c.id,t:"Diagnostik",w:(mD.has(c.id)?3:0)+(weakT.has("Diagnostik")?2:0)});pool.push({type:"b",cid:c.id,t:"Bericht",w:mB.has(c.id)||weakT.has("Bericht")?3:0})});
  const weak=shuffle(pool.filter(x=>x.w>0)).sort((a,b)=>b.w-a.w);const rest=shuffle(pool.filter(x=>!x.w));const n=Math.min(8,Math.max(6,weak.length));
  KD={tasks:shuffle([...weak,...rest].slice(0,n)),i:0,res:[],weakBefore:[...weakT].concat([...mU].length?["Untersuchung"]:[],[...mD].length?["Diagnostik"]:[],[...mB].length?["Bericht"]:[]),fromHist:!!w,saved:false}}
function kdTask(t){const c=byId(t.cid),K=KP[t.cid];const ctx=`${c.anrede} ${c.name}, ${c.alter} J. · ${K.dx}`;

  if(t.type==="d"){const kt=K.tests.filter(x=>x[4]);return {ctx,q:"Welche Diagnostik veranlassen Sie?",keys:kt.map(x=>[x[1],x[2]]),a:kt.map(x=>x[1]+": "+x[3]).join("\n")}}
  return {ctx,q:"Nennen Sie die wichtigsten Punkte für den Bericht: Befunde, Diagnose und Behandlungsplan.",keys:K.rep,a:K.bericht.split("\n\n").filter(p=>/^(Befunde|Diagnose|Behandlungsplan):/.test(p)).join("\n\n")}}

/* ---------- 5-minute drill on weak spots ---------- */
let DR=null;
const STOPW=new Set(["eine","einer","einem","einen","oder","durch","über","sich","nicht","beim","sehr","eines","wenn","dass","statt","ohne"]);
function buildDrill(){const w=weak();const tasks=[];
  const hasIntent=id=>INTENTS.some(it=>it.ids.includes(id));
  const topicIds=(w?w.topics.map(t=>t[0]):[]).filter(id=>id!=="leit"&&hasIntent(id));
  for(const id of [...topicIds,"allerg","med","fam","noxen","voroper","vorerk"]){if(tasks.length>=4)break;if(!tasks.some(t=>t.id===id))tasks.push({type:"topic",id})}
  const terms=[];
  for(const [t] of (w?w.fach:[])){const f=FACH.find(x=>x.term===t);if(f&&terms.length<3&&!terms.includes(f))terms.push(f)}
  for(const f of shuffle(FACH.filter(x=>VOCAB.some(v=>v[0].startsWith(x.term)&&v[3]==="sym")))){if(terms.length>=3)break;if(!terms.includes(f))terms.push(f)}
  terms.forEach(f=>tasks.push({type:"term",f}));
  DR={tasks:shuffle(tasks),i:0,res:[]}}
function layStems(lay){return str(lay).toLowerCase().replace(/ß/g,"ss").split(/[^a-zäöü]+/).filter(x=>x.length>=4&&!STOPW.has(x)).map(x=>x.slice(0,4))}
function drillCheck(text){if(!DR)return;const t=DR.tasks[DR.i];if(!t||DR.res[DR.i])return;const n=norm(text);let ok=false,msg="";
  if(t.type==="topic"){const f=findFach(n);const hit=INTENTS.some(it=>it.ids.includes(t.id)&&it.re.test(n)&&!(it.not&&it.not.test(n)));
    if(f)msg=`Пациент не поймёт слово «${f.term}». Скажите проще: ${f.lay}.`;
    else if(hit){ok=true;msg="Тема узнана: пациент понял бы этот вопрос."}
    else msg="Тренажёр не узнал тему в этой фразе."}
  else{const used=t.f.re.test(n);const hit=layStems(t.f.lay).some(s=>n.includes(s));
    if(used)msg=`Вы повторили сам термин «${t.f.term}». Пациенту нужно объяснение без него.`;
    else if(hit){ok=true;msg="Похоже на понятное объяснение."}
    else msg="В объяснении нет ключевых простых слов."}
  DR.res[DR.i]={ok,msg,text};paintDrill()}
function drillShellHTML(){return `<section class="hero"><span class="eyebrow">Тренировка слабых мест</span><h1>5 минут на ваши ошибки</h1><p class="lede">Задания собраны из ваших прошлых тренировок: темы, которые вы забываете, и термины, которые пациент не понял. Отвечайте голосом по-немецки.</p></section><section id="drill-body"></section>`}
function paintDrill(){const b=$("#drill-body");if(!b)return;if(!DR)buildDrill();const t=DR.tasks[DR.i];
  if(!t){const ok=DR.res.filter(r=>r&&r.ok).length;b.innerHTML=`<div class="card"><span class="eyebrow">Итог</span><span class="term">${ok} из ${DR.tasks.length}</span><span class="hint">Повторяйте тренировку, пока все задания не будут засчитаны.</span></div><div class="row"><button type="button" class="btn primary" data-action="drill-new">Ещё раз</button><a class="btn" href="#home">На главную</a></div>`;return}
  const r=DR.res[DR.i];const ex=t.type==="topic"?topicQ(t.id):t.f.lay;
  b.innerHTML=`<div class="card"><span class="eyebrow">Задание ${DR.i+1} из ${DR.tasks.length}</span>
    ${t.type==="topic"?`<span class="hint">Спросите пациента про тему:</span><span class="term" lang="de">${esc(topicLabel(t.id))}</span>`:`<span class="hint">Объясните пациенту простыми словами:</span><span class="term" lang="de">${esc(t.f.term)}</span>`}</div>
    ${SR?`<div class="dict">${micBtn("drill:answer")}${liveBox("drill:answer","Нажмите микрофон и скажите фразу по-немецки.")}</div>`:""}
    <form class="drill-form row" data-drill="1"><label class="sr" for="drill-in">Ваш ответ</label><input id="drill-in" type="text" lang="de" placeholder="Или напечатайте ответ" style="flex:1;min-width:0"><button type="submit" class="btn">Проверить</button></form>
    ${r?`<div class="fb"><p class="${r.ok?"ok-t":"err"}">${r.ok?"Засчитано. ":"Не засчитано. "}${esc(r.msg)}</p><p class="small"><span class="muted">Вы сказали:</span> <span lang="de">${esc(r.text)}</span></p><p class="small"><span class="muted">${t.type==="topic"?"Пример вопроса":"Простыми словами"}:</span> <span lang="de">${esc(ex)}</span></p>${(TTS||AUD)?`<button type="button" class="say" data-action="drill-say">послушать пример</button>`:""}</div>`:""}
    <div class="row"><button type="button" class="btn ${r?"primary":"ghost"}" data-action="drill-next">${r?"Дальше":"Пропустить"}</button></div>`;
  paintRec()}

/* ---------- FaMed exam: 3 stations, 5 situations with different patients (format per famed-test.de/pruefungsablauf, checked 08.10.2026) ---------- */
/* Scoring rubrics. FSP: one general training rubric until Ärztekammer-specific rules are entered. FaMed: format per famed-test.de; add variants here if rules differ by venue. */
const FSP_RUBRIC={allgemein:{name:"Allgemeines FSP-Trainingsschema",parts:["voc","anam","docS","docK","vorK","ober"]}};
const FAMED_FMT={standard:{name:"famed-test.de, Stand 08.10.2026",anam:11,aufkl:[90,11],vor:[90,11],doc:22,brk:60,pass:60}};
let FX=null;
const FX_TITLE={anam:"Anamnesegespräch",aufkl:"Aufklärungsgespräch",vor:"Patientenvorstellung",doc:"Dokumentation"};
const FX_STATION={anam:"Arzt-Patienten-Kommunikation",aufkl:"Arzt-Patienten-Kommunikation",vor:"Arzt-Arzt-Kommunikation",doc:"Schriftliche Station"};
const FX_PASS=FAMED_FMT.standard.pass;
function fxStep(){return FX&&!FX.done&&FX.i<FX.steps.length?FX.steps[FX.i]:null}
function fxKind(s){return s.k==="anam"?"patient":s.k==="aufkl"?"aufkl":s.k==="vor"?"ober":null}

  const F=FAMED_FMT.standard;const ap=[{k:"anam",cid:A,read:0,min:F.anam},{k:"aufkl",cid:B,read:F.aufkl[0],min:F.aufkl[1]}],aa=[{k:"vor",cid:C,read:F.vor[0],min:F.vor[1],n:1},{k:"vor",cid:D||B,read:F.vor[0],min:F.vor[1],n:2}];
  const steps=[];(Math.random()<0.5?[ap,aa]:[aa,ap]).forEach((st,si)=>st.forEach(s=>{s.st=si;steps.push(s)}));steps.push({k:"doc",hid:h.id,read:0,min:F.doc,st:2});
  steps.forEach(s=>{const k=fxKind(s);if(k){const ch=CH[s.cid+":"+k];if(ch&&ch.ctl)ch.ctl.abort();delete CH[s.cid+":"+k]}});delete FREE[A];delete COV[A];
  HP.pos[h.id]=0;HP.n[h.id]=0;
  EX=null;FX={steps,i:0,phase:steps[0].read?"read":"talk",t0:Date.now(),notes:"",doc:"",ai:null,done:false};render()}
function fxPhaseLen(){const s=fxStep();if(!s)return 1;return FX.phase==="break"?FAMED_FMT.standard.brk:FX.phase==="read"?s.read:s.min*60}
function fxLeft(){if(!fxStep())return 0;return fxPhaseLen()-Math.floor((Date.now()-FX.t0)/1000)}
function fxNext(auto){const s=fxStep();if(!s)return;stopRec();stopVoice();HP.tok++;HP.on=false;
  if(FX.phase==="break")FX.phase=s.read?"read":"talk";
  else if(FX.phase==="read")FX.phase="talk";
  else{const k=fxKind(s);if(k){const ch=chatOf(s.cid,k);if(ch.ctl)ch.ctl.abort();if(!ch.end)ch.end=Date.now()}
    s.dur=Math.min(s.min*60,Math.round((Date.now()-FX.t0)/1000));if(auto)s.timeout=true;
    FX.i++;const n=FX.steps[FX.i];if(!n)fxFinish();else FX.phase=n.st!==s.st?"break":(n.read?"read":"talk")}
  FX.t0=Date.now();sessSave();if(R.v==="exam")render()}
function fxFinish(){FX.done=true;
  for(const s of FX.steps){
    if(s.k==="anam"){const c=byId(s.cid);const rec=recFromChat(s.cid,chatOf(s.cid,"patient"),"exam");if(s.dur)rec.dur=s.dur;rec.fmt="famed";pushHist(rec);
      s.pct=Math.round(rec.cov/rec.total*100);s.miss=c.items.filter(i=>rec.missed.includes(i.id)).map(i=>i.t)}
    else if(s.k==="aufkl"){const A=AUFKL[s.cid];const got=chatOf(s.cid,"aufkl").pts||new Set();s.pct=Math.round(A.pts.filter(p=>got.has(p[0])).length/A.pts.length*100);s.miss=A.pts.filter(p=>!got.has(p[0])).map(p=>p[1])}
    else if(s.k==="vor"){const ob=chatOf(s.cid,"ober");const keys=KEYS[s.cid]||[];const said=ob.turns.filter(t=>t.role==="user").map(t=>t.content).join(" ");const hit=keys.filter(k=>k[1].test(said));
      const ans=ob.qs?ob.ans.filter(a=>a.length).length:ob.turns.filter(t=>t.role==="user").length;const tot=ob.qs?ob.qs.length:Math.max(ans,5);
      s.pct=Math.round(((keys.length?hit.length/keys.length:0)+Math.min(1,ans/tot))*50);s.miss=keys.filter(k=>!hit.includes(k)).map(k=>k[0])}
    else{const g=hoerRes(hoerOf(s.hid),FX.doc);s.pct=Math.round(g.filter(x=>x[1]).length/g.length*100);s.miss=g.filter(x=>!x[1]).map(x=>x[0])}}
  const last=arr(S.hist).slice(-1)[0];if(last&&last.kind==="exam"&&last.fmt==="famed"){last.score=Math.round(FX.steps.reduce((a,x)=>a+x.pct,0)/FX.steps.length);
    last.parts=FX.steps.map(x=>[x.k,x.n||0,x.pct,x.cid||x.hid,x.dur||0,arr(x.miss).slice(0,12)]);
    last.det={chats:FX.steps.filter(x=>fxKind(x)).map(x=>[x.k,x.n||0,x.cid,hTurns(chatOf(x.cid,fxKind(x)))]),doc:str(FX.doc).slice(0,8000),notes:str(FX.notes).slice(0,4000)};FX.recId=last.id;save()}}
function fxAufklInfo(A){return `<div class="panel" lang="de"><span class="eyebrow">Aufklärung</span><b>${esc(A.de)}</b><ul class="plain">${A.pts.map(p=>`<li>${esc(p[1])}</li>`).join("")}</ul></div>`}

function oberRulesFx(c){return `Rollenspiel zur Vorbereitung auf die Fachsprachprüfung Medizin (FaMed, Teil: Patientenvorstellung). Du bist Oberärztin bzw. Oberarzt. Der Nutzer ist Assistenzärztin bzw. Assistenzarzt und stellt dir gleich ${c.sex==="w"?"die Patientin":"den Patienten"} ${c.anrede} ${c.name} vor. Seine Nachrichten stammen aus einer Spracherkennung und können Erkennungsfehler enthalten. Deine Antworten werden laut vorgelesen: nur gesprochene Sprache, keine Aufzählungen oder Sternchen.

Fakten des Falls:
${factsText(c)}

Regeln:
- Beginne mit einem kurzen Satz und bitte darum, den Fall vorzustellen.
- Höre zu. Danach stelle in jeder Nachricht genau EINE Frage: zu fehlenden Angaben, zur Bedeutung von Fachbegriffen, zur Verdachtsdiagnose und zum weiteren Vorgehen.
- Sprich Deutsch, kollegial und knapp. Siezen. Keine Sprachkorrekturen, keine Bewertung, kein Russisch oder Englisch.
- Nach etwa fünf Fragen bedankst du dich und beendest das Gespräch mit einem Satz.`}
function famedPrompt(){const tr=(id,k,a,b)=>chatOf(id,k).turns.map(t=>(t.role==="user"?a:b)+t.content).join("\n")||"(kein Gespräch)";
  const parts=FX.steps.map((s,i)=>{const c=s.cid?byId(s.cid):null;
    if(s.k==="anam")return `Situation ${i+1} – Anamnesegespräch (${c.anrede} ${c.name}):\n${tr(s.cid,"patient","ARZT: ","PATIENT: ")}`;
    if(s.k==="aufkl")return `Situation ${i+1} – Aufklärungsgespräch über ${AUFKL[s.cid].de}. Wichtige Punkte: ${AUFKL[s.cid].pts.map(p=>p[1]).join("; ")}\n${tr(s.cid,"aufkl","ARZT: ","PATIENT: ")}`;
    if(s.k==="vor")return `Situation ${i+1} – Patientenvorstellung (${c.anrede} ${c.name}). Fakten:\n${factsText(c)}\nGespräch:\n${tr(s.cid,"ober","ASSISTENZARZT: ","OBERARZT: ")}`;
    const h=hoerOf(s.hid);return `Situation ${i+1} – Dokumentation (Anamneseteil eines Arztbriefes nach einem Gespräch).\nTranskript:\n${h.lines.map(([w,t])=>(w==="d"?"ARZT: ":"PATIENT: ")+t).join("\n")}\nText des Arztes:\n<<<\n${FX.doc||"(leer)"}\n>>>`}).join("\n\n");
  return `Du bist erfahrene Prüferin in der Fachsprachprüfung Medizin (Niveau C1). Bewerte eine simulierte FaMed-Prüfung eines ausländischen Arztes mit fünf Situationen. Bewertet werden Sprache und Kommunikation, nicht das medizinische Fachwissen. ${ASR_NOTE}

${parts}

Bewerte jede Kategorie von 0 bis 100 und begründe kurz auf Russisch:
- fachsprache: korrekte medizinische Fachsprache in den Patientenvorstellungen und der Dokumentation
- patientensprache: verständliche Sprache gegenüber den Patienten, keine unerklärten Fachbegriffe
- struktur: logischer Aufbau von Anamnese, Aufklärung, Vorstellungen und Dokumentation
- vollstaendigkeit: Vollständigkeit von Anamnese, Aufklärung und Dokumentation
- dokumentation: sprachliche Qualität der Dokumentation (ganze Sätze, Konjunktiv I, Stil)
Außerdem: bis zu 8 wichtigste sprachliche Fehler (original wörtlich, korrektur, erklaerung auf Russisch), 3 Tipps auf Russisch, ein Fazit in 2 bis 3 Sätzen auf Russisch.

Antworte nur mit JSON in genau dieser Form:
{"scores":{"fachsprache":0,"patientensprache":0,"struktur":0,"vollstaendigkeit":0,"dokumentation":0},"begruendung":{"fachsprache":"...","patientensprache":"...","struktur":"...","vollstaendigkeit":"...","dokumentation":"..."},"corrections":[{"original":"...","korrektur":"...","erklaerung":"..."}],"tipps":["..."],"fazit":"..."}`}

const VOC_N=20,VOC_MIN=20;
function vocOk(term,ans){const v=VOCAB.find(x=>x[0]===term);const n=norm(ans);if(!v||!n.trim())return false;return layStems(v[1]).some(s=>n.includes(s))}

const EXAM_STAGES=["Anamnese","Dokumentation","Vorstellung"];
function examStart(caseId){stopRec();sessDrop();const last=arr(S.hist).filter(h=>h.kind==="exam").map(h=>h.case);
  let id=caseId;if(!id){const fresh=CASES.filter(c=>!last.slice(-2).includes(c.id));const pool=fresh.length?fresh:CASES;id=pool[Math.floor(Math.random()*pool.length)].id}
  ["patient","ober"].forEach(k=>{const ch=CH[id+":"+k];if(ch&&ch.ctl)ch.ctl.abort();delete CH[id+":"+k]});delete FREE[id];delete COV[id];
  const st=SET.vocab?0:1;FX=null;
  EX={caseId:id,stage:st,per:(+SET.examMin||20)*60,t0:{[st]:Date.now()},dur:{},timeout:{},notes:"",brief:"",vor:"",res:null,ai:null,voc:SET.vocab?{items:shuffle(VOCAB).slice(0,VOC_N).map(v=>v[0]),ans:[]}:null};render()}
function exPer(s){return s===0?VOC_MIN*60:EX.per}
function examLeft(){if(!EX||EX.stage>3)return 0;return exPer(EX.stage)-Math.floor((Date.now()-EX.t0[EX.stage])/1000)}
function exNext(auto){if(!EX||EX.stage>3)return;stopRec();stopVoice();
  const s=EX.stage;if(s>0){const active=chatOf(EX.caseId,s===1?"patient":"ober");if(active&&active.ctl)active.ctl.abort()}
  EX.dur[s]=Math.min(exPer(s),Math.round((Date.now()-EX.t0[s])/1000));if(auto)EX.timeout[s]=true;
  if(s===1){const ch=chatOf(EX.caseId,"patient");if(!ch.end)ch.end=Date.now()}
  EX.stage=s+1;EX.t0[EX.stage]=Date.now();
  if(EX.stage===4)examFinish();
  sessSave();if(R.v==="exam")render()}
